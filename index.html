<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS - Enterprise Cloud Sync & Neural Network (v10.2)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <!-- Firebase SDKs (Compat Version for CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #050811;
            --panel-bg: rgba(15, 22, 38, 0.85);
            --border-color: rgba(30, 41, 59, 0.8);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-rgb: 56, 189, 248;
            --accent-hover: #0ea5e9;
            --error-red: #f43f5e;
            --success-green: #10b981;
        }

        body.theme-cyberpunk {
            --bg-dark: #0f051d; --panel-bg: rgba(26, 11, 46, 0.85);
            --border-color: rgba(236, 72, 153, 0.3); --accent-blue: #f43f5e; --accent-rgb: 244, 63, 94; --accent-hover: #e11d48;
        }

        body.theme-matrix {
            --bg-dark: #020d08; --panel-bg: rgba(5, 26, 15, 0.85);
            --border-color: rgba(16, 185, 129, 0.3); --accent-blue: #10b981; --accent-rgb: 16, 185, 129; --accent-hover: #059669;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-dark);
            color: var(--text-main); font-family: 'Cairo', sans-serif;
            display: flex; height: 100vh; overflow: hidden; position: relative;
            transition: background-color 0.4s ease;
        }

        #neural-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; opacity: 0.6;
        }

        .sidebar {
            width: 340px; background-color: var(--panel-bg);
            backdrop-filter: blur(12px); border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
            overflow-y: auto; z-index: 2;
        }

        .logo-area {
            font-size: 20px; font-weight: 700; color: var(--text-main);
            margin-bottom: 15px; border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }

        .user-profile-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px; padding: 10px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-blue); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; }
        .user-details { display: flex; flex-direction: column; font-size: 11px; }
        .user-name { font-weight: bold; color: var(--text-main); }
        .user-email { color: var(--text-muted); font-size: 10px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .btn-auth {
            background: rgba(var(--accent-rgb), 0.15); border: 1px solid var(--accent-blue);
            color: var(--accent-blue); padding: 8px; border-radius: 6px;
            cursor: pointer; font-weight: 600; font-family: 'Cairo'; width: 100%;
            margin-bottom: 12px; transition: all 0.2s; font-size: 12px;
        }
        .btn-auth:hover { background: var(--accent-blue); color: #000; }

        .btn-new-chat {
            background: rgba(var(--accent-rgb), 0.1); border: 1px solid var(--accent-blue);
            color: var(--accent-blue); padding: 10px; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-family: 'Cairo'; width: 100%;
            margin-bottom: 12px; transition: all 0.2s;
        }
        .btn-new-chat:hover { background: var(--accent-blue); color: #000; }

        .search-history-input {
            width: 100%; background: rgba(5, 8, 17, 0.7); border: 1px solid var(--border-color);
            border-radius: 6px; padding: 6px 10px; color: var(--text-main);
            font-size: 12px; font-family: 'Cairo'; margin-bottom: 15px; box-sizing: border-box;
        }

        .section-title-row {
            display: flex; justify-content: space-between; align-items: center; margin: 12px 0 6px 0;
        }

        .section-title {
            font-size: 11px; text-transform: uppercase; color: var(--text-muted);
            letter-spacing: 1px; font-weight: 600;
        }

        .tool-btn {
            background: none; border: 1px solid transparent; color: var(--text-muted);
            padding: 9px 12px; text-align: right; border-radius: 8px; cursor: pointer;
            margin-bottom: 4px; transition: all 0.25s ease; font-size: 13px; font-family: 'Cairo';
            display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box;
        }

        .tool-btn:hover, .tool-btn.active {
            background-color: rgba(30, 41, 59, 0.8); color: var(--accent-blue); border-color: rgba(var(--accent-rgb), 0.3);
        }

        .workspace {
            flex: 1; display: flex; flex-direction: column; padding: 25px;
            box-sizing: border-box; overflow-y: auto; z-index: 2; transition: all 0.3s ease;
        }

        .tool-header h1 { margin: 0 0 6px 0; font-size: 24px; font-weight: 700; color: var(--text-main); }
        .tool-header p { margin: 0; color: var(--text-muted); font-size: 13.5px; }

        .preset-container { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }

        .interface-card {
            background-color: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 20px; margin-bottom: 20px; position: relative;
        }

        .input-wrapper { position: relative; }

        .input-field {
            width: 100%; background-color: rgba(5, 8, 17, 0.7);
            border: 1px solid var(--border-color); border-radius: 8px;
            padding: 15px; color: var(--text-main); font-size: 14.5px;
            font-family: 'Cairo', sans-serif; box-sizing: border-box; resize: vertical;
        }

        .controls-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; gap: 10px; }

        .style-select {
            background: rgba(5, 8, 17, 0.7); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: 'Cairo';
        }

        .action-btn {
            background-color: var(--accent-blue); color: #030712; border: none;
            padding: 10px 24px; font-size: 14.5px; font-weight: 700; border-radius: 8px;
            cursor: pointer; font-family: 'Cairo', sans-serif; transition: all 0.2s ease;
        }

        .action-btn:hover { background-color: var(--accent-hover); }

        .output-panel {
            background-color: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 25px; min-height: 150px; line-height: 1.8; position: relative;
        }

        .icon-btn {
            background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border-color);
            color: var(--text-muted); padding: 4px 8px; border-radius: 6px;
            cursor: pointer; font-size: 11.5px; transition: all 0.2s;
        }
        .icon-btn:hover { color: var(--accent-blue); border-color: var(--accent-blue); }

        .session-item {
            display: flex; flex-direction: column; gap: 4px;
            padding: 8px 10px; border-radius: 8px; font-size: 12px; color: var(--text-muted);
            cursor: pointer; margin-bottom: 6px; background: rgba(15, 22, 38, 0.5);
            border: 1px solid transparent; transition: all 0.2s;
        }
        .session-item:hover { background: rgba(30, 41, 59, 0.8); color: var(--text-main); border-color: var(--border-color); }
        .session-item.pinned { border-right: 3px solid var(--accent-blue); background: rgba(var(--accent-rgb), 0.08); }

        .session-item-header { display: flex; justify-content: space-between; align-items: center; }
        .session-meta { font-size: 10px; color: var(--text-muted); opacity: 0.7; }

        .status-bar { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 15px; }
        .status-indicator { display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--text-muted); }
        .dot.active { background-color: var(--success-green); box-shadow: 0 0 10px var(--success-green); }
    </style>
</head>
<body>

    <canvas id="neural-canvas"></canvas>

    <div class="sidebar">
        <div class="logo-area">
            <span>Tafkek OS</span>
            <div style="display:flex; gap:5px;">
                <button class="icon-btn" onclick="changeTheme('default')">🔵</button>
                <button class="icon-btn" onclick="changeTheme('cyberpunk')">🔴</button>
                <button class="icon-btn" onclick="changeTheme('matrix')">🟢</button>
            </div>
        </div>

        <div id="auth-section">
            <button id="login-google-btn" class="btn-auth" onclick="loginWithGoogle()">🔑 تسجيل الدخول بواسطة Google</button>
        </div>

        <div id="user-card" class="user-profile-card" style="display: none;">
            <div class="user-info">
                <div id="user-avatar" class="user-avatar">U</div>
                <div class="user-details">
                    <span id="user-name" class="user-name">المستخدم</span>
                    <span id="user-email" class="user-email">user@example.com</span>
                </div>
            </div>
            <button class="icon-btn" onclick="logoutUser()" title="تسجيل الخروج">🚪</button>
        </div>

        <button class="btn-new-chat" onclick="startNewSession()">+ جلسة معالجة جديدة</button>
        <input type="text" class="search-history-input" placeholder="🔍 بحث في سجل السحابة..." oninput="filterHistory(this.value)">
        
        <div class="section-title-row">
            <span class="section-title">الأدوات الحية</span>
        </div>
        <button class="tool-btn active" onclick="switchTool('grounding', this)">🌐 بحث جوجل والتوثيق الفوري</button>
        <button class="tool-btn" onclick="switchTool('deconstruct', this)">🧠 التفكيك المعرفي واللغوي</button>
        <button class="tool-btn" onclick="switchTool('ecom-deconstruct', this)">📊 تفكيك اللوجستيات الرقمية</button>
        <button class="tool-btn" onclick="switchTool('loop-destroyer', this)">⚡ تتبع وحرق الأخطاء البرمجية</button>
        <button class="tool-btn" onclick="switchTool('clean-image', this)">🎨 استوديو التصاميم النظيفة</button>
        <button class="tool-btn" onclick="switchTool('support-agent', this)">🛠️ المساعد الذكي لقنوات الدعم</button>
        
        <div class="section-title-row" style="margin-top: 18px;">
            <span class="section-title">السجل السحابي للمستخدم</span>
        </div>
        <div id="session-history-list"></div>
    </div>

    <div class="workspace">
        <div class="tool-header">
            <h1 id="tool-title">التوثيق والربط ببحث جوجل الفوري</h1>
            <p id="tool-desc">تلقي إجابات حية من الإنترنت مدعومة بروابط مصادر حقيقية.</p>
        </div>

        <div class="preset-container" id="preset-area"></div>

        <div class="interface-card">
            <div class="input-wrapper">
                <textarea id="user-input" class="input-field" rows="4" placeholder="أدخل البيانات أو اسحب المرفقات هنا..."></textarea>
            </div>

            <div class="controls-row">
                <select id="output-style" class="style-select">
                    <option value="detailed">أسلوب تفصيلي شامل</option>
                    <option value="concise">مختصر ومباشر</option>
                    <option value="code">تركيز على الأكواد فقط</option>
                </select>
                <button id="submit-btn" class="action-btn" onclick="executeProcess()">تشغيل النظام المعرفي</button>
            </div>
        </div>

        <div id="output-box" class="output-panel">
            <div id="output-text-container">في انتظار البيانات...</div>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <div id="status-dot" class="dot active"></div>
                <span id="status-text">الحالة السحابية: متصل بمشروع TafkekOS</span>
            </div>
            <div>Tafkek OS Cloud v10.2</div>
        </div>
    </div>

    <script>
        // ==========================================
        // 0. محرك رسم شبكة العصبونات المتحركة (Neural Canvas)
        // ==========================================
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        const particleCount = 45;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.6,
                vy: (Math.random() - 0.5) * 0.6,
                radius: Math.random() * 2 + 1
            });
        }

        function animateNeuralNetwork() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const computedStyle = getComputedStyle(document.documentElement);
            let accentColor = computedStyle.getPropertyValue('--accent-blue').trim() || '#38bdf8';

            ctx.fillStyle = accentColor;
            ctx.strokeStyle = accentColor;

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.globalAlpha = (1 - (dist / 130)) * 0.25;
                        ctx.stroke();
                        ctx.globalAlpha = 1.0;
                    }
                }
            }
            requestAnimationFrame(animateNeuralNetwork);
        }
        animateNeuralNetwork();

        // ==========================================
        // 1. إعداد خدمات Firebase المزودة بمفاتيحك الحقيقية
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCJutNsE1b9jhQb6TRkO4HxcTWEDOe1WUE",
            authDomain: "tafkekos.firebaseapp.com",
            projectId: "tafkekos",
            storageBucket: "tafkekos.firebasestorage.app",
            messagingSenderId: "402724924724",
            appId: "1:402724924724:web:8cf9c04583ff3998c48961",
            measurementId: "G-WT4BBKEKVK"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let savedSessions = [];

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-card').style.display = 'flex';
                document.getElementById('user-name').innerText = user.displayName || 'مستخدم';
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-avatar').innerText = (user.displayName || user.email)[0].toUpperCase();
                fetchUserSessionsCloud();
            } else {
                currentUser = null;
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('user-card').style.display = 'none';
                savedSessions = [];
                renderSessionHistory();
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => alert("خطأ تسجيل الدخول: " + error.message));
        }

        function logoutUser() {
            auth.signOut();
        }

        // ==========================================
        // 2. إدارة السجلات وقواعد البيانات السحابية (Firestore)
        // ==========================================
        function fetchUserSessionsCloud() {
            if (!currentUser) return;

            db.collection('users').doc(currentUser.uid).collection('sessions')
              .orderBy('timestamp', 'desc')
              .onSnapshot(snapshot => {
                  savedSessions = [];
                  snapshot.forEach(doc => {
                      savedSessions.push({ id: doc.id, ...doc.data() });
                  });
                  renderSessionHistory();
              }, error => {
                  console.error("Firestore Error:", error);
              });
        }

        async function saveSessionToCloud(title, prompt, result) {
            if (!currentUser) return;

            const sessionData = {
                title: title,
                toolKey: currentToolKey,
                prompt: prompt,
                result: result,
                pinned: false,
                charCount: result.length,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                date: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })
            };

            await db.collection('users').doc(currentUser.uid).collection('sessions').add(sessionData);
        }

        async function togglePinSession(id, event) {
            event.stopPropagation();
            if (!currentUser) return;
            const session = savedSessions.find(s => s.id === id);
            if (session) {
                await db.collection('users').doc(currentUser.uid).collection('sessions').doc(id).update({
                    pinned: !session.pinned
                });
            }
        }

        async function deleteSession(id, event) {
            event.stopPropagation();
            if (!currentUser) return;
            await db.collection('users').doc(currentUser.uid).collection('sessions').doc(id).delete();
        }

        function renderSessionHistory() {
            const list = document.getElementById('session-history-list');
            list.innerHTML = '';

            if (!currentUser) {
                list.innerHTML = '<div style="font-size:11px; color:var(--text-muted); text-align:center; padding:10px;">يرجى تسجيل الدخول لحفظ واسترجاع محادثاتك.</div>';
                return;
            }

            const sorted = [...savedSessions].sort((a, b) => b.pinned - a.pinned);

            if (sorted.length === 0) {
                list.innerHTML = '<div style="font-size:11px; color:var(--text-muted); text-align:center; padding:10px;">لا توجد جلسات معالجة محفوظة بعد.</div>';
                return;
            }

            sorted.forEach(s => {
                const item = document.createElement('div');
                item.className = `session-item ${s.pinned ? 'pinned' : ''}`;
                item.onclick = () => loadSessionData(s.id);
                item.innerHTML = `
                    <div class="session-item-header">
                        <span style="font-weight:600; font-size:12px; color:var(--text-main); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px;">${s.title}</span>
                        <div style="display:flex; gap:3px;">
                            <button class="icon-btn" onclick="togglePinSession('${s.id}', event)" title="تثبيت">${s.pinned ? '📍' : '📌'}</button>
                            <button class="icon-btn" onclick="deleteSession('${s.id}', event)" title="حذف">🗑️</button>
                        </div>
                    </div>
                    <div class="session-meta">
                        <span>🕒 ${s.date || ''}</span> • <span>📝 ${s.charCount || 0} حرف</span>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function loadSessionData(id) {
            const session = savedSessions.find(s => s.id === id);
            if (!session) return;

            document.getElementById('user-input').value = session.prompt || '';
            const outputBox = document.getElementById('output-text-container');
            outputBox.innerHTML = window.marked.parse(session.result || '');
            Prism.highlightAllUnder(outputBox);
        }

        // ==========================================
        // 3. معالجة الطلبات وتشغيل الأدوات
        // ==========================================
        let currentToolKey = 'grounding';
        const toolsConfig = {
            'grounding': { title: 'بحث جوجل والتوثيق الفوري', desc: 'إجابات حية مدعومة بروابط مصادر حقيقية.', apiEndpoint: '/api/deconstruct.js' },
            'deconstruct': { title: 'التفكيك المعرفي واللغوي', desc: 'تحليل البنى النصية واستخراج الأفكار.', apiEndpoint: '/api/deconstruct-groq.js' },
            'ecom-deconstruct': { title: 'تفكيك العمليات واللوجستيات الرقمية', desc: 'محاكاة حركة الشحنات والمخاطر.', apiEndpoint: '/api/ecom-deconstruct.js' },
            'loop-destroyer': { title: 'تتبع وحرق الأخطاء البرمجية', desc: 'كشف ثغرات وحلقات التجمد.', apiEndpoint: '/api/loop-destroyer.js' },
            'clean-image': { title: 'استوديو التصاميم النظيفة', desc: 'توليد أصول بصرية خالية من النصوص.', apiEndpoint: '/api/generate-image.js' },
            'support-agent': { title: 'المساعد الذكي لقنوات الدعم', desc: 'تحليل وتفكيك تذاكر الدعم.', apiEndpoint: '/api/support-agent.js' }
        };

        async function executeProcess() {
            const inputVal = document.getElementById('user-input').value.trim();
            const outputBox = document.getElementById('output-text-container');

            if (!inputVal) return alert('أدخل نصاً أولاً.');

            outputBox.innerText = 'جاري المعالجة والتحليل المعرفي...';

            try {
                const response = await fetch(toolsConfig[currentToolKey].apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: inputVal })
                });
                const data = await response.json();
                const resultText = data.result || 'لم يتم إرجاع نتائج.';
                
                outputBox.innerHTML = window.marked.parse(resultText);
                Prism.highlightAllUnder(outputBox);

                if (currentUser) {
                    await saveSessionToCloud(toolsConfig[currentToolKey].title, inputVal, resultText);
                }
            } catch (err) { 
                outputBox.innerText = `خطأ في المعالجة: ${err.message}`; 
            }
        }

        function switchTool(key, el) {
            currentToolKey = key;
            document.getElementById('tool-title').innerText = toolsConfig[key].title;
            document.getElementById('tool-desc').innerText = toolsConfig[key].desc;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');
        }

        function startNewSession() {
            document.getElementById('user-input').value = '';
            document.getElementById('output-text-container').innerText = 'في انتظار البيانات...';
        }

        function changeTheme(theme) { document.body.className = theme === 'default' ? '' : `theme-${theme}`; }
        function filterHistory(query) {
            document.querySelectorAll('.session-item').forEach(el => el.style.display = el.innerText.includes(query) ? 'flex' : 'none');
        }
    </script>
</body>
</html>
