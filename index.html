<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS</title>
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1e20;
            --bg-hover: #282a2c;
            --bg-input: #1e1e20;
            --text-main: #e3e3e3;
            --text-sub: #c4c7c5;
            --border: #444746;
            --gemini-gradient: linear-gradient(74deg, #4285f4 0%, #9b51e0 50%, #e91e63 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ------------------ الشريط الجانبي ------------------ */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 12px;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar.collapsed .hide-text {
            display: none;
        }

        .new-chat-btn {
            background-color: #1a1a1c;
            border: none;
            color: var(--text-sub);
            padding: 14px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            width: 100%;
        }

        .new-chat-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        /* ------------------ المساحة الرئيسية ------------------ */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .top-bar {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
        }

        .toggle-sidebar-btn:hover {
            background-color: var(--bg-hover);
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-sub);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 60px;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        /* واجهة الترحيب */
        .welcome-view {
            margin-top: 8vh;
        }

        .greeting {
            font-size: 3.5rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .gradient-text {
            background: var(--gemini-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-greeting {
            font-size: 3.5rem;
            color: #444746;
            font-weight: 500;
            margin-bottom: 50px;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .suggestion-card {
            background-color: var(--bg-sidebar);
            padding: 22px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.95rem;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .suggestion-card:hover {
            background-color: var(--bg-hover);
        }

        /* ------------------ تصميم الرسائل ومخرجات التفكيك المستلمة ------------------ */
        .conversation-flow {
            display: none;
            flex-direction: column;
            gap: 35px;
            padding-bottom: 40px;
        }

        .chat-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .avatar.user-avatar { background-color: #565869; color: white; }
        .avatar.ai-avatar { background: var(--gemini-gradient); color: white; }

        .message-content {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-main);
            flex: 1;
        }

        /* تجميل الجداول المستلمة ديناميكياً من السيرفر الخلفي */
        .deconstructed-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.95rem;
            border-radius: 8px;
            overflow: hidden;
        }

        .deconstructed-table th {
            background-color: #202124;
            color: #8ab4f8;
            padding: 12px;
            text-align: right;
            border: 1px solid var(--border);
        }

        .deconstructed-table td {
            padding: 12px;
            border: 1px solid var(--border);
            color: var(--text-main);
            background-color: #1e1e20;
        }

        /* تصميم الخطوات التنفيذية */
        .steps-wrapper {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .step-card-item {
            background-color: #1e1e20;
            border-right: 4px solid #9b51e0;
            padding: 12px 18px;
            border-radius: 4px 12px 12px 4px;
        }

        /* الأزرار التفاعلية المستلمة (Chips) */
        .interactive-chips-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .chip-question-btn {
            background-color: #1e1e20;
            border: 1px solid var(--border);
            color: #8ab4f8;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .chip-question-btn:hover {
            background-color: var(--bg-hover);
            border-color: #8ab4f8;
        }

        /* أنيميشن التحميل اللامع لـ Gemini */
        .shimmer-line {
            display: none;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #4285f4, #9b51e0, #e91e63, #4285f4);
            background-size: 300% 100%;
            animation: shimmerAnimation 2s infinite linear;
            border-radius: 2px;
            margin-top: 15px;
        }

        @keyframes shimmerAnimation {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* ------------------ صندوق الإدخال السفلي ------------------ */
        .input-area-wrapper {
            padding: 10px 60px 25px 60px;
            background: linear-gradient(transparent, var(--bg-main) 40%);
        }

        .input-box-container {
            max-width: 850px;
            margin: 0 auto;
            background-color: var(--bg-input);
            border-radius: 32px;
            padding: 8px 22px;
            display: flex;
            flex-direction: column;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .input-box-container textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.05rem;
            outline: none;
            resize: none;
            padding: 10px 0;
            max-height: 150px;
        }

        .action-icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.25rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-icon-btn:hover { background-color: var(--bg-hover); }
        .disclaimer { text-align: center; font-size: 0.75rem; color: #727575; margin-top: 10px; }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div>
            <button class="new-chat-btn" onclick="resetToHome()">
                <span>＋</span>
                <span class="hide-text">محادثة جديدة</span>
            </button>
        </div>
        <div>
            <div style="padding: 10px; font-size: 0.85rem; color: var(--text-sub);" class="hide-text">Tafkek OS v2.0</div>
        </div>
    </aside>

    <main class="main-chat">
        <div class="top-bar">
            <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>
            <div class="brand-name">Tafkek OS</div>
            <div style="width: 40px;"></div>
        </div>

        <div class="chat-container">
            <!-- واجهة الترحيب والبطاقات الافتراضية -->
            <div class="welcome-view" id="welcomeView">
                <h1 class="greeting"><span class="gradient-text">مرحباً بك،</span></h1>
                <h2 class="sub-greeting">كيف يمكنني مساعدتك اليوم؟</h2>
                
                <div class="suggestions-grid">
                    <div class="suggestion-card" onclick="selectSuggestion('قم بإنشاء متجر لبيع الهواتف')">
                        <span>قم بإنشاء متجر لبيع الهواتف الذكية وتفكيك متطلباته</span>
                        <div class="card-icon">💻</div>
                    </div>
                    <div class="suggestion-card" onclick="selectSuggestion('حل مصفوفة تجارية لمشروع ملابس وطباعة عند الطلب')">
                        <span>تحليل مصفوفة تجارية وهيكلة الأفكار الريادية</span>
                        <div class="card-icon">📈</div>
                    </div>
                </div>
            </div>

            <!-- حاوية الدردشة الفعلية -->
            <div class="conversation-flow" id="conversationFlow"></div>
            <div class="shimmer-line" id="shimmerLine"></div>
        </div>

        <!-- منطقة الإدخال -->
        <div class="input-area-wrapper">
            <div class="input-box-container">
                <div class="input-row">
                    <textarea id="chatInput" rows="1" placeholder="أدخل فكرتك هنا لتفكيكها بالكامل..." oninput="autoGrow(this)" onkeydown="handleKeyDown(event)"></textarea>
                    <button class="action-icon-btn" style="color: #8ab4f8;" onclick="sendMessage()" title="إرسال الفكرة">✦</button>
                </div>
            </div>
            <div class="disclaimer">نظام التفكيك متصل مباشرة بـ Gemini API. يرجى التحقق من الخطوات الهامة.</div>
        </div>
    </main>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function autoGrow(element) {
            element.style.height = "5px";
            element.style.height = (element.scrollHeight) + "px";
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function selectSuggestion(text) {
            document.getElementById('chatInput').value = text;
            sendMessage();
        }

        // 🚀 محرك الاتصال المباشر المتوافق 100% مع مخرجات السيرفر الخلفي المخصص لك
        async function sendMessage() {
            const inputEl = document.getElementById('chatInput');
            const query = inputEl.value.trim();
            if (!query) return;

            // عرض رسالة المستخدم
            document.getElementById('welcomeView').style.display = 'none';
            const flow = document.getElementById('conversationFlow');
            flow.style.display = 'flex';

            flow.innerHTML += `
                <div class="chat-row user-row">
                    <div class="avatar user-avatar">ع</div>
                    <div class="message-content">${query}</div>
                </div>
            `;

            inputEl.value = '';
            inputEl.style.height = 'auto';

            // تشغيل أنيميشن التحميل اللامع لـ Gemini
            document.getElementById('shimmerLine').style.display = 'block';
            const container = document.querySelector('.chat-container');
            container.scrollTop = container.scrollHeight;

            try {
                // 🔗 الاتصال وإرسال حقل الـ "idea" الذي يبحث عنه سيرفرك الخلفي!
                const response = await fetch('/api/deconstruct', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idea: query }) 
                });

                if (!response.ok) {
                    throw new Error(`استجاب السيرفر بخطأ كوده: ${response.status}`);
                }

                const data = await response.json();
                document.getElementById('shimmerLine').style.display = 'none';

                // 🏗️ بناء واجهة الرد بأسلوب غني ومقسم بناءً على الـ JSON المستلم من السيرفر
                let aiHTML = `<div class="message-content">`;

                // 1. عرض الملخص التنفيذي النصي
                if (data.executive_summary) {
                    aiHTML += `<div style="white-space: pre-wrap; margin-bottom: 15px;">${data.executive_summary}</div>`;
                }

                // 2. بناء وعرض الجدول برمجياً إذا وجد في الرد
                if (data.table_headers && data.table_rows && data.table_rows.length > 0) {
                    aiHTML += `<table class="deconstructed-table"><thead><tr>`;
                    data.table_headers.forEach(header => {
                        aiHTML += `<th>${header}</th>`;
                    });
                    aiHTML += `</tr></thead><tbody>`;
                    
                    data.table_rows.forEach(row => {
                        aiHTML += `<tr>`;
                        // استخراج القيم بالترتيب من col1 حتى col4
                        for (let i = 1; i <= data.table_headers.length; i++) {
                            aiHTML += `<td>${row['col' + i] || ''}</td>`;
                        }
                        aiHTML += `</tr>`;
                    });
                    aiHTML += `</tbody></table>`;
                }

                // 3. بناء وعرض الخطوات التنفيذية المخصصة
                if (data.steps && data.steps.length > 0) {
                    aiHTML += `<div class="steps-wrapper">`;
                    data.steps.forEach(step => {
                        aiHTML += `
                            <div class="step-card-item">
                                <span style="color:#8ab4f8; font-weight:bold;">الخطوة ${step.id}: ${step.title}</span>
                                <p style="font-size:0.9rem; color:var(--text-sub); margin-top:4px;">${step.description}</p>
                            </div>
                        `;
                    });
                    aiHTML += `</div>`;
                }

                // 4. بناء أزرار الأسئلة التفاعلية الجاهزة للضغط الفوري (مثل الأسلوب المتقدم)
                if (data.interactive_questions && data.interactive_questions.length > 0) {
                    aiHTML += `<div class="interactive-chips-wrapper">`;
                    data.interactive_questions.forEach(question => {
                        aiHTML += `<button class="chip-question-btn" onclick="selectSuggestion('${question}')">${question}</button>`;
                    });
                    aiHTML += `</div>`;
                }

                aiHTML += `</div>`;

                // حقن مخرجات السيرفر الكاملة في مجرى الدردشة
                flow.innerHTML += `
                    <div class="chat-row ai-row">
                        <div class="avatar ai-avatar">✦</div>
                        ${aiHTML}
                    </div>
                `;

            } catch (error) {
                document.getElementById('shimmerLine').style.display = 'none';
                flow.innerHTML += `
                    <div class="chat-row ai-row">
                        <div class="avatar ai-avatar" style="background:#ff4a4a;">❌</div>
                        <div class="message-content" style="color:#ff4a4a;">
                            <strong>فشل معالجة التفكيك:</strong><br>
                            السبب: ${error.message}
                        </div>
                    </div>
                `;
            }

            container.scrollTop = container.scrollHeight;
        }

        function resetToHome() {
            document.getElementById('conversationFlow').innerHTML = '';
            document.getElementById('conversationFlow').style.display = 'none';
            document.getElementById('welcomeView').style.display = 'block';
        }
    </script>
</body>
</html>
