<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Tafkek OS | Master Build</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --text: #e0e0e0; --accent: #4a90e2; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        textarea { width: 100%; height: 150px; background: var(--panel); color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; }
        .btn-group { margin-top: 10px; }
        button { padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; background: var(--accent); color: white; }
        #history { margin-top: 20px; border-top: 1px solid #444; padding-top: 20px; }
        .item { background: var(--panel); padding: 15px; margin-bottom: 10px; border-right: 5px solid var(--accent); border-radius: 5px; }
        
        /* لوحة التحكم */
        #adminPanel { display: none; background: #252525; padding: 20px; margin-top: 20px; border: 1px solid var(--accent); }
        .hidden-trigger { position: fixed; bottom: 10px; left: 10px; width: 30px; height: 30px; opacity: 0.05; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>Tafkek OS</h1>
    <textarea id="mainInput" placeholder="اكتب فكرتك هنا..."></textarea>
    <div class="btn-group">
        <button onclick="TafkekOS.process()">تحليل وتفكيك</button>
        <button onclick="TafkekOS.export()" style="background:transparent; border:1px solid var(--accent)">تصدير البيانات</button>
    </div>

    <div id="adminPanel">
        <h3>⚙️ لوحة تحكم الأدمن</h3>
        <label>وضع المحاكاة:</label>
        <select id="modeSelect">
            <option value="Critical">🔍 النقد التحليلي</option>
            <option value="Financial">💰 مالي</option>
            <option value="Security">🛡️ أمن</option>
        </select>
        <button onclick="TafkekOS.toggleAdmin()">إغلاق</button>
    </div>

    <div id="history">
        <h3>السجل:</h3>
        <div id="historyList"></div>
    </div>
</div>

<div class="hidden-trigger" onclick="TafkekOS.auth()"></div>

<script>
    const TafkekOS = {
        storageKey: 'tafkek_data',
        
        init: function() { this.render(); },

        auth: function() {
            const pass = prompt("أدخل رمز الدخول:");
            if(pass === "1234") { document.getElementById('adminPanel').style.display = 'block'; }
        },

        toggleAdmin: function() { document.getElementById('adminPanel').style.display = 'none'; },

        process: function() {
            const text = document.getElementById('mainInput').value.trim();
            if(!text) return;

            const history = JSON.parse(localStorage.getItem(this.storageKey) || '[]');
            const mode = document.getElementById('modeSelect').value;

            // الرادار
            if(history.some(i => i.content.includes(text.substring(0,5)))) {
                alert("⚠️ تنبيه: هذه الفكرة مرتبطة بمشروع سابق!");
            }

            // الحفظ
            history.push({ content: text, mode: mode, date: new Date().toLocaleString() });
            localStorage.setItem(this.storageKey, JSON.stringify(history));
            
            document.getElementById('mainInput').value = '';
            this.render();
        },

        render: function() {
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem(this.storageKey) || '[]');
            list.innerHTML = history.map(item => `
                <div class="item">
                    <small>الوضع: ${item.mode}</small>
                    <p>${item.content}</p>
                </div>
            `).join('');
        },

        export: function() {
            const data = localStorage.getItem(this.storageKey);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'}));
            a.download = 'data.json';
            a.click();
        }
    };

    TafkekOS.init();
</script>
</body>
</html>
