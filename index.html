<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Tafkek OS | System</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.1); }
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .window { background: var(--glass); backdrop-filter: blur(10px); width: 100%; max-width: 500px; padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        h1 { text-align: center; margin-top: 0; }
        input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; background: rgba(0,0,0,0.3); color: white; }
        button { background: #3b82f6; cursor: pointer; font-weight: bold; }
        #notesList { list-style: none; padding: 0; }
        .note { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-top: 10px; border-right: 4px solid #3b82f6; }
    </style>
</head>
<body>

<div class="window">
    <h1>Tafkek OS</h1>
    <div id="authSection">
        <button onclick="login()">دخول عبر Google</button>
    </div>
    
    <div id="mainSection" style="display: none;">
        <p id="userName"></p>
        <textarea id="noteInput" placeholder="اكتب فكرة جديدة..."></textarea>
        <button onclick="saveNote()">حفظ في السحابة</button>
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">رفع ملف</button>
        <h3>أرشيف السحابة:</h3>
        <ul id="notesList"></ul>
        <button onclick="logout()" style="background: #ef4444;">تسجيل خروج</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCJutNsE1b9jhQb6TRkO4HxcTWEDOe1WUE",
        authDomain: "tafkekos.firebaseapp.com",
        projectId: "tafkekos",
        storageBucket: "tafkekos.firebasestorage.app",
        messagingSenderId: "402724924724",
        appId: "1:402724924724:web:8cf9c04583ff3998c48961",
        measurementId: "G-WT4BBKEKVK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getFirestore();
    const storage = getStorage();

    window.login = () => signInWithPopup(auth, new GoogleAuthProvider());
    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('mainSection').style.display = 'block';
            document.getElementById('userName').innerText = "مرحباً، " + user.displayName;
            loadNotes();
        } else {
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('mainSection').style.display = 'none';
        }
    });

    window.saveNote = async () => {
        const text = document.getElementById('noteInput').value;
        await addDoc(collection(db, "notes"), { text, date: new Date() });
        document.getElementById('noteInput').value = "";
    };

    function loadNotes() {
        onSnapshot(query(collection(db, "notes"), orderBy("date", "desc")), (snapshot) => {
            const list = document.getElementById('notesList');
            list.innerHTML = "";
            snapshot.forEach(doc => {
                const li = document.createElement('li');
                li.className = 'note';
                li.innerText = doc.data().text;
                list.appendChild(li);
            });
        });
    }

    window.uploadFile = async () => {
        const file = document.getElementById('fileInput').files[0];
        if(!file) return;
        await uploadBytes(ref(storage, 'files/' + file.name), file);
        alert("تم الرفع!");
    };
</script>
</body>
</html>
