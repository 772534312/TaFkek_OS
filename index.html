<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Tafkek OS | Cloud Enterprise</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-storage.js";

        // إعداداتك التي أرسلتها
        const firebaseConfig = {
            apiKey: "AIzaSyCJutNsE1b9jhQb6TRkO4HxcTWEDOe1WUE",
            authDomain: "tafkekos.firebaseapp.com",
            projectId: "tafkekos",
            storageBucket: "tafkekos.firebasestorage.app",
            messagingSenderId: "402724924724",
            appId: "1:402724924724:web:8cf9c04583ff3998c48961",
            measurementId: "G-WT4BBKEKVK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore();
        const storage = getStorage();

        // 1. تسجيل الدخول
        window.login = () => signInWithPopup(auth, new GoogleAuthProvider());
        
        // 2. حفظ فكرة/محادثة
        window.saveThought = async () => {
            const txt = document.getElementById('thoughtInput').value;
            if(!txt) return;
            await addDoc(collection(db, "thoughts"), { text: txt, user: auth.currentUser.email, date: new Date() });
            document.getElementById('thoughtInput').value = '';
        };

        // 3. رفع ملف
        window.upload = async (file) => {
            const storageRef = ref(storage, 'uploads/' + file.name);
            await uploadBytes(storageRef, file);
            alert("تم رفع الملف بنجاح!");
        };

        // 4. عرض البيانات لحظياً
        onSnapshot(query(collection(db, "thoughts"), orderBy("date", "desc")), (snapshot) => {
            const list = document.getElementById('historyList');
            list.innerHTML = snapshot.docs.map(doc => `<li>${doc.data().text}</li>`).join('');
        });
    </script>
    <style>
        body { background: #0e0e0e; color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: #1c1c1c; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        input, textarea, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; }
        button { background: #5e81f4; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div style="max-width: 600px; margin: auto;">
        <h1>Tafkek OS | Enterprise</h1>
        <button onclick="login()">دخول عبر جوجل</button>
        
        <div class="card">
            <h3>أرشيف الأفكار</h3>
            <textarea id="thoughtInput" placeholder="اكتب فكرتك لحفظها في السحابة..."></textarea>
            <button onclick="saveThought()">حفظ في السحابة</button>
        </div>

        <div class="card">
            <h3>رفع ملف/صورة</h3>
            <input type="file" onchange="upload(this.files[0])">
        </div>

        <ul id="historyList"></ul>
    </div>
</body>
</html>
