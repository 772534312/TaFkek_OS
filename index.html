<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS - Full Cognitive Workspace (v9.0)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <style>
        :root {
            --bg-dark: #050811;
            --panel-bg: rgba(15, 22, 38, 0.85);
            --border-color: rgba(30, 41, 59, 0.8);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-hover: #0ea5e9;
            --error-red: #f43f5e;
            --success-green: #10b981;
        }

        body.theme-cyberpunk {
            --bg-dark: #0f051d; --panel-bg: rgba(26, 11, 46, 0.85);
            --border-color: rgba(236, 72, 153, 0.3); --accent-blue: #f43f5e; --accent-hover: #e11d48;
        }

        body.theme-matrix {
            --bg-dark: #020d08; --panel-bg: rgba(5, 26, 15, 0.85);
            --border-color: rgba(16, 185, 129, 0.3); --accent-blue: #10b981; --accent-hover: #059669;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-dark);
            color: var(--text-main); font-family: 'Cairo', sans-serif;
            display: flex; height: 100vh; overflow: hidden; position: relative;
            transition: background-color 0.4s ease;
        }

        #neural-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; opacity: 0.5;
        }

        .sidebar {
            width: 330px; background-color: var(--panel-bg);
            backdrop-filter: blur(12px); border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
            overflow-y: auto; z-index: 2;
        }

        .logo-area {
            font-size: 20px; font-weight: 700; color: var(--text-main);
            margin-bottom: 15px; border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }

        .btn-new-chat {
            background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent-blue);
            color: var(--accent-blue); padding: 10px; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-family: 'Cairo'; width: 100%;
            margin-bottom: 12px; transition: all 0.2s;
        }
        .btn-new-chat:hover { background: var(--accent-blue); color: #000; }

        .search-history-input {
            width: 100%; background: rgba(5, 8, 17, 0.7); border: 1px solid var(--border-color);
            border-radius: 6px; padding: 6px 10px; color: var(--text-main);
            font-size: 12px; font-family: 'Cairo'; margin-bottom: 15px; box-sizing: border-box;
        }

        .section-title {
            font-size: 11px; text-transform: uppercase; color: var(--text-muted);
            margin: 12px 0 6px 0; letter-spacing: 1px; font-weight: 600;
        }

        .tool-btn {
            background: none; border: 1px solid transparent; color: var(--text-muted);
            padding: 9px 12px; text-align: right; border-radius: 8px; cursor: pointer;
            margin-bottom: 4px; transition: all 0.25s ease; font-size: 13px; font-family: 'Cairo';
            display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box;
        }

        .tool-btn:hover, .tool-btn.active {
            background-color: rgba(30, 41, 59, 0.8); color: var(--accent-blue); border-color: rgba(56, 189, 248, 0.3);
        }

        .workspace {
            flex: 1; display: flex; flex-direction: column; padding: 25px;
            box-sizing: border-box; overflow-y: auto; z-index: 2; transition: all 0.3s ease;
        }

        .workspace.focus-mode .interface-card,
        .workspace.focus-mode .tool-header,
        .workspace.focus-mode .preset-container { opacity: 0.1; filter: blur(3px); pointer-events: none; }

        .tool-header h1 { margin: 0 0 6px 0; font-size: 24px; font-weight: 700; color: var(--text-main); }
        .tool-header p { margin: 0; color: var(--text-muted); font-size: 13.5px; }

        .preset-container { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
        .preset-chip {
            background: rgba(30, 41, 59, 0.5); border: 1px solid var(--border-color);
            color: var(--accent-blue); font-size: 11.5px; padding: 4px 10px;
            border-radius: 20px; cursor: pointer; transition: all 0.2s;
        }
        .preset-chip:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-blue); }

        .interface-card {
            background-color: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 20px; margin-bottom: 20px; position: relative;
        }

        .input-wrapper { position: relative; }

        .input-field {
            width: 100%; background-color: rgba(5, 8, 17, 0.7);
            border: 1px solid var(--border-color); border-radius: 8px;
            padding: 15px; color: var(--text-main); font-size: 14.5px;
            font-family: 'Cairo', sans-serif; box-sizing: border-box; resize: vertical;
        }

        /* المعاين والموجات الصوتية */
        .audio-wave-container {
            display: none; align-items: center; justify-content: center; gap: 4px;
            height: 25px; margin-top: 10px;
        }
        .audio-bar { width: 4px; height: 100%; background: var(--accent-blue); border-radius: 2px; animation: wave 1s infinite ease-in-out; }
        .audio-bar:nth-child(2) { animation-delay: 0.2s; }
        .audio-bar:nth-child(3) { animation-delay: 0.4s; }
        .audio-bar:nth-child(4) { animation-delay: 0.6s; }

        @keyframes wave { 0%, 100% { height: 6px; } 50% { height: 22px; } }

        .file-preview-card {
            display: none; align-items: center; justify-content: space-between;
            background: rgba(30, 41, 59, 0.6); border: 1px solid var(--accent-blue);
            padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 10px;
        }

        .controls-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; gap: 10px; }

        .style-select {
            background: rgba(5, 8, 17, 0.7); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: 'Cairo';
        }

        .action-btn {
            background-color: var(--accent-blue); color: #030712; border: none;
            padding: 10px 24px; font-size: 14.5px; font-weight: 700; border-radius: 8px;
            cursor: pointer; font-family: 'Cairo', sans-serif; transition: all 0.2s ease;
        }

        .action-btn:hover { background-color: var(--accent-hover); }

        .output-panel {
            background-color: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 25px; min-height: 150px; line-height: 1.8; position: relative;
        }

        .output-panel.fullscreen { position: fixed; top: 15px; left: 15px; right: 15px; bottom: 15px; z-index: 200; height: auto; }

        .output-toolbar { position: absolute; top: 12px; left: 15px; display: flex; gap: 6px; z-index: 5; flex-wrap: wrap; }

        .icon-btn {
            background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border-color);
            color: var(--text-muted); padding: 4px 8px; border-radius: 6px;
            cursor: pointer; font-size: 11.5px; transition: all 0.2s;
        }
        .icon-btn:hover { color: var(--accent-blue); border-color: var(--accent-blue); }

        .branch-controls { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }

        .followup-container { display: flex; gap: 8px; margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px; flex-wrap: wrap; }
        .followup-btn {
            background: rgba(30, 41, 59, 0.4); border: 1px solid var(--border-color);
            color: var(--text-main); font-size: 12px; padding: 6px 12px; border-radius: 15px; cursor: pointer;
        }
        .followup-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

        .live-preview-iframe { width: 100%; height: 250px; border: 1px solid var(--border-color); border-radius: 8px; margin-top: 15px; background: white; display: none; }

        .session-item { display: flex; justify-content: space-between; align-items: center; padding: 6px; border-radius: 6px; font-size: 12px; color: var(--text-muted); cursor: pointer; }
        .session-item:hover { background: rgba(30, 41, 59, 0.5); }
        .session-item.pinned { border-right: 2px solid var(--accent-blue); }

        .status-bar { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 15px; }
        .status-indicator { display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--text-muted); }
        .dot.active { background-color: var(--success-green); box-shadow: 0 0 10px var(--success-green); }

        #output-image { max-width: 100%; border-radius: 12px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <canvas id="neural-canvas"></canvas>

    <div class="sidebar">
        <div class="logo-area">
            <span>Tafkek OS</span>
            <div style="display:flex; gap:5px;">
                <button class="icon-btn" onclick="changeTheme('default')">🔵</button>
                <button class="icon-btn" onclick="changeTheme('cyberpunk')">🔴</button>
                <button class="icon-btn" onclick="changeTheme('matrix')">🟢</button>
            </div>
        </div>

        <button class="btn-new-chat" onclick="startNewSession()">+ جلسة معالجة جديدة</button>
        <input type="text" class="search-history-input" placeholder="🔍 بحث في السجل..." oninput="filterHistory(this.value)">
        
        <div class="section-title">الأدوات الحية</div>
        <button class="tool-btn active" onclick="switchTool('grounding', this)">🌐 بحث جوجل والتوثيق الفوري</button>
        <button class="tool-btn" onclick="switchTool('deconstruct', this)">🧠 التفكيك المعرفي واللغوي</button>
        <button class="tool-btn" onclick="switchTool('ecom-deconstruct', this)">📊 تفكيك اللوجستيات الرقمية</button>
        <button class="tool-btn" onclick="switchTool('loop-destroyer', this)">⚡ تتبع وحرق الأخطاء البرمجية</button>
        <button class="tool-btn" onclick="switchTool('clean-image', this)">🎨 استوديو التصاميم النظيفة</button>
        <button class="tool-btn" onclick="switchTool('support-agent', this)">🛠️ المساعد الذكي لقنوات الدعم</button>
        
        <div class="section-title">السجل والجلسات المثبتة</div>
        <div id="session-history-list"></div>
    </div>

    <div class="workspace" id="workspace">
        <div class="tool-header">
            <h1 id="tool-title">التوثيق والربط ببحث جوجل الفوري</h1>
            <p id="tool-desc">تلقي إجابات حية من الإنترنت مدعومة بروابط مصادر حقيقية.</p>
        </div>

        <div class="preset-container" id="preset-area"></div>

        <div class="interface-card" id="drop-zone">
            <div id="file-preview" class="file-preview-card">
                <span id="file-name">📄 filename.txt</span>
                <button class="icon-btn" onclick="removeFile()">❌ إزالة</button>
            </div>

            <div class="input-wrapper">
                <textarea id="user-input" class="input-field" rows="4" placeholder="أدخل البيانات أو اسحب المرفقات هنا..."></textarea>
                <button id="mic-btn" class="icon-btn" style="position: absolute; left: 12px; bottom: 15px;" onclick="toggleVoiceInput()">🎙️ تحدث</button>
            </div>

            <!-- الموجات الصوتية التفاعلية -->
            <div id="audio-wave" class="audio-wave-container">
                <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
                <span style="font-size: 11px; color: var(--accent-blue); margin-right: 8px;">جاري الاستماع...</span>
            </div>

            <div class="controls-row">
                <div style="display: flex; gap: 8px; align-items: center;">
                    <select id="output-style" class="style-select">
                        <option value="detailed">أسلوب تفصيلي شامل</option>
                        <option value="concise">مختصر ومباشر</option>
                        <option value="code">تركيز على الأكواد فقط</option>
                    </select>

                    <select id="engine-select" class="style-select">
                        <option value="fast">المحرك السريع (Ultra)</option>
                        <option value="deep">المحرك العميق (Deep Logic)</option>
                    </select>
                </div>
                <button id="submit-btn" class="action-btn" onclick="executeProcess()">تشغيل النظام المعرفي</button>
            </div>
        </div>

        <div id="output-box" class="output-panel">
            <div class="output-toolbar">
                <button class="icon-btn" onclick="speakOutput()">🔊 استماع</button>
                <button class="icon-btn" onclick="toggleLivePreview()">🌐 معاينة الـ HTML</button>
                <button class="icon-btn" onclick="generateShareLink()">🔗 مشاركة</button>
                <button class="icon-btn" onclick="toggleZenMode()">🖥️ الشاشة الكاملة</button>
                <button class="icon-btn" onclick="copyOutputText()">📋 نسخ</button>
            </div>

            <!-- التحكم في الفروع -->
            <div class="branch-controls">
                <span>الفرع: </span>
                <button class="icon-btn" onclick="changeBranch(-1)">&lt;</button>
                <span id="branch-indicator">1 / 1</span>
                <button class="icon-btn" onclick="changeBranch(1)">&gt;</button>
            </div>

            <div id="output-text-container">في انتظار البيانات...</div>
            <iframe id="live-iframe" class="live-preview-iframe"></iframe>

            <!-- اقتراحات المتابعة الضمنية -->
            <div id="followup-area" class="followup-container" style="display: none;">
                <span style="font-size: 11px; color: var(--text-muted); width: 100%;">اقترحات المتابعة التلقائية:</span>
                <button class="followup-btn" onclick="sendFollowup(this.innerText)">هل يمكنك إضافة كود توضيحي لذلك؟</button>
                <button class="followup-btn" onclick="sendFollowup(this.innerText)">تفكيك الأسباب الجوهرية لهذه النتيجة</button>
                <button class="followup-btn" onclick="sendFollowup(this.innerText)">تحويل التقرير إلى جدول نقاط</button>
            </div>
        </div>

        <img id="output-image" alt="المخرجات البصرية" />

        <div class="status-bar">
            <div class="status-indicator">
                <div id="status-dot" class="dot active"></div>
                <span id="status-text">النواة: جاهزة</span>
            </div>
            <div>Tafkek OS Enterprise v9.0</div>
        </div>
    </div>

    <script>
        const toolsConfig = {
            'grounding': { title: 'بحث جوجل والتوثيق الفوري', desc: 'إجابات حية مدعومة بروابط مصادر حقيقية.', apiEndpoint: '/api/deconstruct.js', presets: ['أحدث التطورات الذكاء الاصطناعي'] },
            'deconstruct': { title: 'التفكيك المعرفي واللغوي', desc: 'تحليل البنى النصية واستخراج الأفكار.', apiEndpoint: '/api/deconstruct-groq.js', presets: ['حلل هذا النص واستخرج المفاهيم الرئيسية'] },
            'ecom-deconstruct': { title: 'تفكيك العمليات واللوجستيات الرقمية', desc: 'محاكاة حركة الشحنات والمخاطر.', apiEndpoint: '/api/ecom-deconstruct.js', presets: ['تفكيك شحنة متأخرة في الجمارك'] },
            'loop-destroyer': { title: 'تتبع وحرق الأخطاء البرمجية', desc: 'كشف ثغرات وحلقات التجمد.', apiEndpoint: '/api/loop-destroyer.js', presets: ['فحص دالة تكرارية للقوائم الموصولة'] },
            'clean-image': { title: 'استوديو التصاميم النظيفة', desc: 'توليد أصول بصرية خالية من النصوص.', apiEndpoint: '/api/generate-image.js', isImage: true, presets: ['Galaxy book cover art'] },
            'support-agent': { title: 'المساعد الذكي لقنوات الدعم', desc: 'تحليل وتفكيك تذاكر الدعم.', apiEndpoint: '/api/support-agent.js', presets: ['تفكيك تذكرة دعم تقنية معقدة'] }
        };

        let currentToolKey = 'grounding';
        let isRecording = false;
        let recognition = null;
        let activeBranches = [];
        let currentBranchIndex = 0;

        function changeTheme(theme) { document.body.className = theme === 'default' ? '' : `theme-${theme}`; }

        // الإدخال الصوتي مع الموجات المرئية
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.onresult = (e) => { document.getElementById('user-input').value += ' ' + e.results[0][0].transcript; toggleVoiceInput(); };
            recognition.onerror = () => toggleVoiceInput();
        }

        function toggleVoiceInput() {
            const wave = document.getElementById('audio-wave');
            if (isRecording) {
                recognition.stop(); isRecording = false; wave.style.display = 'none';
            } else if (recognition) {
                recognition.start(); isRecording = true; wave.style.display = 'flex';
            }
        }

        function speakOutput() {
            const text = document.getElementById('output-text-container').innerText;
            const u = new SpeechSynthesisUtterance(text); u.lang = 'ar-SA'; window.speechSynthesis.speak(u);
        }

        // معاينة كود الـ HTML المباشر
        function toggleLivePreview() {
            const iframe = document.getElementById('live-iframe');
            const text = document.getElementById('output-text-container').innerText;
            if (iframe.style.display === 'block') { iframe.style.display = 'none'; }
            else { iframe.style.display = 'block'; iframe.srcdoc = text; }
        }

        function generateShareLink() {
            navigator.clipboard.writeText(window.location.href);
            alert('تم نسخ رابط التقرير والمشاركة بنجاح!');
        }

        // التفريع والتنقل بين الأسئلة والإجابات (Branching)
        function changeBranch(dir) {
            if (activeBranches.length <= 1) return;
            currentBranchIndex = Math.max(0, Math.min(activeBranches.length - 1, currentBranchIndex + dir));
            document.getElementById('output-text-container').innerHTML = window.marked.parse(activeBranches[currentBranchIndex]);
            document.getElementById('branch-indicator').innerText = `${currentBranchIndex + 1} / ${activeBranches.length}`;
        }

        function sendFollowup(text) {
            document.getElementById('user-input').value = text;
            executeProcess();
        }

        // معالجة الملفات المرفقة
        const dropZone = document.getElementById('drop-zone');
        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('file-name').innerText = `📄 ${files[0].name}`;
                document.getElementById('file-preview').style.display = 'flex';
                const r = new FileReader(); r.onload = (evt) => document.getElementById('user-input').value = evt.target.result;
                r.readAsText(files[0]);
            }
        });
        function removeFile() { document.getElementById('file-preview').style.display = 'none'; }

        // تصفية وقائمة الجلسات المثبتة
        function filterHistory(query) {
            document.querySelectorAll('.session-item').forEach(el => el.style.display = el.innerText.includes(query) ? 'flex' : 'none');
        }

        async function executeProcess() {
            const inputVal = document.getElementById('user-input').value.trim();
            const style = document.getElementById('output-style').value;
            const outputBox = document.getElementById('output-text-container');
            const outputImg = document.getElementById('output-image');
            const followupArea = document.getElementById('followup-area');

            if (!inputVal) return alert('أدخل نصاً أولاً.');

            outputBox.innerText = 'جاري المعالجة والتحليل المعرفي...';
            followupArea.style.display = 'none';

            try {
                const response = await fetch(toolsConfig[currentToolKey].apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: `[النمط: ${style}] ${inputVal}` })
                });
                const data = await response.json();
                
                if (toolsConfig[currentToolKey].isImage && data.imageUrl) {
                    document.getElementById('output-box').style.display = 'none';
                    outputImg.src = data.imageUrl; outputImg.style.display = 'block';
                } else {
                    document.getElementById('output-box').style.display = 'block';
                    activeBranches.push(data.result);
                    currentBranchIndex = activeBranches.length - 1;
                    outputBox.innerHTML = window.marked.parse(data.result);
                    Prism.highlightAllUnder(outputBox);
                    document.getElementById('branch-indicator').innerText = `${currentBranchIndex + 1} / ${activeBranches.length}`;
                    followupArea.style.display = 'flex';

                    // إضافة للجلسات
                    addSessionToHistory(toolsConfig[currentToolKey].title);
                }
            } catch (err) { outputBox.innerText = `خطأ: ${err.message}`; }
        }

        function addSessionToHistory(title) {
            const list = document.getElementById('session-history-list');
            const item = document.createElement('div');
            item.className = 'session-item';
            item.innerHTML = `<span>• ${title}</span><button class="icon-btn" onclick="this.parentElement.classList.toggle('pinned')">📌</button>`;
            list.prepend(item);
        }

        function switchTool(key, el) {
            currentToolKey = key;
            document.getElementById('tool-title').innerText = toolsConfig[key].title;
            document.getElementById('tool-desc').innerText = toolsConfig[key].desc;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');
        }

        function startNewSession() {
            document.getElementById('user-input').value = '';
            document.getElementById('output-text-container').innerText = 'في انتظار البيانات...';
            activeBranches = [];
        }

        function toggleZenMode() { document.getElementById('output-box').classList.toggle('fullscreen'); }
        function copyOutputText() { navigator.clipboard.writeText(document.getElementById('output-text-container').innerText); alert('تم النسخ!'); }
    </script>
</body>
</html>
