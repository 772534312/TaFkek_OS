<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS - Vision Core & Multi-LLM Studio</title>
    
    <!-- Fonts & Libraries -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #131314;
            --panel-bg: #1e1f20;
            --border-color: #333537;
            --text-main: #e3e3e3;
            --text-muted: #9ca3af;
            --accent-blue: #38bdf8;
            --accent-rgb: 56, 189, 248;
            --gemini-pill-bg: #1e1f20;
            --gemini-sheet-bg: #1e1f23;
            --gemini-card-bg: #28292e;
            --gemini-active-blue: #c2e7ff;
            --glass-glow: rgba(56, 189, 248, 0.15);
        }

        body.theme-cyberpunk {
            --bg-dark: #0f051d; --panel-bg: rgba(26, 11, 46, 0.85);
            --border-color: rgba(236, 72, 153, 0.2); --accent-blue: #f43f5e; --accent-rgb: 244, 63, 94;
            --gemini-pill-bg: #221230; --gemini-sheet-bg: #210d33; --gemini-card-bg: #32164a;
            --gemini-active-blue: #f43f5e; --glass-glow: rgba(244, 63, 94, 0.15);
        }

        body.theme-matrix {
            --bg-dark: #020d08; --panel-bg: rgba(5, 26, 15, 0.85);
            --border-color: rgba(16, 185, 129, 0.2); --accent-blue: #10b981; --accent-rgb: 16, 185, 129;
            --gemini-pill-bg: #092014; --gemini-sheet-bg: #071c12; --gemini-card-bg: #0e3020;
            --gemini-active-blue: #10b981; --glass-glow: rgba(16, 185, 129, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0; background-color: var(--bg-dark);
            color: var(--text-main); font-family: 'Cairo', sans-serif;
            display: flex; height: 100vh; overflow: hidden; position: relative;
        }

        #neural-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; opacity: 0.25;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333537; border-radius: 4px; }

        .sidebar {
            width: 320px; background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 20px;
            overflow-y: auto; z-index: 5; box-shadow: 5px 0 25px rgba(0,0,0,0.5);
        }

        .logo-area {
            font-size: 20px; font-weight: 700; color: var(--text-main);
            margin-bottom: 15px; border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }

        .user-profile-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 10px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between; transition: all 0.3s;
        }
        .user-profile-card:hover { border-color: var(--accent-blue); box-shadow: 0 0 12px var(--glass-glow); }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-blue); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; }
        .user-details { display: flex; flex-direction: column; font-size: 11px; }
        .user-name { font-weight: bold; color: var(--text-main); }
        .user-email { color: var(--text-muted); font-size: 10px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .btn-auth {
            background: rgba(var(--accent-rgb), 0.15); border: 1px solid var(--accent-blue);
            color: var(--accent-blue); padding: 9px; border-radius: 20px;
            cursor: pointer; font-weight: 600; font-family: 'Cairo'; width: 100%;
            margin-bottom: 12px; transition: all 0.3s ease; font-size: 12px;
        }
        .btn-auth:hover { background: var(--accent-blue); color: #000; box-shadow: 0 0 15px var(--glass-glow); }

        .btn-new-chat {
            background: #004a77; border: none;
            color: #c2e7ff; padding: 10px 16px; border-radius: 24px;
            cursor: pointer; font-weight: 600; font-family: 'Cairo'; width: 100%;
            margin-bottom: 12px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-new-chat:hover { background: #005c93; transform: translateY(-1px); }

        .search-history-input {
            width: 100%; background: #131314; border: 1px solid var(--border-color);
            border-radius: 20px; padding: 8px 14px; color: var(--text-main);
            font-size: 12px; font-family: 'Cairo'; margin-bottom: 15px; transition: border-color 0.3s;
        }
        .search-history-input:focus { outline: none; border-color: var(--accent-blue); }

        .section-title-row { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 6px 0; }
        .section-title { font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; font-weight: 600; }

        .tool-btn {
            background: transparent; border: 1px solid transparent; color: var(--text-muted);
            padding: 10px 14px; text-align: right; border-radius: 24px; cursor: pointer;
            margin-bottom: 4px; transition: all 0.2s ease; font-size: 13px; font-family: 'Cairo';
            display: flex; align-items: center; gap: 10px; width: 100%; position: relative; overflow: hidden;
        }
        .tool-btn:hover { background: #28292a; color: var(--text-main); }
        .tool-btn.active { background: #004a77; color: #c2e7ff; font-weight: 600; }

        .icon-btn {
            background: transparent; border: none; color: var(--text-muted);
            padding: 6px 8px; border-radius: 50%; cursor: pointer;
            font-size: 15px; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.1); }

        .session-item {
            display: flex; flex-direction: column; gap: 4px;
            padding: 10px; border-radius: 12px; font-size: 12px; color: var(--text-muted);
            cursor: pointer; margin-bottom: 6px; background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent; transition: all 0.2s;
        }
        .session-item:hover { background: #28292a; color: var(--text-main); }
        .session-item.pinned { border-right: 3px solid var(--accent-blue); background: rgba(var(--accent-rgb), 0.08); }

        .workspace {
            flex: 1; display: flex; flex-direction: column;
            overflow: hidden; z-index: 2; position: relative; background: #131314;
        }

        .gemini-top-bar { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }

        .gemini-model-selector {
            display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600;
            color: var(--text-main); cursor: pointer; padding: 6px 14px; border-radius: 20px;
            background: #1e1f20; border: 1px solid var(--border-color); transition: background 0.2s;
        }
        .gemini-model-selector:hover { background: #28292a; }

        .chat-stream {
            flex: 1; overflow-y: auto; padding: 20px 20px;
            display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
        }

        .gemini-hero-center {
            margin: auto; display: flex; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; gap: 16px; padding-bottom: 40px;
        }

        .gemini-sparkle-logo {
            width: 48px; height: 48px;
            animation: pulseGlow 3s infinite alternate ease-in-out;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.95); filter: drop-shadow(0 0 10px rgba(56,189,248,0.4)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(56,189,248,0.8)); }
        }

        .gemini-hero-title { font-size: 26px; font-weight: 700; color: #ffffff; }

        .chat-row { display: flex; flex-direction: column; gap: 8px; max-width: 800px; width: 100%; margin: 0 auto; }
        .chat-row.user-row { align-items: flex-end; }
        .chat-row.ai-row { align-items: flex-start; }

        .bubble {
            padding: 14px 20px; border-radius: 24px; font-size: 15px; line-height: 1.7;
            max-width: 88%; position: relative; word-break: break-word;
        }
        .user-row .bubble { background: #28292a; color: #ffffff; border-bottom-left-radius: 6px; }
        .ai-row .bubble { background: transparent; color: #e3e3e3; width: 100%; padding-right: 0; }

        .chat-media-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; justify-content: flex-end; }
        .chat-media-card {
            position: relative; border-radius: 16px; overflow: hidden;
            max-width: 240px; max-height: 240px; border: 1px solid var(--border-color);
        }
        .chat-media-card img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .gemini-loader { display: flex; align-items: center; gap: 10px; color: var(--accent-blue); font-size: 14px; }

        .gemini-pill-container {
            padding: 0 20px 20px 20px; width: 100%; max-width: 820px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 10px;
        }

        .quick-chips-bar { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
        .quick-chip-btn {
            background: #1e1f20; border: 1px solid #333537; color: #e3e3e3;
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-family: 'Cairo';
            cursor: pointer; white-space: nowrap; transition: background 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .quick-chip-btn:hover { background: #28292a; }

        .gemini-pill-bar {
            background-color: var(--gemini-pill-bg); border-radius: 28px; padding: 12px 16px;
            display: flex; flex-direction: column; gap: 8px; border: 1px solid #333537; transition: all 0.2s ease;
        }
        .gemini-pill-bar:focus-within { background-color: #28292a; border-color: #444746; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }

        .attachments-preview-wrapper { display: flex; align-items: center; gap: 10px; overflow-x: auto; padding: 4px 0; max-width: 100%; }

        .attachment-thumb-card {
            position: relative; width: 64px; height: 64px; border-radius: 16px;
            overflow: hidden; background: #28292e; border: 1px solid var(--border-color); flex-shrink: 0;
        }
        .attachment-thumb-card img { width: 100%; height: 100%; object-fit: cover; }
        .attachment-delete-btn {
            position: absolute; top: 3px; right: 3px; width: 20px; height: 20px;
            background: rgba(0, 0, 0, 0.75); color: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; cursor: pointer; border: none; font-weight: bold;
        }
        .attachment-delete-btn:hover { background: #f43f5e; }

        .pill-input {
            width: 100%; background: transparent; border: none; outline: none;
            color: #ffffff; font-family: 'Cairo', sans-serif; font-size: 15px;
            resize: none; max-height: 140px; min-height: 28px; line-height: 1.5; padding: 2px 0;
        }
        .pill-input::placeholder { color: #8e8e93; }

        .pill-toolbar { display: flex; align-items: center; justify-content: space-between; }
        .pill-toolbar-left { display: flex; align-items: center; gap: 4px; }

        .btn-pill-action {
            background: transparent; border: none; color: #9ca3af;
            font-size: 18px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; width: 36px; height: 36px; border-radius: 50%;
            transition: background 0.2s, color 0.2s;
        }
        .btn-pill-action:hover { color: #ffffff; background: #333537; }
        .btn-pill-action.recording { color: #f43f5e; animation: pulseGlow 1s infinite alternate; }

        .btn-send-dynamic {
            background: #28292a; color: #5f6368; border: none;
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: not-allowed; transition: all 0.2s;
        }
        .btn-send-dynamic.active { background: var(--gemini-active-blue); color: #001d35; cursor: pointer; }
        .btn-send-dynamic.active:hover { background: #ffffff; }

        .sheet-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            z-index: 100; display: none; opacity: 0; transition: opacity 0.3s ease;
        }
        .sheet-overlay.active { display: block; opacity: 1; }

        .gemini-bottom-sheet {
            position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%); width: 100vw;
            max-width: 600px; background-color: var(--gemini-sheet-bg);
            border-top-left-radius: 32px; border-top-right-radius: 32px;
            padding: 12px 24px 32px 24px; z-index: 101;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.7);
            transition: bottom 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex; flex-direction: column; gap: 20px;
        }
        .gemini-bottom-sheet.active { bottom: 0; }

        .sheet-handle-bar { width: 38px; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; margin: 0 auto 10px auto; cursor: pointer; }
        .sheet-cards-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .sheet-card-btn {
            background: var(--gemini-card-bg); border: none; border-radius: 20px;
            padding: 16px 10px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 8px; color: #ffffff; cursor: pointer;
            transition: background 0.2s, transform 0.15s; font-family: 'Cairo';
        }
        .sheet-card-btn:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-2px); }
        .sheet-card-icon { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .sheet-card-label { font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>

    <canvas id="neural-canvas"></canvas>

    <!-- Sidebar Right -->
    <div class="sidebar custom-scrollbar">
        <div class="logo-area">
            <div style="display:flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-sparkles text-blue-400"></i>
                <span>Tafkek OS</span>
            </div>
            <div style="display:flex; gap:4px;">
                <button class="icon-btn" onclick="changeTheme('default')" title="قياسي">🔵</button>
                <button class="icon-btn" onclick="changeTheme('cyberpunk')" title="سايبر">🔴</button>
                <button class="icon-btn" onclick="changeTheme('matrix')" title="ماتريكس">🟢</button>
            </div>
        </div>

        <div id="auth-section">
            <button id="login-google-btn" class="btn-auth" onclick="loginWithGoogle()"><i class="fa-brands fa-google ml-1"></i> تسجيل الدخول بواسطة Google</button>
        </div>

        <div id="user-card" class="user-profile-card" style="display: none;">
            <div class="user-info">
                <div id="user-avatar" class="user-avatar">U</div>
                <div class="user-details">
                    <span id="user-name" class="user-name">المستخدم</span>
                    <span id="user-email" class="user-email">user@example.com</span>
                </div>
            </div>
            <button class="icon-btn" onclick="logoutUser()" title="تسجيل الخروج"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>

        <button class="btn-new-chat" onclick="startNewSession()"><i class="fa-solid fa-plus"></i> محادثة جديدة</button>
        <input type="text" class="search-history-input" placeholder="🔍 بحث في السجل السحابي..." oninput="filterHistory(this.value)">
        
        <div class="section-title-row"><span class="section-title">الأدوات النواة</span></div>
        <button class="tool-btn active" onclick="switchTool('grounding', this)"><i class="fa-solid fa-globe text-blue-400"></i> بحث جوجل والتوثيق الفوري</button>
        <button class="tool-btn" onclick="switchTool('deconstruct', this)"><i class="fa-solid fa-brain text-purple-400"></i> التفكيك المعرفي واللغوي</button>
        <button class="tool-btn" onclick="switchTool('ecom-deconstruct', this)"><i class="fa-solid fa-truck-fast text-amber-400"></i> تفكيك اللوجستيات الرقمية</button>
        <button class="tool-btn" onclick="switchTool('loop-destroyer', this)"><i class="fa-solid fa-bug text-red-400"></i> تتبع وحرق الأخطاء البرمجية</button>
        <button class="tool-btn" onclick="switchTool('vision-ocr', this)"><i class="fa-solid fa-eye text-pink-400"></i> قراءة وتفكيك الصور والمستندات</button>
        <button class="tool-btn" onclick="switchTool('support-agent', this)"><i class="fa-solid fa-headset text-emerald-400"></i> المساعد الذكي لقنوات الدعم</button>
        
        <div class="section-title-row" style="margin-top: 18px;"><span class="section-title">السجل السحابي للمستخدم</span></div>
        <div id="session-history-list"></div>
    </div>

    <!-- Main Workspace -->
    <div class="workspace" id="main-workspace">
        
        <header class="gemini-top-bar">
            <div class="gemini-model-selector">
                <i class="fa-solid fa-sparkles text-blue-400"></i>
                <span id="active-tool-title">Tafkek Vision Pro</span>
                <i class="fa-solid fa-chevron-down text-xs text-slate-400"></i>
            </div>
            <button class="icon-btn" onclick="startNewSession()" title="محادثة جديدة" style="font-size:16px;">
                <i class="fa-solid fa-pen-to-square"></i>
            </button>
        </header>

        <!-- Chat Stream -->
        <section class="chat-stream custom-scrollbar" id="chat-stream">
            <div class="gemini-hero-center" id="gemini-hero">
                <svg class="gemini-sparkle-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#sparkle-grad)"/>
                    <defs>
                        <linearGradient id="sparkle-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#38BDF8"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#F43F5E"/>
                        </linearGradient>
                    </defs>
                </svg>
                <div class="gemini-hero-title">جاهز متى شئت</div>
            </div>
        </section>

        <!-- Input Area -->
        <footer class="gemini-pill-container">
            <div class="quick-chips-bar custom-scrollbar">
                <button onclick="setPrompt('فحص وتفكيك الأخطاء في الكود التالي: ')" class="quick-chip-btn"><i class="fa-solid fa-code text-blue-400"></i> فحص كود</button>
                <button onclick="setPrompt('قم بقراءة وتحليل الصورة المرفقة واستخراج كافة التفاصيل منها: ')" class="quick-chip-btn"><i class="fa-solid fa-eye text-pink-400"></i> قراءة صورة مرفقة</button>
                <button onclick="setPrompt('حلل هذا المستند بشكل دقيق واستخرج النقاط الرئيسية: ')" class="quick-chip-btn"><i class="fa-solid fa-file-lines text-emerald-400"></i> تحليل ملف</button>
            </div>

            <div class="gemini-pill-bar">
                <div class="attachments-preview-wrapper custom-scrollbar" id="attachments-preview-wrapper" style="display: none;"></div>

                <textarea id="user-input" class="pill-input custom-scrollbar" rows="1" placeholder="اسأل Tafkek OS أو ارفع صورة لتحليلها..." oninput="autoResizeTextarea(this)" onkeydown="handleKeyDown(event)"></textarea>

                <div class="pill-toolbar">
                    <div class="pill-toolbar-left">
                        <button class="btn-pill-action" title="إضافة خيارات" onclick="openBottomSheet()"><i class="fa-solid fa-circle-plus"></i></button>
                        <button class="btn-pill-action" title="إرفاق صورة" onclick="triggerNativeInput('image')"><i class="fa-solid fa-image text-pink-400"></i></button>
                        <button class="btn-pill-action" title="إرفاق مستند" onclick="triggerNativeInput('file')"><i class="fa-solid fa-paperclip"></i></button>
                        <button class="btn-pill-action" id="voice-btn" title="الإدخال الصوتي" onclick="startVoiceInput()"><i class="fa-solid fa-microphone"></i></button>
                    </div>

                    <button class="btn-send-dynamic" id="submit-btn" onclick="executeProcess()" title="إرسال الطلب">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </div>
            </div>

            <p style="text-align:center; font-size:10px; color:#6e6e73; margin:2px 0 0 0;">قد تعرض نماذج الذكاء الاصطناعي معلومات غير دقيقة، يُرجى مراجعة المخرجات البرمجية.</p>
        </footer>
    </div>

    <!-- File Inputs -->
    <input type="file" id="native-image-input" accept="image/*" multiple style="display:none;" onchange="handleFileSelect(event, 'image')">
    <input type="file" id="native-camera-input" accept="image/*" capture="environment" style="display:none;" onchange="handleFileSelect(event, 'camera')">
    <input type="file" id="native-file-input" multiple style="display:none;" onchange="handleFileSelect(event, 'file')">

    <!-- Bottom Sheet -->
    <div class="sheet-overlay" id="sheet-overlay" onclick="closeBottomSheet()"></div>
    <div class="gemini-bottom-sheet" id="gemini-sheet">
        <div class="sheet-handle-bar" onclick="closeBottomSheet()"></div>
        <div class="sheet-cards-row">
            <button class="sheet-card-btn" onclick="triggerNativeInput('image')"><div class="sheet-card-icon">🖼️</div><div class="sheet-card-label">الصور</div></button>
            <button class="sheet-card-btn" onclick="triggerNativeInput('camera')"><div class="sheet-card-icon">📷</div><div class="sheet-card-label">الكاميرا</div></button>
            <button class="sheet-card-btn" onclick="triggerNativeInput('file')"><div class="sheet-card-icon">📎</div><div class="sheet-card-label">الملفات</div></button>
        </div>
    </div>

    <script>
        if (typeof window.marked !== 'undefined') {
            window.marked.setOptions({ gfm: true, breaks: true });
        }

        let chatHistory = [];
        let currentToolKey = 'grounding';

        const toolPrompts = {
            'grounding': 'قم بالبحث والتوثيق الفوري واستخرج المصادر الموثوقة للموضوع التالي: ',
            'deconstruct': 'قم بتفكيك وتحليل النص والعمق المعرفي للعبارة التالية: ',
            'ecom-deconstruct': 'قم بتفكيك اللوجستيات الرقمية وخطة الشحن للطلب أو المتجر التالي: ',
            'loop-destroyer': 'قم بتتبع وحرق الأخطاء البرمجية والـ Infinite Loops في الكود التالي: ',
            'vision-ocr': 'قم بقراءة وتحليل هذه الصورة المرفقة واستخراج كامل النصوص والبيانات منها: ',
            'support-agent': 'أنت الآن مساعد خدمة عملاء ذكي، أجب على الاستفسار التالي بأسلوب احترافي: '
        };

        const toolTitles = {
            'grounding': 'بحث وتوثيق جوجل',
            'deconstruct': 'التفكيك المعرفي واللغوي',
            'ecom-deconstruct': 'تفكيك اللوجستيات الرقمية',
            'loop-destroyer': 'تتبع وحرق الأخطاء البرمجية',
            'vision-ocr': 'تحليل وقراءة المستندات/الصور',
            'support-agent': 'المساعد الذكي لقنوات الدعم'
        };

        // Canvas Neural Animation
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        for (let i = 0; i < 30; i++) {
            particles.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, radius: Math.random() * 2 + 1
            });
        }

        function animateNeuralNetwork() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-blue').trim() || '#38bdf8';
            ctx.fillStyle = accentColor; ctx.strokeStyle = accentColor;

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i]; p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
                        ctx.globalAlpha = (1 - (dist / 120)) * 0.15; ctx.stroke(); ctx.globalAlpha = 1.0;
                    }
                }
            }
            requestAnimationFrame(animateNeuralNetwork);
        }
        animateNeuralNetwork();

        // Firebase Setup
        const firebaseConfig = {
            apiKey: "AIzaSyCJutNsE1b9jhQb6TRkO4HxcTWEDOe1WUE",
            authDomain: "tafkekos.firebaseapp.com",
            projectId: "tafkekos",
            storageBucket: "tafkekos.firebasestorage.app",
            messagingSenderId: "402724924724",
            appId: "1:402724924724:web:8cf9c04583ff3998c48961"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let savedSessions = [];

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-card').style.display = 'flex';
                document.getElementById('user-name').innerText = user.displayName || 'مستخدم';
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-avatar').innerText = (user.displayName || user.email)[0].toUpperCase();
                fetchUserSessionsCloud();
            } else {
                currentUser = null;
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('user-card').style.display = 'none';
                savedSessions = [];
                renderSessionHistory();
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => alert("خطأ تسجيل الدخول: " + error.message));
        }

        function logoutUser() { auth.signOut(); }

        function fetchUserSessionsCloud() {
            if (!currentUser) return;
            db.collection('users').doc(currentUser.uid).collection('sessions')
              .orderBy('timestamp', 'desc')
              .onSnapshot(snapshot => {
                  savedSessions = [];
                  snapshot.forEach(doc => savedSessions.push({ id: doc.id, ...doc.data() }));
                  renderSessionHistory();
              });
        }

        async function saveSessionToCloud(title, prompt, result) {
            if (!currentUser) return;
            const sessionData = {
                title: title, toolKey: currentToolKey, prompt: prompt, result: result,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.collection('users').doc(currentUser.uid).collection('sessions').add(sessionData);
        }

        function renderSessionHistory() {
            const list = document.getElementById('session-history-list');
            list.innerHTML = '';
            if (!currentUser) {
                list.innerHTML = '<div style="font-size:11px; color:var(--text-muted); text-align:center; padding:10px;">يرجى تسجيل الدخول لحفظ محادثاتك.</div>';
                return;
            }
            savedSessions.forEach(s => {
                const item = document.createElement('div');
                item.className = 'session-item';
                item.onclick = () => loadSessionData(s.id);
                item.innerHTML = `
                    <div style="font-weight:600; font-size:12px; color:var(--text-main); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.title}</div>
                `;
                list.appendChild(item);
            });
        }

        function loadSessionData(id) {
            const session = savedSessions.find(s => s.id === id);
            if (!session) return;
            const chatStream = document.getElementById('chat-stream');
            chatStream.innerHTML = '';
            appendUserBubble(session.prompt, []);
            appendAiBubble(session.result);
        }

        // Attachments Logic
        let attachedItems = []; 

        function openBottomSheet() {
            document.getElementById('sheet-overlay').classList.add('active');
            document.getElementById('gemini-sheet').classList.add('active');
        }

        function closeBottomSheet() {
            document.getElementById('sheet-overlay').classList.remove('active');
            document.getElementById('gemini-sheet').classList.remove('active');
        }

        function triggerNativeInput(type) {
            closeBottomSheet();
            if (type === 'image') document.getElementById('native-image-input').click();
            else if (type === 'camera') document.getElementById('native-camera-input').click();
            else if (type === 'file') document.getElementById('native-file-input').click();
        }

        function handleFileSelect(event, type) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                const item = {
                    id: 'att-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                    file: file,
                    type: file.type.startsWith('image/') ? 'image' : 'file',
                    mimeType: file.type || 'image/jpeg',
                    name: file.name,
                    url: null,
                    base64Data: null
                };

                const reader = new FileReader();
                reader.onload = (e) => {
                    item.url = e.target.result;
                    item.base64Data = e.target.result.includes(',') ? e.target.result.split(',')[1] : e.target.result;
                    renderAttachmentsPreview();
                    checkInputChangeState();
                };
                reader.readAsDataURL(file);

                attachedItems.push(item);
            });
            renderAttachmentsPreview();
            event.target.value = '';
        }

        function removeAttachment(id) {
            attachedItems = attachedItems.filter(item => item.id !== id);
            renderAttachmentsPreview();
            checkInputChangeState();
        }

        function renderAttachmentsPreview() {
            const wrapper = document.getElementById('attachments-preview-wrapper');
            wrapper.innerHTML = '';

            if (attachedItems.length === 0) {
                wrapper.style.display = 'none';
                return;
            }

            wrapper.style.display = 'flex';

            attachedItems.forEach(item => {
                if (item.type === 'image') {
                    const card = document.createElement('div');
                    card.className = 'attachment-thumb-card';
                    card.innerHTML = `<img src="${item.url || ''}"><button class="attachment-delete-btn" onclick="removeAttachment('${item.id}')">✕</button>`;
                    wrapper.appendChild(card);
                }
            });
        }

        function autoResizeTextarea(el) { 
            el.style.height = 'auto'; 
            el.style.height = Math.min(el.scrollHeight, 140) + 'px'; 
            checkInputChangeState();
        }

        function setPrompt(text) {
            const input = document.getElementById('user-input');
            input.value = text;
            autoResizeTextarea(input);
            input.focus();
        }

        function checkInputChangeState() {
            const val = document.getElementById('user-input').value.trim();
            const btn = document.getElementById('submit-btn');
            if (val !== '' || attachedItems.length > 0) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                executeProcess();
            }
        }

        function appendUserBubble(text, mediaItems = []) {
            const chatStream = document.getElementById('chat-stream');
            const hero = document.getElementById('gemini-hero');
            if (hero) hero.remove();

            const row = document.createElement('div');
            row.className = 'chat-row user-row';

            let mediaHtml = '';
            if (mediaItems.length > 0) {
                mediaHtml += `<div class="chat-media-container">`;
                mediaItems.forEach(item => {
                    if (item.type === 'image') {
                        mediaHtml += `<div class="chat-media-card"><img src="${item.url}"></div>`;
                    }
                });
                mediaHtml += `</div>`;
            }

            let contentText = text ? text.replace(/\n/g, '<br>') : '*(صورة مرفقة للتحليل)*';

            row.innerHTML = `${mediaHtml}<div class="bubble">${contentText}</div>`;
            chatStream.appendChild(row);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function appendAiBubble(markdownText) {
            const chatStream = document.getElementById('chat-stream');
            const row = document.createElement('div');
            row.className = 'chat-row ai-row';
            
            const parsedHtml = window.marked.parse(markdownText || '');

            row.innerHTML = `<div class="bubble"><div>${parsedHtml}</div></div>`;
            chatStream.appendChild(row);
            Prism.highlightAllUnder(row);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function showLoaderBubble() {
            const chatStream = document.getElementById('chat-stream');
            const loaderRow = document.createElement('div');
            loaderRow.className = 'chat-row ai-row';
            loaderRow.id = 'active-loader';
            loaderRow.innerHTML = `<div class="bubble"><div class="gemini-loader"><i class="fa-solid fa-sparkles animate-spin"></i><span>جاري التحليل والمعالجة...</span></div></div>`;
            chatStream.appendChild(loaderRow);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function removeLoaderBubble() {
            const loader = document.getElementById('active-loader');
            if (loader) loader.remove();
        }

        async function executeProcess() {
            const inputNode = document.getElementById('user-input');
            const inputVal = inputNode.value.trim();
            if (!inputVal && attachedItems.length === 0) return;

            const mediaToSend = [...attachedItems];

            appendUserBubble(inputVal, mediaToSend);
            inputNode.value = '';
            autoResizeTextarea(inputNode);

            showLoaderBubble();

            const inlineDataPayload = mediaToSend.map(item => ({
                inlineData: {
                    data: item.base64Data,
                    mimeType: item.mimeType || 'image/jpeg'
                }
            }));

            attachedItems = [];
            renderAttachmentsPreview();
            checkInputChangeState();

            try {
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: inputVal || "قم بتحليل هذه الصورة وشرح كافة تفاصيلها.",
                        history: chatHistory.slice(-6),
                        mediaParts: inlineDataPayload
                    })
                });

                const data = await response.json();
                removeLoaderBubble();

                if (data.result) {
                    chatHistory.push({ role: 'assistant', content: data.result });
                    appendAiBubble(data.result);
                    if (currentUser) saveSessionToCloud("محادثة جديدة", inputVal || "تحليل صورة", data.result);
                } else if (data.error) {
                    appendAiBubble(`⚠️ **خطأ:** ${data.error}`);
                }

            } catch (err) { 
                removeLoaderBubble();
                appendAiBubble(`⚠️ **خطأ الاتصال:** تعذر الوصول للخادم. (${err.message})`); 
            }
        }

        function switchTool(key, el) {
            currentToolKey = key;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');

            document.getElementById('active-tool-title').innerText = toolTitles[key] || 'Tafkek Vision Pro';

            if (toolPrompts[key]) {
                setPrompt(toolPrompts[key]);
            }
        }

        function startVoiceInput() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("المتصفح لا يدعم الإدخال الصوتي المباشر.");
                return;
            }
            const voiceBtn = document.getElementById('voice-btn');
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            
            recognition.onstart = function() {
                voiceBtn.classList.add('recording');
            };

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                const input = document.getElementById('user-input');
                input.value += (input.value ? ' ' : '') + text;
                autoResizeTextarea(input);
                checkInputChangeState();
                voiceBtn.classList.remove('recording');
            };

            recognition.onerror = function() { voiceBtn.classList.remove('recording'); };
            recognition.onend = function() { voiceBtn.classList.remove('recording'); };

            recognition.start();
        }

        function changeTheme(theme) { 
            document.body.className = theme === 'default' ? '' : `theme-${theme}`; 
            localStorage.setItem('tafkek_theme', theme);
        }

        (function restoreTheme() {
            const savedTheme = localStorage.getItem('tafkek_theme');
            if (savedTheme) changeTheme(savedTheme);
        })();

        function startNewSession() {
            chatHistory = [];
            document.getElementById('chat-stream').innerHTML = '<div class="gemini-hero-center" id="gemini-hero"><div class="gemini-hero-title">جاهز متى شئت</div></div>';
        }

        function filterHistory(query) {
            document.querySelectorAll('.session-item').forEach(el => el.style.display = el.innerText.includes(query) ? 'flex' : 'none');
        }
    </script>
</body>
</html>
