<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS - البيئة الإدراكية الشاملة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #070a13;
            --panel-bg: #0f1626;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-hover: #0ea5e9;
            --error-red: #f43f5e;
            --success-green: #10b981;
            --code-bg: #030712;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Cairo', Tahoma, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .logo-area {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 20px 0 10px 0;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .tool-btn {
            background: none;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 12px 15px;
            text-align: right;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: all 0.25s ease;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .tool-btn:hover, .tool-btn.active {
            background-color: #1e293b;
            color: var(--accent-blue);
            border-color: rgba(56, 189, 248, 0.2);
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 35px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .tool-header { margin-bottom: 30px; }
        .tool-header h1 { margin: 0 0 8px 0; font-size: 26px; font-weight: 700; color: var(--text-main); }
        .tool-header p { margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.6; }

        .interface-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 10px; color: var(--text-main); font-size: 14px; font-weight: 600; }

        .input-field {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            color: var(--text-main);
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            resize: vertical;
            transition: border-color 0.2s;
        }

        .input-field:focus { outline: none; border-color: var(--accent-blue); }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 13px;
            transition: color 0.2s;
        }
        .checkbox-container:hover { color: var(--text-main); }

        .controls-row { display: flex; gap: 15px; align-items: center; margin-top: 15px; }

        .model-select {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            cursor: pointer;
        }

        .action-btn {
            background-color: var(--accent-blue);
            color: #030712;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.2s ease;
        }

        .action-btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
        .action-btn:disabled { background-color: var(--border-color); color: var(--text-muted); cursor: not-allowed; transform: none; }

        /* لوحة العرض الراقية والمحسنة نصوصاً وبصرياً */
        .output-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            min-height: 150px;
            line-height: 1.8;
            overflow-x: auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* حركات الظهور الناعمة للبيانات المستلمة */
        .fade-in-content {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* صياغة العناوين وتناسق المسافات */
        .output-panel h1, .output-panel h2, .output-panel h3 { color: var(--text-main); font-weight: 600; margin-top: 25px; margin-bottom: 12px; }
        .output-panel h1 { font-size: 22px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .output-panel h2 { font-size: 18px; color: var(--accent-blue); }
        .output-panel p { margin-bottom: 16px; font-size: 15.5px; color: #e2e8f0; }
        
        /* القوائم المنسقة */
        .output-panel ul, .output-panel ol { padding-right: 25px; margin-bottom: 18px; color: #e2e8f0; }
        .output-panel li { margin-bottom: 6px; }
        
        /* الجداول الذكية الراقية */
        .output-panel table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 25px 0;
            font-size: 14.5px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .output-panel th { background-color: #1e293b; color: var(--accent-blue); padding: 14px; text-align: right; font-weight: 600; }
        .output-panel td { padding: 14px; border-bottom: 1px solid var(--border-color); background-color: #0b1324; color: #e2e8f0; }
        .output-panel tr:last-child td { border-bottom: none; }
        .output-panel tr:nth-child(even) td { background-color: #0f192e; }

        /* كتل الأكواد البرمجية الفاخرة */
        .output-panel code { background-color: #1e293b; padding: 3px 6px; border-radius: 4px; font-family: 'Consolas', monospace; color: #f43f5e; font-size: 13.5px; }
        .output-panel pre { background-color: var(--code-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); overflow-x: auto; margin: 20px 0; position: relative; }
        .output-panel pre::before { content: "CODE BLOCK"; position: absolute; top: 0; left: 20px; font-size: 9px; color: var(--text-muted); background: #1f2937; padding: 2px 8px; border-radius: 0 0 4px 4px; font-family: sans-serif; }
        .output-panel pre code { background: none; padding: 0; color: #34d399; font-size: 14px; font-family: 'Consolas', 'Courier New', monospace; }

        /* الصناديق التنبيهية والاقتباسات (Callouts) */
        .output-panel blockquote {
            margin: 20px 0;
            padding: 15px 20px;
            background-color: rgba(56, 189, 248, 0.06);
            border-right: 4px solid var(--accent-blue);
            border-left: none;
            border-radius: 4px;
            color: #cbd5e1;
            font-style: normal;
        }
        .output-panel blockquote p { margin: 0; font-size: 15px; }

        .status-bar { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 15px; padding: 0 5px; }
        .status-indicator { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--text-muted); }
        .dot.active { background-color: var(--success-green); }
        .dot.error { background-color: var(--error-red); }
        
        #output-image {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area">Tafkek OS</div>
        
        <div class="section-title">الأساس الفوري والربط</div>
        <button id="btn-grounding" class="tool-btn active" onclick="switchTool('grounding', this)">🌐 التوثيق وبحث جوجل الفوري</button>
        <button id="btn-deconstruct" class="tool-btn" onclick="switchTool('deconstruct', this)">🧠 التفكيك المنطقي والنصوص</button>
        
        <div class="section-title">بيئات المعالجة والوسائط</div>
        <button id="btn-analyze" class="tool-btn" onclick="switchTool('analyze-document', this)">📄 فحص الوثائق الذكي</button>
        <button id="btn-image" class="tool-btn" onclick="switchTool('generate-image', this)">🎨 استوديو توليد الصور الإبداعية</button>
    </div>

    <div class="workspace">
        <div class="tool-header">
            <h1 id="tool-title">التوثيق والربط ببحث جوجل الفوري (Google Search Grounding)</h1>
            <p id="tool-desc">تلقي إجابات حية من الإنترنت مدعومة بروابط مصادر ومراجع حية وموثوقة.</p>
        </div>

        <div class="interface-card">
            <div class="input-group">
                <textarea id="user-input" class="input-field" rows="4" placeholder="أدخل المدخلات أو الأمر المراد معالجته هنا..."></textarea>
            </div>

            <div class="input-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="feature-toggle" checked>
                    <span id="toggle-label">تفعيل محرك التوثيق الفوري (Grounding Enable)</span>
                </label>
            </div>

            <div class="controls-row">
                <button id="submit-btn" class="action-btn" onclick="executeProcess()">تفعيل المعالجة الإدراكية</button>
                
                <select id="model-select" class="model-select">
                    <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash (الأداء القياسي الفوري)</option>
                    <option value="gemini-2.5-pro">Gemini 2.5 Pro (التحليل والعمق البرمجي)</option>
                </select>
            </div>
        </div>

        <div id="output-box" class="output-panel">في انتظار تفعيل المعالجة الإدراكية...</div>
        <img id="output-image" alt="المخرجات الصورية الإبداعية" />
        
        <div class="status-bar">
            <div class="status-indicator">
                <div id="status-dot" class="dot"></div>
                <span id="status-text">النواة الحية: متصلة</span>
            </div>
            <div id="meta-info">الإصدار الشامل v3.0.0</div>
        </div>
    </div>

    <script>
        const toolsConfig = {
            'grounding': {
                title: 'التوثيق والربط ببحث جوجل الفوري (Google Search Grounding)',
                desc: 'تلقي إجابات حية من الإنترنت مدعومة بروابط مصادر ومراجع حية وموثوقة.',
                label: 'تفعيل محرك التوثيق الفوري (Grounding Enable)',
                apiEndpoint: '/api/deconstruct.js',
                isImage: false
            },
            'deconstruct': {
                title: 'التفكيك المنطقي والنصوص (Semantic Deconstruction)',
                desc: 'تحليل البنى اللغوية، استخراج المفاهيم الأساسية عبر خوادم Groq فائقة السرعة.',
                label: 'استخدام التفكيك الكثيف عبر جروق',
                apiEndpoint: '/api/deconstruct-groq.js',
                isImage: false
            },
            'analyze-document': {
                title: 'فحص وفحص الوثائق الذكي (Analyze Document)',
                desc: 'استخراج الهياكل النصية وتحليل مستندات النظام وسياقاتها المعقدة.',
                label: 'فحص المستندات والروابط النصية المعمقة',
                apiEndpoint: '/api/analyze-document.js',
                isImage: false
            },
            'generate-image': {
                title: 'استوديو توليد الصور الإبداعية (Generate Image Studio)',
                desc: 'توليد أصول بصرية وصور حية عالية الدقة بناءً على التوصيف اللغوي بدون نصوص مضمنة.',
                label: 'السماح للذكاء البصري بالابتكار التلقائي',
                apiEndpoint: '/api/generate-image.js',
                isImage: true
            }
        };

        let currentToolKey = 'grounding';

        function switchTool(toolKey, element) {
            currentToolKey = toolKey;
            const config = toolsConfig[toolKey];
            
            document.getElementById('tool-title').innerText = config.title;
            document.getElementById('tool-desc').innerText = config.desc;
            document.getElementById('toggle-label').innerText = config.label;
            
            document.getElementById('output-image').style.display = 'none';
            document.getElementById('output-box').style.display = 'block';

            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            if(element) {
                element.classList.add('active');
            }
        }

        async function executeProcess() {
            const inputVal = document.getElementById('user-input').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const outputBox = document.getElementById('output-box');
            const outputImg = document.getElementById('output-image');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            if (!inputVal) {
                alert('يرجى كتابة نص المعالجة أولاً.');
                return;
            }

            submitBtn.disabled = true;
            outputBox.innerText = 'جاري المعالجة السحابية عبر النواة المخصصة...';
            outputBox.style.color = 'var(--text-main)';
            outputImg.style.display = 'none';
            statusDot.className = 'dot active';
            statusText.innerText = 'جاري المعالجة...';

            const activeTool = toolsConfig[currentToolKey];
            const selectedModel = document.getElementById('model-select').value;

            try {
                const response = await fetch(activeTool.apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: inputVal, model: selectedModel })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `خطأ الخادم: ${response.status}`);
                }

                if (activeTool.isImage && data.imageUrl) {
                    outputBox.style.display = 'none';
                    outputImg.src = data.imageUrl;
                    outputImg.style.display = 'block';
                    statusText.innerText = `تم توليد الصورة بنجاح عبر [${data.source}]`;
                } else {
                    outputBox.style.display = 'block';
                    
                    // تحويل وعرض الـ Markdown الفاخر وإضافة كلاس الحركة الصاعد تلقائياً
                    if (window.marked && typeof window.marked.parse === 'function') {
                        outputBox.innerHTML = `<div class="fade-in-content">${window.marked.parse(data.result)}</div>`;
                    } else {
                        outputBox.innerText = data.result;
                    }
                    statusText.innerText = `تمت المعالجة بنجاح عبر [${data.source}]`;
                }

            } catch (error) {
                outputBox.style.display = 'block';
                outputBox.innerHTML = `خطأ أثناء تنفيذ الأداة المخصصة:<br><strong>${error.message}</strong>`;
                outputBox.style.color = 'var(--error-red)';
                statusDot.className = 'dot error';
                statusText.innerText = 'فشل الاتصال';
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
