<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS v2.0</title>
    <!-- استدعاء مكتبة لتفسير وتحويل الجداول والمصفوفات الذكية القادمة من السيرفر -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1e20;
            --bg-hover: #282a2c;
            --bg-input: #1e1e20;
            --text-main: #e3e3e3;
            --text-sub: #c4c7c5;
            --border: #444746;
            --gemini-gradient: linear-gradient(74deg, #4285f4 0%, #9b51e0 50%, #e91e63 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ------------------ الشريط الجانبي الذكي ------------------ */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 12px;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar.collapsed .hide-text {
            display: none;
        }

        .new-chat-btn {
            background-color: #1a1a1c;
            border: none;
            color: var(--text-sub);
            padding: 14px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            width: 100%;
        }

        .new-chat-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        /* ------------------ المساحة الرئيسية للمحادثة والتفكيك ------------------ */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .top-bar {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
        }

        .toggle-sidebar-btn:hover {
            background-color: var(--bg-hover);
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-sub);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 40px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        /* واجهة الترحيب الافتراضية المقتبسة من Gemini */
        .welcome-view {
            margin-top: 8vh;
        }

        .greeting {
            font-size: 3.5rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .gradient-text {
            background: var(--gemini-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-greeting {
            font-size: 3.5rem;
            color: #444746;
            font-weight: 500;
            margin-bottom: 50px;
        }

        /* ------------------ مصفوفة تدفق رسائل التفكيك والجداول ------------------ */
        .conversation-flow {
            display: none;
            flex-direction: column;
            gap: 35px;
            padding-bottom: 40px;
        }

        .chat-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .avatar.user-avatar { background-color: #565869; color: white; }
        .avatar.ai-avatar { background: var(--gemini-gradient); color: white; }

        .message-content {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-main);
            flex: 1;
            width: 100%;
        }

        /* 🔥 التنسيق الاحترافي لـ مصفوفة الجداول المسترجعة وتثبيتها كما في الصورة تماماً */
        .message-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: #171719;
            border: 1px solid var(--border);
        }

        .message-content th, .message-content td {
            border: 1px solid var(--border);
            padding: 14px;
            text-align: right;
            font-size: 0.95rem;
        }

        .message-content th {
            background-color: #1e1e20;
            color: #74a1eb; /* اللون الأزرق المميز للعناوين الأساسية */
            font-weight: bold;
        }

        .message-content tr:nth-child(even) {
            background-color: #1a1a1c;
        }

        /* أنيميشن شريط التحميل المتلألئ */
        .shimmer-line {
            display: none;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #4285f4, #9b51e0, #e91e63, #4285f4);
            background-size: 300% 100%;
            animation: shimmerAnimation 2s infinite linear;
            border-radius: 2px;
            margin-top: 15px;
        }

        @keyframes shimmerAnimation {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* ------------------ صندوق الإدخال السفلي المطابق لهوية نظام تفكيك ------------------ */
        .input-area-wrapper {
            padding: 10px 60px 25px 60px;
            background: linear-gradient(transparent, var(--bg-main) 40%);
            position: relative;
        }

        .input-box-container {
            max-width: 850px;
            margin: 0 auto;
            background-color: var(--bg-input);
            border-radius: 32px;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid transparent;
        }

        .input-box-container:focus-within {
            border-color: #4285f4;
        }

        .input-box-container textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.05rem;
            outline: none;
            resize: none;
            padding: 10px 0;
            max-height: 150px;
        }

        .action-icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.25rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-icon-btn:hover {
            background-color: var(--bg-hover);
        }

        .disclaimer { 
            text-align: center; 
            font-size: 0.75rem; 
            color: #727575; 
            margin-top: 10px; 
        }

        .version-tag {
            position: absolute;
            bottom: 25px;
            left: 40px;
            font-size: 0.8rem;
            color: #444746;
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div>
            <button class="new-chat-btn" onclick="resetToHome()">
                <span>＋</span>
                <span class="hide-text">محادثة جديدة</span>
            </button>
        </div>
        <div style="padding: 15px; font-size: 0.85rem; color: var(--text-sub);">
            Tafkek Engine Active
        </div>
    </aside>

    <main class="main-chat">
        <div class="top-bar">
            <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>
            <div class="brand-name">Tafkek OS</div>
            <div style="width: 40px;"></div>
        </div>

        <div class="chat-container">
            <!-- واجهة الترحيب العلوية -->
            <div class="welcome-view" id="welcomeView">
                <h1 class="greeting"><span class="gradient-text">مرحباً بك،</span></h1>
                <h2 class="sub-greeting">كيف يمكنني مساعدتك اليوم؟</h2>
            </div>

            <!-- حاوية الرسائل والجداول الحية -->
            <div class="conversation-flow" id="conversationFlow"></div>
            <div class="shimmer-line" id="shimmerLine"></div>
        </div>

        <!-- منطقة الإدخال السفلية المستعادة بالكامل مع نصوص الهوية الأصلية لتفكيك -->
        <div class="input-area-wrapper">
            <div class="input-box-container">
                <textarea id="chatInput" rows="1" placeholder="أدخل فكرتك هنا لتفكيكها بالكامل..." oninput="autoGrow(this)" onkeydown="handleKeyDown(event)"></textarea>
                <button class="action-icon-btn" style="color: #8ab4f8;" onclick="sendMessage()" title="إرسال الفكرة">✦</button>
            </div>
            <div class="disclaimer">نظام التفكيك متصل مباشرة بـ Gemini API. يرجى التحقق من الخطوات الهامة.</div>
            <div class="version-tag">Tafkek OS v2.0</div>
        </div>
    </main>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function autoGrow(element) {
            element.style.height = "5px";
            element.style.height = (element.scrollHeight) + "px";
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // 🚀 محرك الاتصال الفعلي والقراءة البصرية للجداول والخدمات المفقودة
        async function sendMessage() {
            const inputEl = document.getElementById('chatInput');
            const query = inputEl.value.trim();
            if (!query) return;

            document.getElementById('welcomeView').style.display = 'none';
            const flow = document.getElementById('conversationFlow');
            flow.style.display = 'flex';

            // إضافة رسالة المستخدم في مجرى الحوار
            flow.innerHTML += `
                <div class="chat-row user-row">
                    <div class="avatar user-avatar">ع</div>
                    <div class="message-content"><div>${query}</div></div>
                </div>
            `;

            inputEl.value = '';
            inputEl.style.height = 'auto';

            // إظهار أنيميشن التحميل
            document.getElementById('shimmerLine').style.display = 'block';
            const container = document.querySelector('.chat-container');
            container.scrollTop = container.scrollHeight;

            try {
                // الاتصال المباشر بملف السيرفر الخلفي الحقيقي لتفكيك الأفكار
                const response = await fetch('/api/deconstruct', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: query, message: query })
                });

                const data = await response.json();
                document.getElementById('shimmerLine').style.display = 'none';

                if (!response.ok) {
                    throw new Error(data.error || `خطأ سيرفر: ${response.status}`);
                }

                // استخراج رد الذكاء الاصطناعي (سواء كان نص عادي أو جدول ماركداون محمل بالمصفوفات)
                const rawReply = data.text || data.reply || data.content || "تمت المعالجة.";

                // 🔥 الخطوة السحرية: استخدام مكتبة marked لتحويل نصوص الجداول والمصفوفات البرمجية إلى جداول HTML حقيقية
                const formattedHTML = marked.parse(rawReply);

                flow.innerHTML += `
                    <div class="chat-row ai-row">
                        <div class="avatar ai-avatar">✦</div>
                        <div class="message-content">${formattedHTML}</div>
                    </div>
                `;

            } catch (error) {
                document.getElementById('shimmerLine').style.display = 'none';
                flow.innerHTML += `
                    <div class="chat-row ai-row">
                        <div class="avatar ai-avatar" style="background:#ff4a4a;">❌</div>
                        <div class="message-content" style="color:#ff4a4a;">
                            <strong>فشل في استدعاء معمل التفكيك العصبوني:</strong><br>
                            ${error.message}
                        </div>
                    </div>
                `;
            }

            container.scrollTop = container.scrollHeight;
        }

        function resetToHome() {
            document.getElementById('conversationFlow').innerHTML = '';
            document.getElementById('conversationFlow').style.display = 'none';
            document.getElementById('welcomeView').style.display = 'block';
        }
    </script>
</body>
</html>
