<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS</title>
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1e20;
            --bg-hover: #282a2c;
            --bg-input: #1e1e20;
            --text-main: #e3e3e3;
            --text-sub: #c4c7c5;
            --border: #444746;
            --gemini-gradient: linear-gradient(74deg, #4285f4 0%, #9b51e0 50%, #e91e63 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ------------------ الشريط الجانبي ------------------ */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 12px;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar.collapsed .hide-text {
            display: none;
        }

        .new-chat-btn {
            background-color: #1a1a1c;
            border: none;
            color: var(--text-sub);
            padding: 14px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            width: 100%;
        }

        .new-chat-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        .sidebar-menu {
            list-style: none;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 50px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .menu-item:hover {
            background-color: var(--bg-hover);
        }

        /* ------------------ المساحة الرئيسية ------------------ */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .top-bar {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
        }

        .toggle-sidebar-btn:hover {
            background-color: var(--bg-hover);
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-sub);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 60px;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        /* واجهة الترحيب الافتراضية */
        .welcome-view {
            margin-top: 8vh;
        }

        .greeting {
            font-size: 3.5rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .gradient-text {
            background: var(--gemini-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-greeting {
            font-size: 3.5rem;
            color: #444746;
            font-weight: 500;
            margin-bottom: 50px;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .suggestion-card {
            background-color: var(--bg-sidebar);
            padding: 22px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.95rem;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .suggestion-card:hover {
            background-color: var(--bg-hover);
        }

        /* ------------------ شريط تدفق الرسائل الحقيقي ------------------ */
        .conversation-flow {
            display: none;
            flex-direction: column;
            gap: 30px;
            padding-bottom: 40px;
        }

        .chat-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .avatar.user-avatar { background-color: #565869; color: white; }
        .avatar.ai-avatar { background: var(--gemini-gradient); color: white; }

        .message-content {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-main);
            white-space: pre-wrap;
            flex: 1;
        }

        .message-content img {
            max-width: 100%;
            max-height: 350px;
            border-radius: 12px;
            margin-top: 12px;
            border: 1px solid var(--border);
        }

        /* أنيميشن التحميل الخاص بـ Gemini */
        .shimmer-line {
            display: none;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #4285f4, #9b51e0, #e91e63, #4285f4);
            background-size: 300% 100%;
            animation: shimmerAnimation 2s infinite linear;
            border-radius: 2px;
            margin-top: 15px;
        }

        @keyframes shimmerAnimation {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* منطقة معاينة الصورة المرفقة قبل الإرسال */
        .preview-box {
            display: none;
            position: relative;
            margin-bottom: 10px;
            width: fit-content;
        }

        .preview-box img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .preview-box .remove-btn {
            position: absolute;
            top: -5px;
            left: -5px;
            background: #ff4a4a;
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            cursor: pointer;
            font-size: 10px;
        }

        /* ------------------ صندوق الإدخال السفلي ------------------ */
        .input-area-wrapper {
            padding: 10px 60px 25px 60px;
            background: linear-gradient(transparent, var(--bg-main) 40%);
        }

        .input-box-container {
            max-width: 850px;
            margin: 0 auto;
            background-color: var(--bg-input);
            border-radius: 32px;
            padding: 8px 22px;
            display: flex;
            flex-direction: column;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .input-box-container textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.05rem;
            outline: none;
            resize: none;
            padding: 10px 0;
            max-height: 150px;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.25rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-icon-btn:hover {
            background-color: var(--bg-hover);
        }

        .hidden-file-input { display: none; }
        .disclaimer { text-align: center; font-size: 0.75rem; color: #727575; margin-top: 10px; }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div>
            <button class="new-chat-btn" onclick="resetToHome()">
                <span>＋</span>
                <span class="hide-text">محادثة جديدة</span>
            </button>
        </div>
        <div>
            <ul class="sidebar-menu">
                <li class="menu-item" onclick="alert('عبدالله بن وهلان - Tafkek OS')">
                    <span>👤</span>
                    <span class="hide-text">الحساب</span>
                </li>
            </ul>
        </div>
    </aside>

    <main class="main-chat">
        <div class="top-bar">
            <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>
            <div class="brand-name">Tafkek OS</div>
            <div style="width: 40px;"></div>
        </div>

        <div class="chat-container">
            <div class="welcome-view" id="welcomeView">
                <h1 class="greeting"><span class="gradient-text">مرحباً بك،</span></h1>
                <h2 class="sub-greeting">كيف يمكنني مساعدتك اليوم؟</h2>
                
                <div class="suggestions-grid">
                    <div class="suggestion-card" onclick="selectSuggestion('قم بإنشاء متجر لبيع الهواتف الذكية')">
                        <span>قم بإنشاء متجر لبيع الهواتف الذكية مع الهيكلية</span>
                        <div class="card-icon">💻</div>
                    </div>
                    <div class="suggestion-card" onclick="selectSuggestion('توليد صورة واقعية لكوكب المريخ مستقبلي وعالي الدقة')">
                        <span>اطلب توليد صور ذكية فائقة الدقة بأسلوب فني</span>
                        <div class="card-icon">🎨</div>
                    </div>
                </div>
            </div>

            <div class="conversation-flow" id="conversationFlow"></div>
            <div class="shimmer-line" id="shimmerLine"></div>
        </div>

        <div class="input-area-wrapper">
            <div class="input-box-container">
                
                <div class="preview-box" id="previewBox">
                    <button class="remove-btn" onclick="clearImage()">×</button>
                    <img id="previewImg" src="">
                </div>

                <div class="input-row">
                    <input type="file" id="fileUpload" class="hidden-file-input" accept="image/*" onchange="previewImage(this)">
                    <button class="action-icon-btn" onclick="document.getElementById('fileUpload').click()" title="إرفاق صورة">📎</button>
                    
                    <textarea id="chatInput" rows="1" placeholder="اسأل تفكيك أو اطلب توليد صورة..." oninput="autoGrow(this)" onkeydown="handleKeyDown(event)"></textarea>
                    
                    <div class="input-actions">
                        <button class="action-icon-btn" style="color: #8ab4f8;" onclick="sendMessage()" title="إرسال الطلب">✦</button>
                    </div>
                </div>
            </div>
            <div class="disclaimer">مربوط حياً مع خوادم معالجة البيانات السحابية لـ Tafkek OS.</div>
        </div>
    </main>

    <script>
        let base64Image = null;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function autoGrow(element) {
            element.style.height = "5px";
            element.style.height = (element.scrollHeight) + "px";
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function selectSuggestion(text) {
            document.getElementById('chatInput').value = text;
            sendMessage();
        }

        // تحويل الصورة المرفقة ومعاينتها
        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    document.getElementById('previewImg').src = base64Image;
                    document.getElementById('previewBox').style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        function clearImage() {
            base64Image = null;
            document.getElementById('fileUpload').value = '';
            document.getElementById('previewBox').style.display = 'none';
        }

        // 🚀 محرك الإرسال الحقيقي والربط الفعلي مع Vercel
        async function sendMessage() {
            const inputEl = document.getElementById('chatInput');
            const query = inputEl.value.trim();
            
            if (!query && !base64Image) return;

            // إخفاء الترحيب وعرض صندوق الدردشة
            document.getElementById('welcomeView').style.display = 'none';
            const flow = document.getElementById('conversationFlow');
            flow.style.display = 'flex';

            // إضافة رسالة المستخدم مع الصورة إن وجدت
            let userContent = `<div>${query}</div>`;
            if (base64Image) {
                userContent += `<img src="${base64Image}" style="max-width:150px; border-radius:8px; margin-top:5px;">`;
            }
            
            flow.innerHTML += `
                <div class="chat-row user-row">
                    <div class="avatar user-avatar">ع</div>
                    <div class="message-content">${userContent}</div>
                </div>
            `;

            // حفظ الصورة الحالية وإعادة تهيئة الحقول لإدخال جديد
            const activeImage = base64Image;
            inputEl.value = '';
            inputEl.style.height = 'auto';
            clearImage();

            // تشغيل شريط التحميل المتلألئ
            document.getElementById('shimmerLine').style.display = 'block';
            const container = document.querySelector('.chat-container');
            container.scrollTop = container.scrollHeight;

            try {
                // 🔗 الاتصال المباشر بـ API الحقيقي الخاص بك على Vercel
                const response = await fetch('/api/deconstruct', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: query,        // تأكد من مطابقة المسمى (prompt أو message) حسب ما يتوقعه السيرفر لديك
                        image: activeImage    // إرسال الصورة للسيرفر إذا كان يدعم نظام الرؤية (Vision)
                    })
                });

                if (!response.ok) {
                    throw new Error(`السيرفر استجاب بخطأ: ${response.status}`);
                }

                const data = await response.json();
                
                // استخراج النصوص أو الصور بناءً على هيكلة الـ JSON الراجع من السيرفر لديك
                // (قم بتعديل الحقول data.text أو data.imageUrl حسب تصميم السيرفر الخلفي)
                const replyText = data.text || data.reply || data.content || "تمت المعالجة بنجاح.";
                const replyImage = data.imageUrl || data.image || null;

                // إخفاء الشريان اللامع وإضافة رد الذكاء الاصطناعي الفعلي
                document.getElementById('shimmerLine').style.display = 'none';
                
                let aiContent = `<div>${replyText}</div>`;
                if (replyImage) {
                    aiContent += `<img src="${replyImage}" alt="Generated Image">`;
                }

                flow.innerHTML += `
                    <div class="chat-row ai-row">
                        <div class="avatar ai-avatar">✦</div>
                        <div class="message-content">${aiContent}</div>
                    </div>
                `;

            } catch (error) {
                // في حال وجود خطأ حقيقي، سيتم قذفه هنا وسيظهر فوراً في تفاعلات السيرفر وواجهتك!
                document.getElementById('shimmerLine').style.display = 'none';
                flow.innerHTML += `
                    <div class="chat-row ai-row">
                        <div class="avatar ai-avatar" style="background:#ff4a4a;">❌</div>
                        <div class="message-content" style="color:#ff4a4a;">
                            فشل الاتصال بالخادم الخلفي لموقعك.<br>
                            <strong>السبب:</strong> ${error.message}<br>
                            تأكد من رفع الكود الخلفي بشكل سليم ومطابقة مسميات المتغيرات المرسلة.
                        </div>
                    </div>
                `;
            }

            container.scrollTop = container.scrollHeight;
        }

        function resetToHome() {
            document.getElementById('conversationFlow').innerHTML = '';
            document.getElementById('conversationFlow').style.display = 'none';
            document.getElementById('welcomeView').style.display = 'block';
            clearImage();
        }
    </script>
</body>
</html>
