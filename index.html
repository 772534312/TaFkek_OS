<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS | Ultimate Build</title>
    <style>
        :root { --bg: #131314; --panel: #1e1e20; --text: #e3e3e3; --accent: #8ab4f8; --border: #444746; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        #workspace { width: 100%; max-width: 800px; }
        textarea { width: 100%; height: 200px; background: var(--panel); color: white; border: 1px solid var(--border); padding: 15px; border-radius: 8px; resize: vertical; }
        button { background: var(--accent); border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        #radarAlert { position: fixed; top: 20px; right: 20px; background: #d93025; padding: 15px; border-radius: 8px; display: none; }
        #adminModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 30px; border-radius: 12px; border: 1px solid var(--accent); z-index: 100; }
        .ghost-zone { position: fixed; bottom: 0; left: 0; width: 40px; height: 40px; cursor: pointer; opacity: 0; }
    </style>
</head>
<body>

    <div id="workspace">
        <h1>Tafkek OS</h1>
        <textarea id="mainInput" placeholder="اكتب فكرتك هنا..."></textarea>
        <button onclick="TafkekCore.process()">تحليل وتفكيك</button>
        <button onclick="TafkekCore.exportData()" style="background:transparent; border:1px solid var(--accent); color:var(--accent);">تصدير بيانات</button>
    </div>

    <div id="adminModal">
        <h3>مركز التحكم (Admin)</h3>
        <select id="simMode"><option value="critical">نقد تحليلي</option><option value="financial">جدوى مالية</option></select>
        <button onclick="TafkekCore.closeAdmin()">إغلاق وحفظ</button>
    </div>

    <div id="radarAlert"></div>
    <div class="ghost-zone" onclick="TafkekCore.openAdmin()"></div>

    <script>
        const TafkekCore = {
            storageKey: 'tafkek_data',

            process: function() {
                const text = document.getElementById('mainInput').value.trim();
                if (!text) return;

                const history = JSON.parse(localStorage.getItem(this.storageKey) || '[]');
                
                // تحسين الرادار: مقارنة دقيقة وتجاهل التطابق التام مع المدخل الحالي
                const isDuplicate = history.some(item => 
                    item.length > 10 && text.length > 10 && item.includes(text.substring(0, 10))
                );

                if (isDuplicate) {
                    const alert = document.getElementById('radarAlert');
                    alert.innerText = "⚠️ تنبيه: تم العثور على تشابه مع مشروع سابق.";
                    alert.style.display = 'block';
                    setTimeout(() => alert.style.display = 'none', 3000);
                }

                history.push(text);
                localStorage.setItem(this.storageKey, JSON.stringify(history));
                document.getElementById('mainInput').value = '';
                alert("تم التفكيك والحفظ بنجاح!");
            },

            openAdmin: function() {
                const pin = prompt("أدخل رمز الدخول:");
                if(pin === "1234") document.getElementById('adminModal').style.display = 'block';
            },

            closeAdmin: function() { document.getElementById('adminModal').style.display = 'none'; },

            exportData: function() {
                const data = localStorage.getItem(this.storageKey);
                const blob = new Blob([data], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'data.json'; a.click();
            }
        };
    </script>
</body>
</html>
