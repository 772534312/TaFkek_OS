<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS - Gemini Studio (v12.0)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #000000;
            --panel-bg: rgba(18, 18, 20, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #38bdf8;
            --accent-rgb: 56, 189, 248;
            --gemini-pill-bg: #1e1e22;
            --gemini-active-blue: #2563eb;
            --glass-glow: rgba(56, 189, 248, 0.15);
            --success-green: #10b981;
        }

        body.theme-cyberpunk {
            --bg-dark: #0f051d; --panel-bg: rgba(26, 11, 46, 0.85);
            --border-color: rgba(236, 72, 153, 0.2); --accent-blue: #f43f5e; --accent-rgb: 244, 63, 94;
            --gemini-pill-bg: #221230; --gemini-active-blue: #e11d48;
            --glass-glow: rgba(244, 63, 94, 0.15);
        }

        body.theme-matrix {
            --bg-dark: #020d08; --panel-bg: rgba(5, 26, 15, 0.85);
            --border-color: rgba(16, 185, 129, 0.2); --accent-blue: #10b981; --accent-rgb: 16, 185, 129;
            --gemini-pill-bg: #092014; --gemini-active-blue: #059669;
            --glass-glow: rgba(16, 185, 129, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0; background-color: var(--bg-dark);
            color: var(--text-main); font-family: 'Cairo', sans-serif;
            display: flex; height: 100vh; overflow: hidden; position: relative;
            transition: background-color 0.4s ease;
        }

        #neural-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; opacity: 0.35;
        }

        /* القائمة الجانبية اليمنى */
        .sidebar {
            width: 320px; background-color: var(--panel-bg);
            backdrop-filter: blur(16px); border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 20px;
            overflow-y: auto; z-index: 5; box-shadow: 5px 0 25px rgba(0,0,0,0.5);
        }

        .logo-area {
            font-size: 20px; font-weight: 700; color: var(--text-main);
            margin-bottom: 15px; border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }

        .user-profile-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 10px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between; transition: all 0.3s;
        }
        .user-profile-card:hover { border-color: var(--accent-blue); box-shadow: 0 0 12px var(--glass-glow); }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-blue); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; }
        .user-details { display: flex; flex-direction: column; font-size: 11px; }
        .user-name { font-weight: bold; color: var(--text-main); }
        .user-email { color: var(--text-muted); font-size: 10px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .btn-auth {
            background: rgba(var(--accent-rgb), 0.15); border: 1px solid var(--accent-blue);
            color: var(--accent-blue); padding: 9px; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-family: 'Cairo'; width: 100%;
            margin-bottom: 12px; transition: all 0.3s ease; font-size: 12px;
        }
        .btn-auth:hover { background: var(--accent-blue); color: #000; box-shadow: 0 0 15px var(--glass-glow); }

        .btn-new-chat {
            background: rgba(var(--accent-rgb), 0.1); border: 1px solid var(--accent-blue);
            color: var(--accent-blue); padding: 10px; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-family: 'Cairo'; width: 100%;
            margin-bottom: 12px; transition: all 0.3s;
        }
        .btn-new-chat:hover { background: var(--accent-blue); color: #000; transform: translateY(-2px); }

        .search-history-input {
            width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 8px 12px; color: var(--text-main);
            font-size: 12px; font-family: 'Cairo'; margin-bottom: 15px; transition: border-color 0.3s;
        }
        .search-history-input:focus { outline: none; border-color: var(--accent-blue); }

        .section-title-row { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 6px 0; }
        .section-title { font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; font-weight: 600; }

        .tool-btn {
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 10px 14px; text-align: right; border-radius: 10px; cursor: pointer;
            margin-bottom: 6px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 13px; font-family: 'Cairo';
            display: flex; align-items: center; gap: 8px; width: 100%; position: relative; overflow: hidden;
        }
        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.08); color: var(--accent-blue);
            border-color: var(--accent-blue); transform: translateX(-4px); box-shadow: 0 4px 15px var(--glass-glow);
        }
        .tool-btn.active {
            background: rgba(var(--accent-rgb), 0.15); color: var(--accent-blue);
            border-color: var(--accent-blue); font-weight: 600; box-shadow: 0 0 12px var(--glass-glow);
        }

        .icon-btn {
            background: transparent; border: none; color: var(--text-muted);
            padding: 6px 8px; border-radius: 50%; cursor: pointer;
            font-size: 16px; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.1); }

        .session-item {
            display: flex; flex-direction: column; gap: 4px;
            padding: 10px; border-radius: 8px; font-size: 12px; color: var(--text-muted);
            cursor: pointer; margin-bottom: 6px; background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent; transition: all 0.2s;
        }
        .session-item:hover { background: rgba(255, 255, 255, 0.06); color: var(--text-main); border-color: var(--border-color); }
        .session-item.pinned { border-right: 3px solid var(--accent-blue); background: rgba(var(--accent-rgb), 0.08); }
        .session-item-header { display: flex; justify-content: space-between; align-items: center; }
        .session-meta { font-size: 10px; color: var(--text-muted); opacity: 0.7; }

        /* الواجهة اليسرى بأسلوب Gemini */
        .workspace {
            flex: 1; display: flex; flex-direction: column;
            overflow: hidden; z-index: 2; position: relative;
            background: radial-gradient(circle at 50% 100%, rgba(20, 35, 60, 0.25), transparent 70%);
        }

        /* الهيدر العلوي لجمناي */
        .gemini-top-bar {
            padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
            z-index: 10;
        }

        .gemini-model-selector {
            display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600;
            color: var(--text-main); cursor: pointer; padding: 6px 12px; border-radius: 20px;
            transition: background 0.2s;
        }
        .gemini-model-selector:hover { background: rgba(255, 255, 255, 0.08); }
        .gemini-model-selector span.dot-blue { width: 8px; height: 8px; background: var(--accent-blue); border-radius: 50%; }

        /* منطقة المحادثة */
        .chat-stream {
            flex: 1; overflow-y: auto; padding: 20px 40px;
            display: flex; flex-direction: column; gap: 20px;
            scroll-behavior: smooth;
        }

        /* الشاشة المركزية الترحيبية (Gemini Hero) */
        .gemini-hero-center {
            margin: auto; display: flex; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; gap: 20px; padding-bottom: 40px;
        }

        /* شعار النجمة المتوهجة لجمناي */
        .gemini-sparkle-logo {
            width: 48px; height: 48px; position: relative;
            animation: pulseGlow 3s infinite alternate ease-in-out;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.95); filter: drop-shadow(0 0 10px rgba(56,189,248,0.4)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(56,189,248,0.8)); }
        }

        .gemini-hero-title {
            font-size: 28px; font-weight: 600; color: #ffffff; letter-spacing: -0.5px;
        }

        /* فقاعات المحادثة */
        .chat-row { display: flex; flex-direction: column; gap: 6px; max-width: 800px; width: 100%; margin: 0 auto; }
        .chat-row.user-row { align-items: flex-end; }
        .chat-row.ai-row { align-items: flex-start; }

        .bubble {
            padding: 14px 20px; border-radius: 22px; font-size: 15px; line-height: 1.7;
            max-width: 85%; position: relative; word-break: break-word;
        }
        .user-row .bubble {
            background: #23252b; color: #ffffff; border-bottom-left-radius: 6px;
        }
        .ai-row .bubble {
            background: transparent; color: #e3e3e3; width: 100%; padding-right: 0;
        }

        .bubble-actions {
            display: flex; gap: 8px; margin-top: 10px; opacity: 0.8;
        }

        /* Loader */
        .gemini-loader { display: flex; align-items: center; gap: 10px; color: var(--accent-blue); font-size: 14px; }

        /* شريط الإدخال البيضاوي العائم (Gemini Floating Pill Prompt Bar) */
        .gemini-pill-container {
            padding: 0 20px 24px 20px; width: 100%; max-width: 820px; margin: 0 auto;
        }

        .gemini-pill-bar {
            background-color: var(--gemini-pill-bg);
            border-radius: 35px; padding: 8px 16px 8px 12px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .gemini-pill-bar:focus-within {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .btn-pill-action {
            background: transparent; border: none; color: #9ca3af;
            font-size: 20px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; width: 36px; height: 36px; border-radius: 50%;
            transition: background 0.2s, color 0.2s;
        }
        .btn-pill-action:hover { color: #ffffff; background: rgba(255, 255, 255, 0.1); }

        .pill-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #ffffff; font-family: 'Cairo', sans-serif; font-size: 15px;
            resize: none; max-height: 120px; min-height: 24px; line-height: 1.5;
            padding: 4px 0;
        }
        .pill-input::placeholder { color: #8e8e93; }

        /* الدائرة الزرقاء لأيقونة الصوت المباشر */
        .btn-live-wave {
            background-color: var(--gemini-active-blue); color: #ffffff;
            border: none; width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
        }
        .btn-live-wave:hover { transform: scale(1.05); }

        /* إيقونات الأوجه التعبيرية والمستكشف */
        .gemini-brand-sparkle {
            background: linear-gradient(135deg, #4285f4, #9b51e0, #e91e63);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <canvas id="neural-canvas"></canvas>

    <!-- القائمة الجانبية اليمنى (محفوظة بالكامل دون أي تعديل) -->
    <div class="sidebar">
        <div class="logo-area">
            <span>Tafkek OS</span>
            <div style="display:flex; gap:5px;">
                <button class="icon-btn" onclick="changeTheme('default')" title="النمط القياسي">🔵</button>
                <button class="icon-btn" onclick="changeTheme('cyberpunk')" title="نمط السايبربانك">🔴</button>
                <button class="icon-btn" onclick="changeTheme('matrix')" title="نمط الماتريكس">🟢</button>
            </div>

        <div id="user-card" class="user-profile-card" style="display: none;">
            <div class="user-info">
                <div id="user-avatar" class="user-avatar">U</div>

            </div>

        <button class="btn-new-chat" onclick="startNewSession()">+ محادثة سحابية جديدة</button>
        <input type="text" class="search-history-input" placeholder="🔍 بحث في سجل السحابة..." oninput="filterHistory(this.value)">
        
        <div class="section-title-row">
            <span class="section-title">الأدوات الحية</span>
        </div>
        <button class="tool-btn active" onclick="switchTool('grounding', this)">🌐 بحث جوجل والتوثيق الفوري</button>
        <button class="tool-btn" onclick="switchTool('deconstruct', this)">🧠 التفكيك المعرفي واللغوي</button>
        <button class="tool-btn" onclick="switchTool('ecom-deconstruct', this)">📊 تفكيك اللوجستيات الرقمية</button>

        <div class="section-title-row" style="margin-top: 18px;">
            <span class="section-title">السجل السحابي للمستخدم</span>
        </div>

    </div>

    <!-- الواجهة اليسرى المطابقة للتصميم الرسمي لـ Gemini -->
    <div class="workspace" id="main-workspace">
        
        <!-- Top Gemini Bar -->
        <div class="gemini-top-bar">
            <button class="icon-btn" title="سجل المحادثات" style="font-size:18px;">🖋️</button>
            
            <div class="gemini-model-selector">
                <span class="dot-blue"></span>
                <span>Tafkek Flash</span>
                <span style="font-size:12px; color:var(--text-muted);">⌄</span>
            </div>

            <button class="icon-btn" title="القائمة" style="font-size:20px;">☰</button>
        </div>

        <!-- Chat Area Stream -->
        <div class="chat-stream" id="chat-stream">
            <div class="gemini-hero-center" id="gemini-hero">
                <!-- SVG Sparkle Logo Matching Gemini -->
                <svg class="gemini-sparkle-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#sparkle-grad)"/>
                    <defs>
                        <linearGradient id="sparkle-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#38BDF8"/>
                            <stop offset="0.5" stop-color="#818CF8"/>
                            <stop offset="1" stop-color="#F43F5E"/>
                        </linearGradient>
                    </defs>
                </svg>
                <div class="gemini-hero-title">جاهز متى شئت</div>
            </div>
        </div>

        <!-- Floating Gemini Pill Prompt Input -->
        <div class="gemini-pill-container">
            <div class="gemini-pill-bar">
                
                <!-- Attachment Plus Button -->
                <button class="btn-pill-action" title="إضافة ملف أو صورة" onclick="document.getElementById('file-upload').click()">
                    <span style="font-size: 22px; font-weight: 300;">+</span>
                </button>
                <input type="file" id="file-upload" style="display:none;" onchange="alert('تم إرفاق الملف بطلبك!')">

                <!-- Main Text Input Placeholder -->
                <textarea id="user-input" class="pill-input" rows="1" placeholder="اسأل Tafkek OS" oninput="autoResizeTextarea(this)" onkeydown="handleKeyDown(event)"></textarea>

                <!-- Microphone Button -->
                <button class="btn-pill-action" title="الإدخال الصوتي" onclick="startVoiceInput()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>

                <!-- Live Audio/Waveform Blue Button -->
                <button class="btn-live-wave" id="submit-btn" onclick="executeProcess()" title="إرسال الطلب">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 9h2v6H6zm4-4h2v14h-2zm4 3h2v8h-2zm4 3h2v2h-2z"/>
                    </svg>
                </button>

            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 0. Neural Network Animation Canvas
        // ==========================================
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        for (let i = 0; i < 35; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                radius: Math.random() * 2 + 1
            });
        }

        function animateNeuralNetwork() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const computedStyle = getComputedStyle(document.documentElement);
            let accentColor = computedStyle.getPropertyValue('--accent-blue').trim() || '#38bdf8';

            ctx.fillStyle = accentColor;
            ctx.strokeStyle = accentColor;

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y);
                        ctx.globalAlpha = (1 - (dist / 120)) * 0.2; ctx.stroke(); ctx.globalAlpha = 1.0;
                    }
                }
            }
            requestAnimationFrame(animateNeuralNetwork);
        }
        animateNeuralNetwork();

        // ==========================================
        // 1. Firebase Logic
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCJutNsE1b9jhQb6TRkO4HxcTWEDOe1WUE",
            authDomain: "tafkekos.firebaseapp.com",
            projectId: "tafkekos",
            storageBucket: "tafkekos.firebasestorage.app",
            messagingSenderId: "402724924724",
            appId: "1:402724924724:web:8cf9c04583ff3998c48961",
            measurementId: "G-WT4BBKEKVK"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let savedSessions = [];

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-card').style.display = 'flex';
                document.getElementById('user-name').innerText = user.displayName || 'مستخدم';
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-avatar').innerText = (user.displayName || user.email)[0].toUpperCase();
                fetchUserSessionsCloud();
            } else {
                currentUser = null;
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('user-card').style.display = 'none';
                savedSessions = [];
                renderSessionHistory();
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => alert("خطأ تسجيل الدخول: " + error.message));
        }

        function logoutUser() { auth.signOut(); }

        function fetchUserSessionsCloud() {
            if (!currentUser) return;
            db.collection('users').doc(currentUser.uid).collection('sessions')
              .orderBy('timestamp', 'desc')
              .onSnapshot(snapshot => {
                  savedSessions = [];
                  snapshot.forEach(doc => savedSessions.push({ id: doc.id, ...doc.data() }));
                  renderSessionHistory();
              });
        }

        async function saveSessionToCloud(title, prompt, result) {
            if (!currentUser) return;
            const sessionData = {
                title: title,
                toolKey: currentToolKey,
                prompt: prompt,
                result: result,
                pinned: false,
                charCount: result.length,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                date: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })
            };
            await db.collection('users').doc(currentUser.uid).collection('sessions').add(sessionData);
        }

        async function togglePinSession(id, event) {
            event.stopPropagation();
            if (!currentUser) return;
            const session = savedSessions.find(s => s.id === id);
            if (session) {
                await db.collection('users').doc(currentUser.uid).collection('sessions').doc(id).update({ pinned: !session.pinned });
            }
        }

        async function deleteSession(id, event) {
            event.stopPropagation();
            if (!currentUser) return;
            await db.collection('users').doc(currentUser.uid).collection('sessions').doc(id).delete();
        }

        function renderSessionHistory() {
            const list = document.getElementById('session-history-list');
            list.innerHTML = '';

            if (!currentUser) {
                list.innerHTML = '<div style="font-size:11px; color:var(--text-muted); text-align:center; padding:10px;">يرجى تسجيل الدخول لحفظ واسترجاع محادثاتك.</div>';
                return;
            }

            const sorted = [...savedSessions].sort((a, b) => b.pinned - a.pinned);

            if (sorted.length === 0) {
                list.innerHTML = '<div style="font-size:11px; color:var(--text-muted); text-align:center; padding:10px;">لا توجد جلسات معالجة محفوظة بعد.</div>';
                return;
            }

            sorted.forEach(s => {
                const item = document.createElement('div');
                item.className = `session-item ${s.pinned ? 'pinned' : ''}`;
                item.onclick = () => loadSessionData(s.id);
                item.innerHTML = `
                    <div class="session-item-header">
                        <span style="font-weight:600; font-size:12px; color:var(--text-main); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px;">${s.title}</span>
                        <div style="display:flex; gap:3px;">
                            <button class="icon-btn" onclick="togglePinSession('${s.id}', event)" title="تثبيت">${s.pinned ? '📍' : '📌'}</button>
                            <button class="icon-btn" onclick="deleteSession('${s.id}', event)" title="حذف">🗑️</button>
                        </div>
                    </div>
                    <div class="session-meta">
                        <span>🕒 ${s.date || ''}</span> • <span>📝 ${s.charCount || 0} حرف</span>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function loadSessionData(id) {
            const session = savedSessions.find(s => s.id === id);
            if (!session) return;

            const chatStream = document.getElementById('chat-stream');
            chatStream.innerHTML = '';

            appendUserBubble(session.prompt);
            appendAiBubble(session.result);
        }

        // ==========================================
        // 2. Gemini UI Mechanics & Interactions
        // ==========================================
        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                executeProcess();
            }
        }

        function appendUserBubble(text) {
            const chatStream = document.getElementById('chat-stream');
            const hero = document.getElementById('gemini-hero');
            if (hero) hero.remove();

            const row = document.createElement('div');
            row.className = 'chat-row user-row';
            row.innerHTML = `<div class="bubble">${text.replace(/\n/g, '<br>')}</div>`;
            chatStream.appendChild(row);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function appendAiBubble(markdownText) {
            const chatStream = document.getElementById('chat-stream');
            const row = document.createElement('div');
            row.className = 'chat-row ai-row';

            const parsedHtml = window.marked.parse(markdownText);
            const msgId = 'msg-' + Date.now();

            row.innerHTML = `
                <div class="bubble">
                    <div id="${msgId}">${parsedHtml}</div>
                    <div class="bubble-actions">
                        <button class="icon-btn" onclick="copyTextFromElement('${msgId}')" title="نسخ">📋</button>
                    </div>
                </div>
            `;
            chatStream.appendChild(row);
            Prism.highlightAllUnder(row);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function appendLoaderBubble() {
            const chatStream = document.getElementById('chat-stream');
            const loaderRow = document.createElement('div');
            loaderRow.className = 'chat-row ai-row';
            loaderRow.id = 'active-loader';
            loaderRow.innerHTML = `
                <div class="bubble">
                    <div class="gemini-loader">
                        <span>جاري المعالجة والتفكير...</span>
                    </div>
                </div>
            `;
            chatStream.appendChild(loaderRow);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function removeLoaderBubble() {
            const loader = document.getElementById('active-loader');
            if (loader) loader.remove();
        }

        function copyTextFromElement(id) {
            const el = document.getElementById(id);
            if (el) {
                navigator.clipboard.writeText(el.innerText);
                alert('تم نسخ الإجابة بنجاح!');
            }
        }

        function startVoiceInput() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = 'ar-SA';
                recognition.onstart = () => alert('جاري الاستماع الآن... اتكلم بحرية.');
                recognition.onresult = (event) => {
                    document.getElementById('user-input').value = event.results[0][0].transcript;
                };
                recognition.start();
            } else {
                alert('المتصفح لا يدعم خاصية التعرف الصوتي المباشر.');
            }
        }

        // ==========================================
        // 3. API Tools Switch & Execution
        // ==========================================
        let currentToolKey = 'grounding';
        const toolsConfig = {
            'grounding': { title: '🌐 بحث جوجل والتوثيق الفوري', apiEndpoint: '/api/deconstruct.js' },
            'deconstruct': { title: '🧠 التفكيك المعرفي واللغوي', apiEndpoint: '/api/deconstruct-groq.js' },
            'ecom-deconstruct': { title: '📊 تفكيك اللوجستيات الرقمية', apiEndpoint: '/api/ecom-deconstruct.js' },
            'loop-destroyer': { title: '⚡ تتبع وحرق الأخطاء البرمجية', apiEndpoint: '/api/loop-destroyer.js' },
            'clean-image': { title: '🎨 استوديو التصاميم النظيفة', apiEndpoint: '/api/generate-image.js' },
            'support-agent': { title: '🛠️ المساعد الذكي لقنوات الدعم', apiEndpoint: '/api/support-agent.js' }
        };

        async function executeProcess() {
            const inputVal = document.getElementById('user-input').value.trim();
            if (!inputVal) return;

            appendUserBubble(inputVal);
            
            const input = document.getElementById('user-input');
            input.value = '';
            input.style.height = 'auto';

            appendLoaderBubble();

            try {
                const response = await fetch(toolsConfig[currentToolKey].apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: inputVal })
                });
                const data = await response.json();
                const resultText = data.result || 'لم يتم إرجاع نتائج.';
                
                removeLoaderBubble();
                appendAiBubble(resultText);

                if (currentUser) {
                    await saveSessionToCloud(toolsConfig[currentToolKey].title, inputVal, resultText);
                }
            } catch (err) { 
                removeLoaderBubble();
                appendAiBubble(`⚠️ **حدث خطأ أثناء المعالجة:** ${err.message}`); 
            }
        }

        function switchTool(key, el) {
            currentToolKey = key;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');
        }

        function startNewSession() {
            const chatStream = document.getElementById('chat-stream');
            chatStream.innerHTML = `
                <div class="gemini-hero-center" id="gemini-hero">
                    <svg class="gemini-sparkle-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#sparkle-grad)"/>
                        <defs>
                            <linearGradient id="sparkle-grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#38BDF8"/>
                                <stop offset="0.5" stop-color="#818CF8"/>
                                <stop offset="1" stop-color="#F43F5E"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="gemini-hero-title">جاهز متى شئت</div>
                </div>
            `;
            document.getElementById('user-input').value = '';
        }

        function changeTheme(theme) { document.body.className = theme === 'default' ? '' : `theme-${theme}`; }
        function filterHistory(query) {
            document.querySelectorAll('.session-item').forEach(el => el.style.display = el.innerText.includes(query) ? 'flex' : 'none');
        }
    </script>
</body>
</html>
