<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS - البيئة الإدراكية الشاملة</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #38bdf8;
            --accent-hover: #0ea5e9;
            --error-red: #ef4444;
            --success-green: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .logo-area {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 15px 0 10px 0;
            letter-spacing: 1px;
        }

        .tool-btn {
            background: none;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 12px 15px;
            text-align: right;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 5px;
            transition: all 0.2s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .tool-btn:hover, .tool-btn.active {
            background-color: var(--border-color);
            color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .tool-header { margin-bottom: 25px; }
        .tool-header h1 { margin: 0 0 10px 0; font-size: 28px; color: var(--text-main); }
        .tool-header p { margin: 0; color: var(--text-muted); font-size: 15px; line-height: 1.6; }

        .interface-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 10px; color: var(--text-main); font-size: 14px; }

        .input-field {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
        }

        .input-field:focus { outline: none; border-color: var(--accent-blue); }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 14px;
        }

        .controls-row { display: flex; gap: 15px; align-items: center; margin-top: 15px; }

        .model-select {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .action-btn {
            background-color: var(--accent-blue);
            color: var(--bg-dark);
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .action-btn:hover { background-color: var(--accent-hover); }
        .action-btn:disabled { background-color: var(--border-color); color: var(--text-muted); cursor: not-allowed; }

        /* لوحة عرض البيانات المتقدمة والمحسنة */
        .output-panel {
            background-color: #0d1322;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 25px;
            min-height: 120px;
            line-height: 1.7;
            overflow-x: auto;
        }

        /* تنسيق البيانات المعروضة بداخل اللوحة (جداول، قوائم، عناوين) */
        .output-panel h1, .output-panel h2, .output-panel h3 { color: var(--accent-blue); margin-top: 20px; margin-bottom: 10px; }
        .output-panel p { margin-bottom: 15px; font-size: 16px; }
        .output-panel ul, .output-panel ol { padding-right: 20px; margin-bottom: 15px; }
        .output-panel li { margin-bottom: 5px; }
        
        /* تنسيق رائع للجداول المتقدمة */
        .output-panel table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 15px;
        }
        .output-panel th { background-color: #1f2937; color: var(--accent-blue); padding: 12px; text-align: right; border: 1px solid var(--border-color); }
        .output-panel td { padding: 12px; border: 1px solid var(--border-color); background-color: #111827; }
        .output-panel tr:nth-child(even) td { background-color: #161e2e; }

        /* تنسيق اقتباسات الأكواد والنصوص البرمجية */
        .output-panel code { background-color: #1f2937; padding: 3px 6px; border-radius: 4px; font-family: monospace; color: #f43f5e; font-size: 14px; }
        .output-panel pre { background-color: #05070f; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); overflow-x: auto; margin: 15px 0; }
        .output-panel pre code { background: none; padding: 0; color: #34d399; font-size: 14px; }

        .status-bar { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 10px; padding: 0 5px; }
        .status-indicator { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--text-muted); }
        .dot.active { background-color: var(--success-green); }
        .dot.error { background-color: var(--error-red); }
        
        #output-image {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area">Tafkek OS</div>
        
        <div class="section-title">الأساس الفوري والربط</div>
        <button class="tool-btn active" onclick="switchTool('grounding')">🌐 التوثيق وبحث جوجل الفوري</button>
        <button class="tool-btn" onclick="switchTool('deconstruct')">🧠 التفكيك المنطقي والنصوص</button>
        
        <div class="section-title">بيئات المعالجة والوسائط</div>
        <button class="tool-btn" onclick="switchTool('analyze-document')">📄 فحص وفحص الوثائق الذكي</button>
        <button class="tool-btn" onclick="switchTool('generate-image')">🎨 استوديو توليد الصور الإبداعية</button>
    </div>

    <div class="workspace">
        <div class="tool-header">
            <h1 id="tool-title">التوثيق والربط ببحث جوجل الفوري (Google Search Grounding)</h1>
            <p id="tool-desc">تلقي إجابات حية من الإنترنت مدعومة بروابط مصادر ومراجع حية وموثوقة.</p>
        </div>

        <div class="interface-card">
            <div class="input-group">
                <textarea id="user-input" class="input-field" rows="4" placeholder="أدخل المدخلات أو الأمر المراد معالجته هنا..."></textarea>
            </div>

            <div class="input-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="feature-toggle" checked>
                    <span id="toggle-label">تفعيل محرك التوثيق الفوري (Grounding Enable)</span>
                </label>
            </div>

            <div class="controls-row">
                <button id="submit-btn" class="action-btn" onclick="executeProcess()">تفعيل المعالجة الإدراكية</button>
                
                <select id="model-select" class="model-select">
                    <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash (الأداء القياسي الفوري)</option>
                    <option value="gemini-2.5-pro">Gemini 2.5 Pro (التحليل والعمق البرمجي)</option>
                </select>
            </div>
        </div>

        <div id="output-box" class="output-panel">في انتظار تفعيل المعالجة الإدراكية...</div>
        <img id="output-image" alt="المخرجات الصورية الإبداعية" />
        
        <div class="status-bar">
            <div class="status-indicator">
                <div id="status-dot" class="dot"></div>
                <span id="status-text">النواة الحية: متصلة</span>
            </div>
            <div id="meta-info">الإصدار الشامل v3.0.0</div>
        </div>
    </div>

    <script>
        const toolsConfig = {
            'grounding': {
                title: 'التوثيق والربط ببحث جوجل الفوري (Google Search Grounding)',
                desc: 'تلقي إجابات حية من الإنترنت مدعومة بروابط مصادر ومراجع حية وموثوقة.',
                label: 'تفعيل محرك التوثيق الفوري (Grounding Enable)',
                apiEndpoint: '/api/deconstruct.js',
                isImage: false
            },
            'deconstruct': {
                title: 'التفكيك المنطقي والنصوص (Semantic Deconstruction)',
                desc: 'تحليل البنى اللغوية، استخراج المفاهيم الأساسية عبر خوادم Groq فائقة السرعة.',
                label: 'استخدام التفكيك الكثيف عبر جروق',
                apiEndpoint: '/api/deconstruct-groq.js',
                isImage: false
            },
            'analyze-document': {
                title: 'فحص وفحص الوثائق الذكي (Analyze Document)',
                desc: 'استخراج الهياكل النصية وتحليل مستندات النظام وسياقاتها المعقدة.',
                label: 'فحص المستندات والروابط النصية المعمقة',
                apiEndpoint: '/api/analyze-document.js',
                isImage: false
            },
            'generate-image': {
                title: 'استوديو توليد الصور الإبداعية (Generate Image Studio)',
                desc: 'توليد أصول بصرية وصور حية عالية الدقة بناءً على التوصيف اللغوي بدون نصوص مضمنة.',
                label: 'السماح للذكاء البصري بالابتكار التلقائي',
                apiEndpoint: '/api/generate-image.js',
                isImage: true
            }
        };

        let currentToolKey = 'grounding';

        function switchTool(toolKey) {
            currentToolKey = toolKey;
            const config = toolsConfig[toolKey];
            
            document.getElementById('tool-title').innerText = config.title;
            document.getElementById('tool-desc').innerText = config.desc;
            document.getElementById('toggle-label').innerText = config.label;
            
            document.getElementById('output-image').style.display = 'none';
            document.getElementById('output-box').style.display = 'block';

            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            if(event) event.currentTarget.classList.add('active');
        }

        async function executeProcess() {
            const inputVal = document.getElementById('user-input').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const outputBox = document.getElementById('output-box');
            const outputImg = document.getElementById('output-image');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            if (!inputVal) {
                alert('يرجى كتابة نص المعالجة أولاً.');
                return;
            }

            submitBtn.disabled = true;
            outputBox.innerText = 'جاري المعالجة السحابية عبر النواة المخصصة...';
            outputBox.style.color = 'var(--text-main)';
            outputImg.style.display = 'none';
            statusDot.className = 'dot active';
            statusText.innerText = 'جاري المعالجة...';

            const activeTool = toolsConfig[currentToolKey];
            const selectedModel = document.getElementById('model-select').value;

            try {
                const response = await fetch(activeTool.apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: inputVal, model: selectedModel })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `خطأ الخادم: ${response.status}`);
                }

               if (activeTool.isImage && data.imageUrl) {
    outputBox.style.display = 'none'; // إخفاء صندوق النصوص
    outputImg.src = data.imageUrl;     // وضع رابط الصورة الجديد
    outputImg.style.display = 'block'; // إظهار عنصر الصورة فوراً
    statusText.innerText = `تم توليد الصورة بنجاح عبر [${data.source}]`;
}
                } else {
                    outputBox.style.display = 'block';
                    
                    // التعديل السحري: استخدام المكتبة لتحويل النص المقروء إلى عناصر HTML متقدمة بدلاً من نص جاف
                    outputBox.innerHTML = marked.parse(data.result);
                    
                    statusText.innerText = `تمت المعالجة بنجاح عبر [${data.source}]`;
                }

            } catch (error) {
                outputBox.style.display = 'block';
                outputBox.innerHTML = `خطأ أثناء تنفيذ الأداة المخصصة:<br><strong>${error.message}</strong>`;
                outputBox.style.color = 'var(--error-red)';
                statusDot.className = 'dot error';
                statusText.innerText = 'فشل الاتصال';
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
