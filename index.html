<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Tafkek OS | All-in-One</title>
    <style>
        :root { --bg-main: #131314; --bg-panel: #202124; --text: #e3e3e3; --accent: #8ab4f8; }
        body { background: var(--bg-main); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; transition: 0.3s; }
        
        /* الرادار */
        #radarAlert { position: fixed; top: 20px; right: 20px; background: #3c4043; padding: 15px; border-radius: 8px; border-right: 4px solid var(--accent); display: none; }
        
        /* لوحة التحكم المحمية */
        #adminPanel { display: none; position: fixed; top: 50px; left: 50px; background: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid #444; z-index: 1000; width: 300px; }
        
        /* زر خفي للوصول */
        .ghost-btn { position: fixed; bottom: 0; left: 0; width: 30px; height: 30px; cursor: pointer; opacity: 0.05; }
    </style>
</head>
<body>

    <h1>Tafkek OS</h1>
    <div id="workspace">
        <textarea id="userInput" placeholder="اكتب فكرتك هنا لتفكيكها..." style="width:100%; height:100px;"></textarea>
        <button onclick="processInput()">تحليل الفكرة</button>
    </div>

    <div id="adminPanel">
        <h3>⚙️ مركز التحكم</h3>
        <label>وضع المحاكاة:</label>
        <select id="simMode">
            <option value="critical">🔍 النقد التحليلي</option>
            <option value="financial">💰 مالي</option>
            <option value="security">🛡️ أمن</option>
        </select>
        <br><br>
        <button onclick="closeAdmin()">إغلاق وحفظ</button>
    </div>

    <div class="ghost-btn" onclick="openAdmin()"></div>

    <div id="radarAlert"></div>

    <script>
        // 1. نظام الحماية للوحة التحكم
        function openAdmin() {
            const pass = prompt("أدخل رمز الدخول:");
            if(pass === "1234") { document.getElementById('adminPanel').style.display = 'block'; }
            else { alert("خطأ!"); }
        }
        function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }

        // 2. المحاكي (Simulation)
        function getSimulationContext() {
            const mode = document.getElementById('simMode').value;
            const contexts = {
                critical: "حلل الفكرة بصرامة وابحث عن الثغرات.",
                financial: "حلل الجدوى المالية والتكاليف.",
                security: "حلل المخاطر الأمنية."
            };
            return contexts[mode];
        }

        // 3. رادار الأفكار (LocalStorage Logic)
        function processInput() {
            const text = document.getElementById('userInput').value;
            const history = JSON.parse(localStorage.getItem('my_projects') || '[]');
            
            // تحقق من التشابه
            if(history.some(item => item.includes(text.substring(0,5)))) {
                const alert = document.getElementById('radarAlert');
                alert.innerText = "⚠️ تنبيه: هذه الفكرة مرتبطة بمشروع سابق!";
                alert.style.display = 'block';
                setTimeout(() => alert.style.display = 'none', 3000);
            }

            // حفظ
            history.push(text);
            localStorage.setItem('my_projects', JSON.stringify(history));
            
            console.log("تم التحليل بوضع: " + getSimulationContext());
        }

        // 4. التصدير (Matrix Export)
        function exportToJSON() {
            const data = localStorage.getItem('my_projects');
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'my_data.json'; a.click();
        }
    </script>
</body>
</html>
