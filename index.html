<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS - البيئة الإدراكية الشاملة</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #38bdf8;
            --accent-hover: #0ea5e9;
            --error-red: #ef4444;
            --success-green: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /*Sidebar Style*/
        .sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .logo-area {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 15px 0 10px 0;
            letter-spacing: 1px;
        }

        .tool-btn {
            background: none;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 12px 15px;
            text-align: right;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 5px;
            transition: all 0.2s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tool-btn:hover, .tool-btn.active {
            background-color: var(--border-color);
            color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        /*Main Workspace*/
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .tool-header {
            margin-bottom: 25px;
        }

        .tool-header h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: var(--text-main);
        }

        .tool-header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }

        /*Interactive Area*/
        .interface-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-main);
            font-size: 14px;
        }

        .input-field {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 14px;
        }

        /*Controls & Controls Select*/
        .controls-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 15px;
        }

        .model-select {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .action-btn {
            background-color: var(--accent-blue);
            color: var(--bg-dark);
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        .action-btn:disabled {
            background-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /*Terminal / Output Style*/
        .output-panel {
            background-color: #05070f;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            min-height: 120px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            padding: 0 5px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .dot.active { background-color: var(--success-green); }
        .dot.error { background-color: var(--error-red); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area">Tafkek OS</div>
        
        <div class="section-title">الأساس الفوري والربط</div>
        <button class="tool-btn active" onclick="switchTool('grounding')">🌐 التوثيق وبحث جوجل الفوري</button>
        <button class="tool-btn" onclick="switchTool('live-voice')">🎙️ المحادثثة الصوتية الحية (Live)</button>
        
        <div class="section-title">بيئات المعالجة والوسائط</div>
        <button class="tool-btn" onclick="switchTool('python-lab')">🐍 مختبر بايثون وتحليل البيانات</button>
        <button class="tool-btn" onclick="switchTool('deconstruct')">🧠 التفكيك المنطقي والنصوص</button>
        <button class="tool-btn" onclick="switchTool('code-assistant')">💻 المساعد البرمجي وهندسة الأكواد</button>
    </div>

    <div class="workspace">
        <div class="tool-header">
            <h1 id="tool-title">التوثيق والربط ببحث جوجل الفوري (Google Search Grounding)</h1>
            <p id="tool-desc">تلقي إجابات حية من الإنترنت مدعومة بروابط مصادر ومراجع حية وموثوقة.</p>
        </div>

        <div class="interface-card">
            <div class="input-group">
                <textarea id="user-input" class="input-field" rows="4" placeholder="أدخل المدخلات أو السؤال المراد معالجته تفكيكياً هنا..."></textarea>
            </div>

            <div class="input-group">
                <label class="checkbox-container">
                    <input type="checkbox" id="feature-toggle" checked>
                    <span id="toggle-label">تفعيل محرك التوثيق الفوري (Grounding Enable)</span>
                </label>
            </div>

            <div class="controls-row">
                <button id="submit-btn" class="action-btn" onclick="executeProcess()">تفعيل المعالجة الإدراكية</button>
                
                <select id="model-select" class="model-select">
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro (سياق عميق ومكثف)</option>
                    <option value="gemini-1.5-flash" selected>Gemini 1.5 Flash (سرعة استجابة فائقة)</option>
                </select>
            </div>
        </div>

        <div id="output-box" class="output-panel">في انتظار تفعيل المعالجة الإدراكية...</div>
        
        <div class="status-bar">
            <div class="status-indicator">
                <div id="status-dot" class="dot"></div>
                <span id="status-text">النواة الحية: متصلة</span>
            </div>
            <div id="meta-info">الإصدار الشامل v3.0.0</div>
        </div>
    </div>

    <script>
        // 1. الإعدادات الصحيحة والنهائية لكل الأدوات متطابقة مع مخرجات خوادم Vercel المحدثة (.js)
        const toolsConfig = {
            'grounding': {
                title: 'التوثيق والربط ببحث جوجل الفوري (Google Search Grounding)',
                desc: 'تلقي إجابات حية من الإنترنت مدعومة بروابط مصادر ومراجع حية وموثوقة.',
                label: 'تفعيل محرك التوثيق الفوري (Grounding Enable)',
                apiEndpoint: '/api/deconstruct.js'
            },
            'live-voice': {
                title: 'المحادثة الصوتية الحية (Live Voice Streaming)',
                desc: 'التفاعل الصوتي اللحظي متعدد الوسائط عبر بروتوكولات الاتصال منخفضة التأخير.',
                label: 'تشغيل ميكروفون النظام الصوتي',
                apiEndpoint: '/api/deconstruct.js'
            },
            'python-lab': {
                title: 'مختبر بايثون وتحليل البيانات (Python Sandbox)',
                desc: 'تشغيل بيئات برمجية معزولة لمعالجة البيانات الرياضية وتوليد الرسوم البيانية.',
                label: 'السماح بالمحاكاة الرسومية العميقة',
                apiEndpoint: '/api/deconstruct.js'
            },
            'deconstruct': {
                title: 'التفكيك المنطقي والنصوص (Semantic Deconstruction)',
                desc: 'تحليل البنى اللغوية، استخراج المفاهيم الأساسية، وإعادة هيكلة النصوص المعقدة.',
                label: 'استخدام التفكيك الكثيف عبر جروق',
                apiEndpoint: '/api/deconstruct.js'
            },
            'code-assistant': {
                title: 'المساعد البرمجي وهندسة الأكواد (Code Architecture)',
                desc: 'مراجعة الأخطاء البرمجية، هندسة الخوارزميات، وتوليد واجهات الأنظمة الذكية.',
                label: 'تفعيل الفحص الصارم للأخطاء والمنطق',
                apiEndpoint: '/api/deconstruct.js'
            }
        };

        let currentToolKey = 'grounding';

        // دالة التنقل بين الأدوات في القائمة الجانبية
        function switchTool(toolKey) {
            currentToolKey = toolKey;
            const config = toolsConfig[toolKey];
            
            document.getElementById('tool-title').innerText = config.title;
            document.getElementById('tool-desc').innerText = config.desc;
            document.getElementById('toggle-label').innerText = config.label;
            
            // تحديث تصميم الأزرار النشطة
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        // دالة المعالجة والاتصال بالسيرفر (تم حسمها وتثبيتها بالمتغير prompt)
        async function executeProcess() {
            const inputVal = document.getElementById('user-input').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const outputBox = document.getElementById('output-box');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            if (!inputVal) {
                alert('يرجى كتابة نص أو أمر قبل تفعيل المعالجة.');
                return;
            }

            // تهيئة واجهة العرض أثناء التحميل
            submitBtn.disabled = true;
            outputBox.innerText = 'جاري الاتصال بالنواة الإدراكية السحابية وتفكيك البيانات...';
            outputBox.style.color = 'var(--text-main)';
            statusDot.className = 'dot active';
            statusText.innerText = 'جاري المعالجة...';

            const activeTool = toolsConfig[currentToolKey];
            const selectedModel = document.getElementById('model-select').value;

            try {
                // إرسال الطلب بالصيغة الصارمة المتوقعة في الـ Backend
                const response = await fetch(activeTool.apiEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: inputVal,      // المتغير المطابق 100% للسيرفر
                        model: selectedModel   // النموذج المختار
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || `خطأ في استجابة الخادم الداخلي: ${response.status}`);
                }

                // عرض النتيجة بنجاح
                outputBox.innerText = data.result;
                statusDot.className = 'dot active';
                statusText.innerText = `تمت المعالجة بنجاح عبر [${data.source || 'السيرفر الآمن'}]`;

            } catch (error) {
                // التعامل الذكي مع أخطاء الشبكة والسيرفر لعرضها بوضوح في لوحة التحكم
                outputBox.innerText = `فشل الاتصال بـ الـ API الخارجي للمشروع.\nتأكد من تفعيل بيئة المطور المتغيرة (Environment Variables) ورابط السيرفر السحابي.\n\nالتفاصيل: ${error.message}`;
                outputBox.style.color = 'var(--error-red)';
                statusDot.className = 'dot error';
                statusText.innerText = 'فشل الاتصال الخارجي';
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
