<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS | System v8.0</title>
    <style>
        :root {
            --bg-color: #0f0f10;
            --surface: #1e1e20;
            --text-color: #f8f9fa;
            --accent: #5e81f4;
            --danger: #e06c75;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        #app-container { width: 100%; max-width: 800px; }
        h1 { text-align: center; color: var(--accent); }
        
        textarea { width: 100%; height: 250px; background: var(--surface); color: white; border: 2px solid #333; border-radius: 12px; padding: 15px; font-size: 16px; box-sizing: border-box; }
        textarea:focus { outline: none; border-color: var(--accent); }
        
        .controls { display: flex; gap: 10px; margin-top: 20px; }
        button { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        button:hover { opacity: 0.8; transform: scale(1.02); }

        /* اللوحة الإدارية */
        #adminPanel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #252526; padding: 30px; border-radius: 15px; border: 1px solid var(--accent); z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* تنبيهات الرادار */
        #radar { position: fixed; top: 20px; right: 20px; background: var(--danger); padding: 15px; border-radius: 8px; display: none; color: white; z-index: 999; }
        
        .hidden-zone { position: fixed; bottom: 0; left: 0; width: 50px; height: 50px; cursor: pointer; opacity: 0.05; }
    </style>
</head>
<body>

    <div id="app-container">
        <h1>Tafkek OS</h1>
        <textarea id="mainInput" placeholder="اكتب فكرتك هنا لتفكيكها..."></textarea>
        <div class="controls">
            <button class="btn-primary" onclick="System.process()">تحليل وتفكيك</button>
            <button class="btn-secondary" onclick="System.exportData()">تصدير JSON</button>
        </div>
    </div>

    <div id="radar"></div>

    <div id="adminPanel">
        <h3>🔧 مركز التحكم (Admin)</h3>
        <button onclick="System.closeAdmin()">إغلاق</button>
    </div>

    <div class="hidden-zone" onclick="System.auth()"></div>

    <script>
        const System = {
            storageKey: 'tafkek_mem_v8',

            process: function() {
                const input = document.getElementById('mainInput');
                const text = input.value.trim();
                if (!text) return alert("الرجاء كتابة شيء!");

                const history = JSON.parse(localStorage.getItem(this.storageKey) || '[]');
                
                // رادار الذكاء
                if (history.some(item => item.includes(text.substring(0, 10)))) {
                    this.showRadar("⚠️ تنبيه: هذه الفكرة مرتبطة بمشروع سابق!");
                }

                history.push(text);
                localStorage.setItem(this.storageKey, JSON.stringify(history));
                input.value = '';
                alert("تم التفكيك والحفظ بنجاح.");
            },

            showRadar: function(msg) {
                const radar = document.getElementById('radar');
                radar.innerText = msg;
                radar.style.display = 'block';
                setTimeout(() => radar.style.display = 'none', 3000);
            },

            auth: function() {
                const pin = prompt("أدخل رمز الدخول:");
                if(pin === "1234") document.getElementById('adminPanel').style.display = 'block';
                else alert("وصول مرفوض!");
            },

            closeAdmin: function() { document.getElementById('adminPanel').style.display = 'none'; },

            exportData: function() {
                const data = localStorage.getItem(this.storageKey);
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'}));
                a.download = 'data.json'; a.click();
            }
        };
    </script>
</body>
</html>
