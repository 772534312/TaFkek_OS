<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER AI OS | Next-Gen AI Platform Prototype</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <style>
        :root {
            --bg-dark: #05070a;
            --panel-bg: rgba(13, 19, 33, 0.85);
            --card-bg: #0d1117;
            --border-color: rgba(56, 189, 248, 0.2);
            --accent-cyan: #38bdf8;
            --accent-indigo: #818cf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-code: 'Fira Code', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header UI */
        header {
            background: var(--panel-bg); border-bottom: 1px solid var(--border-color);
            padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(12px); z-index: 10;
        }
        .brand { font-size: 1.2rem; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 10px; }
        .brand i { color: var(--accent-cyan); text-shadow: 0 0 10px var(--accent-cyan); }
        .badge-tag { background: rgba(99, 102, 241, 0.2); border: 1px solid var(--accent-indigo); color: #c7d2fe; font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; }

        .status-badge { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #4ade80; background: rgba(74, 222, 128, 0.1); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(74, 222, 128, 0.3); }

        /* Layout Architecture */
        .app-container { display: flex; flex: 1; overflow: hidden; }
        
        /* Collapsible Sidebar */
        .sidebar {
            width: 280px; background: var(--panel-bg); border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 15px; gap: 12px; backdrop-filter: blur(10px);
        }
        .section-title { font-size: 0.75rem; color: var(--accent-cyan); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .tools-scroll { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }

        .tool-btn {
            background: transparent; border: 1px solid transparent; color: var(--text-muted);
            padding: 10px 12px; border-radius: 8px; cursor: pointer; text-align: right;
            display: flex; align-items: center; gap: 10px; font-size: 0.85rem; transition: all 0.2s;
        }
        .tool-btn:hover, .tool-btn.active {
            background: rgba(56, 189, 248, 0.12); color: var(--accent-cyan);
            border-color: var(--border-color); box-shadow: 0 0 10px rgba(56, 189, 248, 0.1);
        }

        /* Split-Screen Canvas Workspace */
        .workspace-split { flex: 1; display: flex; overflow: hidden; }
        .chat-pane { flex: 1; display: flex; flex-direction: column; border-left: 1px solid var(--border-color); padding: 15px; gap: 12px; }
        .canvas-pane { flex: 1; background: rgba(5, 7, 10, 0.6); padding: 15px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }

        /* Omni Input Bar */
        .omni-box {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        textarea {
            width: 100%; background: transparent; border: none; color: #fff;
            font-size: 0.95rem; outline: none; resize: none; min-height: 80px;
        }
        .omni-actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .icon-btn {
            background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .icon-btn:hover { background: var(--accent-cyan); color: #000; font-weight: bold; }
        
        /* Main Execute Button */
        .btn-execute {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #05070a;
            font-weight: 800;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }
        .btn-execute:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }

        /* Display Output Box */
        .output-box {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 18px; flex: 1; overflow-y: auto; line-height: 1.7; font-size: 0.95rem;
        }
        .mermaid { background: #fff; padding: 12px; border-radius: 8px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fa-solid fa-atom"></i>
            <span>AETHER AI OS</span>
            <span class="badge-tag">v2.0 PROTOTYPE</span>
        </div>
        <div class="status-badge">
            <i class="fa-solid fa-circle" style="font-size:0.5rem;"></i>
            <span>النظام متصل وجاهز</span>
        </div>
    </header>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="section-title">محركات AETHER OS</div>
            <div class="tools-scroll" id="tools-list">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Split Screen Canvas -->
        <div class="workspace-split">
            <!-- Left Pane: Omni Input & Controls -->
            <div class="chat-pane">
                <h4 id="engine-title" style="color:var(--accent-cyan); display:flex; align-items:center; gap:8px;">
                    <i class="fa-solid fa-brain"></i> 1. سجل التفكير التفصيلي
                </h4>
                
                <div class="omni-box">
                    <textarea id="user-input" placeholder="اكتب أمرك هنا، واضغط على زر 'تنفيذ الطلب' أدناه..." onkeydown="handleKeyPress(event)"></textarea>
                    <input type="file" id="file-input" style="display:none;" onchange="handleFileUpload(event)">
                    
                    <div class="omni-actions">
                        <div style="display:flex; gap:6px;">
                            <button class="icon-btn" onclick="document.getElementById('file-input').click()"><i class="fa-solid fa-paperclip"></i> إرفاق ملف</button>
                            <button class="icon-btn" onclick="triggerVoice()"><i class="fa-solid fa-microphone"></i> تسجيل صوتي</button>
                        </div>
                        
                        <!-- زر التنفيذ الرئيسي -->
                        <button class="btn-execute" onclick="runActiveEngine()">
                            <i class="fa-solid fa-paper-plane"></i> تنفيذ الطلب 🚀
                        </button>
                    </div>
                </div>

                <div style="font-size:0.8rem; color:var(--text-muted); margin-top:10px; display:flex; justify-content:space-between;">
                    <span><i class="fa-solid fa-circle-info"></i> الشاشة مقسمة تلقائياً للمعاينة.</span>
                    <span id="router-indicator" style="color:var(--accent-cyan);">الموجه الذكي: نشط</span>
                </div>
            </div>

            <!-- Right Pane: Interactive Output & Live Preview -->
            <div class="canvas-pane">
                <div class="section-title"><i class="fa-solid fa-desktop"></i> لوحة المعاينة التفاعلية (Infinite Canvas)</div>
                <div class="output-box" id="output-content">
                    مرحباً بك! اختر أداتك المفضلة، اكتب أمرك ثم اضغط <b>تنفيذ الطلب 🚀</b>.
                </div>
                <div id="mermaid-container" class="mermaid" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        // المفتاح المدمج في الخفاء
        const SYSTEM_API_KEY = "AQ.Ab8RN6JC2Nega32Bhj3MMo8lpV9A7zTzn3UhbCIYIh8QT0PLVA";

        mermaid.initialize({ startOnLoad: false });

        // Core Engines Architecture
        const engines = [
            { id: 1, name: "سجل التفكير التفصيلي", prompt: "قدم تحليل تفكيري خطوة بخطوة للمشكلة التالية:" },
            { id: 2, name: "متحقق المصادر والحقائق", prompt: "تحقق من صحة المعلومات والحقائق التالية:" },
            { id: 3, name: "كاشف المغالطات المنطقية", prompt: "استخرج أي مغالطات منطقية أو تناقضات في النص:" },
            { id: 4, name: "المترجم البرمجي التكيفي", prompt: "اشرح أو حول هذا الكود ليناسب المستوى المطلوب:" },
            { id: 5, name: "طاولة الذكاء المتعدد", prompt: "ناقش هذا الموضوع من وجهات نظر خبراء متعددين:" },
            { id: 6, name: "Live Sandbox المعاينة الحية", local: true, action: runSandbox },
            { id: 7, name: "صانع مخططات Mermaid", local: true, action: generateMermaid },
            { id: 8, name: "مولد وسوم المنتجات", local: true, action: generateTags },
            { id: 9, name: "حاسبة التوكينز", local: true, action: calculateTokens },
            { id: 10, name: "فاحص الثغرات الأمنية", local: true, action: scanSecurity },
            { id: 11, name: "الناطق الصوتي للنصوص", local: true, action: speakText }
        ];

        let activeEngineId = 1;

        // Render Sidebar
        const container = document.getElementById('tools-list');
        engines.forEach(e => {
            const btn = document.createElement('button');
            btn.className = `tool-btn ${e.id === 1 ? 'active' : ''}`;
            btn.innerHTML = `<i class="fa-solid fa-cube"></i> ${e.id}. ${e.name}`;
            btn.onclick = () => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeEngineId = e.id;
                document.getElementById('engine-title').innerHTML = `<i class="fa-solid fa-brain"></i> ${e.id}. ${e.name}`;
            };
            container.appendChild(btn);
        });

        // Handle Ctrl+Enter Shortcut
        function handleKeyPress(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                runActiveEngine();
            }
        }

        // Core Executor
        async function runActiveEngine() {
            const engine = engines.find(e => e.id === activeEngineId);
            const input = document.getElementById('user-input').value;
            const output = document.getElementById('output-content');
            document.getElementById('mermaid-container').style.display = 'none';

            if (!input.trim() && !engine.local) {
                return alert('يرجى كتابة نص أو أمر في صندوق الكتابة أولاً!');
            }

            if (engine.local) {
                engine.action(input);
            } else {
                output.innerText = "جاري التفكير والتنفيذ عبر المحرك الذكي...";
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${SYSTEM_API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `${engine.prompt}\n\n${input}` }] }] })
                    });
                    const data = await res.json();
                    
                    if (data.error) {
                        output.innerText = "خطأ في المعالجة: " + data.error.message;
                        return;
                    }

                    const reply = data.candidates[0].content.parts[0].text;
                    output.innerHTML = marked.parse(reply);
                    Prism.highlightAllUnder(output);
                } catch(err) {
                    output.innerText = "تعذر الاتصال بالسيرفر. يرجى التحقق من اتصال الإنترنت والتجربة مجدداً.";
                }
            }
        }

        // Local Functions
        function generateMermaid(input) {
            const mDiv = document.getElementById('mermaid-container');
            mDiv.style.display = 'block';
            mDiv.removeAttribute('data-processed');
            mDiv.innerHTML = input || "graph TD;\n  A[بداية] --> B(معالجة البيانات);\n  B --> C{نجاح؟};\n  C -->|نعم| D[عرض النتيجة];\n  C -->|لا| E[إعادة المحاولة];";
            mermaid.contentLoaded();
        }

        function generateTags(input) {
            const words = input.toLowerCase().match(/\b[a-z0-9]{3,}\b/g) || ["aether", "ai", "future"];
            const tags = Array.from(new Set(words)).map(w => `#${w}`).join(', ');
            document.getElementById('output-content').innerHTML = `<h3>وسوم المنتجات المقترحة:</h3><p>${tags}</p>`;
        }

        function calculateTokens(input) {
            const count = input.trim().split(/\s+/).filter(Boolean).length;
            document.getElementById('output-content').innerHTML = `<h3>تحليل التوكينز:</h3><p>الكلمات: <b>${count}</b> | التوكينز التقديرية: <b>${Math.ceil(count * 1.3)}</b></p>`;
        }

        function scanSecurity(input) {
            const xss = /<script\b[^>]*>([\s\S]*?)<\/script>/gi.test(input);
            document.getElementById('output-content').innerHTML = `<h3>فحص الأمان:</h3><p>XSS Injection Risk: <b style="color:${xss?'red':'green'}">${xss?'⚠️ مكتشف':'✅ آمن'}</b></p>`;
        }

        function speakText(input) {
            const utter = new SpeechSynthesisUtterance(input || "مرحباً بك في AETHER AI OS");
            utter.lang = 'ar-SA';
            window.speechSynthesis.speak(utter);
            document.getElementById('output-content').innerText = "جاري القراءة الصوتية...";
        }

        function runSandbox(input) { 
            document.getElementById('output-content').innerHTML = `<iframe style="width:100%; height:350px; border:1px solid #38bdf8; border-radius:8px; background:#fff;" srcdoc="${input}"></iframe>`; 
        }

        function triggerVoice() {
            if ('webkitSpeechRecognition' in window) {
                const rec = new webkitSpeechRecognition();
                rec.lang = 'ar-SA';
                rec.onresult = (e) => { document.getElementById('user-input').value = e.results[0][0].transcript; };
                rec.start();
            } else {
                alert('المتصفح لا يدعم التسجيل الصوتي المباشر.');
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('user-input').value += `\n[تم إرفاق الملف: ${file.name}]`;
            }
        }
    </script>
</body>
</html>
