<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAFKEEK | Strategic Analysis OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind Configuration for the Refined Tech Cyan Theme
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                brand: {
                  bg: '#0f172a', // Deep Slate 900
                  panel: '#1e293b', // Slate 800
                  accent: '#06b6d4', // Cyber Cyan 500
                  accent_dim: '#164e63', // Cyan 900 for borders
                  success: '#10b981', // Emerald 500
                  text: '#f1f5f9', // Slate 100
                  label: '#94a3b8', // Slate 400
                }
              }
            }
          }
        }
    </script>
    <style>
        body { 
            background-color: theme('colors.brand.bg'); 
            color: theme('colors.brand.text'); 
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
        }
        /* Advanced Cyber Cyan Glow effect */
        .glow-bg { 
            background: radial-gradient(circle at 10% 10%, rgba(6, 182, 212, 0.1), transparent 50%); 
        }
        /* Polished Glassmorphic Panels */
        .glass { 
            background: rgba(30, 41, 59, 0.5); 
            backdrop-filter: blur(16px); 
            border: 1px solid theme('colors.brand.accent_dim'); 
        }
    </style>
</head>
<body class="glow-bg min-h-screen flex flex-col md:flex-row overflow-x-hidden">

    <aside class="w-full md:w-64 glass p-6 flex flex-col justify-between border-r border-brand-accent_dim shadow-xl">
        <div>
            <h1 class="text-3xl font-extrabold text-white mb-1 tracking-wider">TAFKEEK</h1>
            <p class="text-xs font-bold text-brand-accent mb-8 tracking-widest uppercase">Strategic Analysis OS</p>
            <nav class="space-y-3">
                <button class="w-full text-left font-bold py-2.5 px-4 rounded-lg bg-brand-accent text-brand-bg shadow-md shadow-cyan-500/20">⚡ Idea Processor</button>
                <button class="w-full text-left font-bold py-2.5 px-4 rounded-lg text-slate-200 hover:bg-slate-700/40 transition" onclick="alert('Analysis Library repository will be activated after completing the automatic Vercel deployment.')">📂 Analysis Library</button>
            </nav>
        </div>
        <div class="text-xs font-bold text-brand-label border-t border-slate-700 pt-4 tracking-widest">[NATIVE_API_MODE]</div>
    </aside>

    <main class="flex-1 p-6 md:p-10 flex flex-col lg:flex-row gap-8">
        <div class="flex-1 max-w-xl flex flex-col gap-6">
            <div class="glass p-6 rounded-xl space-y-4">
                <h2 class="text-base font-bold uppercase tracking-wider text-brand-accent">🚀 Microprocessing Unit</h2>
                <div class="flex gap-6 text-sm font-bold text-slate-200">
                    <div>SYS_STATUS: <span class="text-brand-success font-bold">ONLINE</span></div>
                    <div>COMPLEXITY: <span class="text-brand-accent font-bold">34.0%</span></div>
                </div>
                <canvas id="quantumCanvas" class="w-full h-48 bg-black/70 rounded-lg border border-brand-accent_dim"></canvas>
            </div>

            <div class="glass p-6 rounded-xl">
                <label class="block text-base font-bold mb-3 text-slate-100">Formulate the core idea to initiate analysis:</label>
                <div class="flex gap-3">
                    <input id="ideaInput" type="text" placeholder="Enter your grand idea here..." class="flex-1 bg-black/60 border-2 border-brand-accent_dim rounded-lg px-4 py-2.5 text-white font-semibold focus:outline-none focus:border-brand-accent placeholder-slate-500">
                    <button id="submitBtn" onclick="processIdea()" class="bg-brand-accent hover:bg-cyan-600 text-brand-bg font-bold px-7 py-2.5 rounded-lg transition shadow-lg shadow-cyan-500/20 text-base">Analyze</button>
                </div>
            </div>
        </div>

        <div class="flex-1 glass p-6 rounded-xl flex flex-col">
            <h2 class="text-xl font-bold text-white mb-4 border-b border-slate-700 pb-2">📊 Execution Roadmap</h2>
            <div id="loading" class="hidden text-center py-12 text-brand-accent font-bold animate-pulse text-base">Running AI Engine & generating roadmap...</div>
            <div id="treeContainer" class="space-y-4 flex-1 overflow-y-auto max-h-[450px]">
                <p class="text-brand-label text-base font-semibold text-center py-12">No analysis generated yet. Initiate the process from the input panel.</p>
            </div>
        </div>
    </main>

    <script>
        // Cyan Particle Engine Initialization
        const canvas = document.getElementById('quantumCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resize() { 
            canvas.width = canvas.offsetWidth; 
            canvas.height = canvas.offsetHeight; 
        }
        resize();
        window.addEventListener('resize', resize);

        class Particle {
            constructor() {
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 0.008 + 0.003;
                this.distance = Math.random() * 70 + 15;
            }
            update() { 
                this.angle += this.speed; 
            }
            draw() {
                const x = canvas.width / 2 + Math.cos(this.angle) * this.distance;
                const y = canvas.height / 2 + Math.sin(this.angle) * this.distance;
                ctx.beginPath(); 
                ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(6, 182, 212, 0.8)'; 
                ctx.fill();
            }
        }

        for(let i=0; i<35; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.1)';
            ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 40, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 80, 0, Math.PI*2); ctx.stroke();
            
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // Core API Call & Dynamic Tree Generation
        async function processIdea() {
            const input = document.getElementById('ideaInput');
            const btn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const container = document.getElementById('treeContainer');
            
            if(!input.value.trim()) return alert('Please enter an idea first to analyze.');
            
            loading.classList.remove('hidden'); 
            container.innerHTML = ''; 
            btn.disabled = true;
            btn.style.opacity = '0.5';

            try {
                const response = await fetch('/api/deconstruct', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idea: input.value })
                });
                const data = await response.json();
                
                loading.classList.add('hidden'); 
                btn.disabled = false;
                btn.style.opacity = '1';

                if(data.error) throw new Error(data.error);
                
                if(Array.isArray(data)) {
                    if(data.length === 0) {
                        container.innerHTML = `<p class="text-brand-label text-base text-center py-12">The model returned an empty structure. Try rephrasing your idea.</p>`;
                        return;
                    }
                    data.forEach(node => {
                        const el = document.createElement('div');
                        el.className = 'p-4 rounded-lg bg-black/60 border-2 border-slate-700 hover:border-cyan-500/50 transition cursor-pointer';
                        el.innerHTML = `
                            <h3 class="text-white font-bold text-lg mb-1 flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full bg-brand-accent shadow-lg shadow-cyan-500"></span> 
                                ${node.title}
                            </h3>
                            <p class="text-slate-200 text-base font-semibold leading-relaxed pl-5">${node.description}</p>
                        `;
                        // Action: Check off item upon click
                        el.onclick = () => {
                            el.classList.toggle('opacity-40');
                            el.querySelector('span').classList.toggle('bg-brand-success');
                            el.querySelector('span').classList.toggle('bg-brand-accent');
                        };
                        container.appendChild(el);
                    });
                }
            } catch (err) {
                loading.classList.add('hidden'); 
                btn.disabled = false;
                btn.style.opacity = '1';
                container.innerHTML = `<div class="p-4 rounded-lg bg-red-950/40 border-2 border-red-900 text-red-200 font-bold text-base text-center">AI Engine Connection Failed: <br> ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
