<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS - المتكامل</title>
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1e20;
            --bg-hover: #282a2c;
            --bg-input: #1e1e20;
            --text-main: #e3e3e3;
            --text-sub: #c4c7c5;
            --border: #444746;
            --gemini-gradient: linear-gradient(74deg, #4285f4 0%, #9b51e0 50%, #e91e63 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ------------------ الشريط الجانبي (Sidebar) ------------------ */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 12px;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar.collapsed .hide-text {
            display: none;
        }

        .new-chat-btn {
            background-color: #1a1a1c;
            border: none;
            color: var(--text-sub);
            padding: 14px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s;
            width: 100%;
        }

        .new-chat-btn:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        .sidebar-menu {
            list-style: none;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 50px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background-color: var(--bg-hover);
        }

        /* ------------------ مساحة العمل الرئيسية ------------------ */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        /* الشريط العلوي المضاف إليه ميزة تسجيل الدخول */
        .top-bar {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .toggle-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
        }

        .toggle-sidebar-btn:hover {
            background-color: var(--bg-hover);
        }

        .brand-name {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-sub);
        }

        /* زر تسجيل الدخول الاحترافي في أعلى اليسار */
        .login-btn {
            background: var(--gemini-gradient);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .user-profile {
            display: none; /* يظهر بعد تسجيل الدخول */
            align-items: center;
            gap: 10px;
        }

        /* حاوية المحادثات */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 60px;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        /* واجهة الترحيب الافتراضية */
        .welcome-view {
            margin-top: 6vh;
        }

        .greeting {
            font-size: 3.2rem;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .gradient-text {
            background: var(--gemini-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-greeting {
            font-size: 3.2rem;
            color: #444746;
            font-weight: 500;
            margin-bottom: 40px;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .suggestion-card {
            background-color: var(--bg-sidebar);
            padding: 20px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .suggestion-card:hover {
            background-color: var(--bg-hover);
        }

        /* مجرى المحادثة الفعلي للرسائل الديناميكية */
        .conversation-flow {
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding-bottom: 40px;
        }

        .chat-row {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .avatar.user-avatar { background-color: #565869; color: white; }
        .avatar.ai-avatar { background: var(--gemini-gradient); color: white; }

        .message-content {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-main);
            white-space: pre-wrap;
            flex: 1;
        }

        /* خط التحميل الحقيقي اللامع */
        .shimmer-line {
            display: none;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #4285f4, #9b51e0, #e91e63, #4285f4);
            background-size: 300% 100%;
            animation: shimmerAnimation 1.5s infinite linear;
            border-radius: 2px;
            margin-top: 15px;
        }

        @keyframes shimmerAnimation {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* ------------------ معاينة الصور المرفقة قبل الإرسال ------------------ */
        .attachment-preview-area {
            display: none;
            gap: 10px;
            padding: 10px 20px;
            background-color: #1e1e20;
            border-radius: 12px;
            margin-bottom: 10px;
            align-items: center;
            max-width: 200px;
            position: relative;
        }

        .attachment-preview-area img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
        }

        .remove-attachment {
            position: absolute;
            top: -5px;
            left: -5px;
            background: #ff4a4a;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        /* ------------------ صندوق الإدخال السفلي الذكي ------------------ */
        .input-area-wrapper {
            padding: 10px 60px 25px 60px;
            background: linear-gradient(transparent, var(--bg-main) 40%);
        }

        .input-box-container {
            max-width: 850px;
            margin: 0 auto;
            background-color: var(--bg-input);
            border-radius: 32px;
            padding: 8px 22px;
            display: flex;
            flex-direction: column;
            border: 1px solid transparent;
        }

        .input-box-container:focus-within {
            border-color: #4285f4;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .input-box-container textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.05rem;
            outline: none;
            resize: none;
            padding: 10px 0;
            max-height: 150px;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.25rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .action-icon-btn:hover {
            background-color: var(--bg-hover);
        }

        .hidden-file-input { display: none; }
        .disclaimer { text-align: center; font-size: 0.75rem; color: #727575; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- شريط جانبي مدمج -->
    <aside class="sidebar" id="sidebar">
        <div>
            <button class="new-chat-btn" onclick="resetToHome()">
                <span>＋</span>
                <span class="hide-text">محادثة جديدة</span>
            </button>
            <ul class="sidebar-menu" id="historyList">
                <!-- أرشفة المحادثات السابقة تولد برمجياً هنا -->
            </ul>
        </div>
        <div>
            <ul class="sidebar-menu">
                <li class="menu-item" onclick="alert('الإعدادات قيد التطوير')">
                    <span>⚙️</span>
                    <span class="hide-text">الإعدادات</span>
                </li>
            </ul>
        </div>
    </aside>

    <main class="main-chat">
        <!-- الشريط العلوي مع ميزة تسجيل الدخول والربط البرمجي -->
        <div class="top-bar">
            <div class="top-bar-right">
                <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>
                <div class="brand-name">Tafkek OS</div>
            </div>
            
            <!-- قسم التوثيق والحساب -->
            <div id="authSection">
                <button class="login-btn" onclick="handleLogin()">تسجيل الدخول</button>
                <div class="user-profile" id="userProfile">
                    <span id="userName" style="font-size: 0.9rem; color: var(--text-sub);"></span>
                    <div class="avatar user-avatar" style="background-color: #4285f4;">ع</div>
                </div>
            </div>
        </div>

        <div class="chat-container">
            <!-- واجهة الترحيب -->
            <div class="welcome-view" id="welcomeView">
                <h1 class="greeting"><span class="gradient-text">مرحباً بك،</span></h1>
                <h2 class="sub-greeting">كيف يمكنني مساعدتك اليوم؟</h2>
                
                <div class="suggestions-grid">
                    <div class="suggestion-card" onclick="selectSuggestion('قم بإنشاء متجر لبيع الهواتف')">
                        <span>قم بإنشاء متجر لبيع الهواتف الذكية مع هيكلية البيانات</span>
                        <div class="card-icon">🧠</div>
                    </div>
                    <div class="suggestion-card" onclick="selectSuggestion('توليد صورة احترافية لكوكب المريخ مستقبلي وعالي الدقة')">
                        <span>ميزة توليد صور ذكية فائقة الدقة</span>
                        <div class="card-icon">🎨</div>
                    </div>
                </div>
            </div>

            <!-- مجرى تدفق الرسائل الفعلي -->
            <div class="conversation-flow" id="conversationFlow"></div>
            <div class="shimmer-line" id="shimmerLine"></div>
        </div>

        <!-- منطقة الإدخال الموحدة والمطورة لدعم الصور والملفات -->
        <div class="input-area-wrapper">
            <div class="input-box-container">
                
                <!-- منطقة معاينة الصورة المرفقة قبل رفعها أو إرسالها للـ API -->
                <div class="attachment-preview-area" id="previewArea">
                    <button class="remove-attachment" onclick="clearAttachment()">×</button>
                    <img id="previewImg" src="" alt="Preview">
                    <span style="font-size: 0.8rem; color: var(--text-sub)">صورة جاهزة للتحليل</span>
                </div>

                <div class="input-row">
                    <input type="file" id="fileUpload" class="hidden-file-input" accept="image/*" onchange="handleFileSelected(this)">
                    <button class="action-icon-btn" onclick="document.getElementById('fileUpload').click()" title="إرفاق صورة لتحليلها">📎</button>
                    
                    <textarea id="chatInput" rows="1" placeholder="اسأل Tafkek OS عن أي شيء أو اطلب توليد صورة..." oninput="autoGrow(this)" onkeydown="handleKeyDown(event)"></textarea>
                    
                    <div class="input-actions">
                        <!-- ميزة توليد الصور المباشرة (Text-to-Image) -->
                        <button class="action-icon-btn" onclick="triggerImageGeneration()" title="توليد صورة برمجياً">🖼️</button>
                        <button class="action-icon-btn" style="color: #8ab4f8;" onclick="sendMessage()" title="إرسال">✦</button>
                    </div>
                </div>
            </div>
            <div class="disclaimer">منصة تفكيك مدمجة مع الأنظمة السحابية. يرجى التحقق من المخرجات الهامة.</div>
        </div>
    </main>

    <script>
        let attachedFileBase64 = null;
        let isLoggedIn = false;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function autoGrow(element) {
            element.style.height = "5px";
            element.style.height = (element.scrollHeight) + "px";
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function selectSuggestion(text) {
            document.getElementById('chatInput').value = text;
            sendMessage();
        }

        // --- ميزة تسجيل الدخول الفعلي (تستبدل بـ Firebase / Supabase الخاص بك) ---
        function handleLogin() {
            // محاكاة سريعة لتسجيل الدخول، ضع هنا كود التوثيق الخاص بك
            isLoggedIn = true;
            document.querySelector('.login-btn').style.display = 'none';
            document.getElementById('userProfile').style.display = 'flex';
            document.getElementById('userName').innerText = 'عبدالله بن وهلان';
            alert('تم تسجيل الدخول بنجاح إلى معمل تفكيك العصبوني!');
        }

        // --- ميزة إرفاق الصور ومعاينتها ---
        function handleFileSelected(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    attachedFileBase64 = e.target.result;
                    document.getElementById('previewImg').src = attachedFileBase64;
                    document.getElementById('previewArea').style.display = 'flex';
                }
                reader.readAsDataURL(file);
            }
        }

        function clearAttachment() {
            attachedFileBase64 = null;
            document.getElementById('fileUpload').value = '';
            document.getElementById('previewArea').style.display = 'none';
        }

        // --- ميزة توليد الصور (Text-to-Image) عبر استدعاء الـ API الفعلي ---
        async function triggerImageGeneration() {
            const prompt = document.getElementById('chatInput').value.trim();
            if (!prompt) {
                alert("يرجى كتابة وصف الصورة في صندوق النص أولاً (مثال: كوكب المريخ في المستقبل).");
                return;
            }

            appendUserMessage(prompt);
            document.getElementById('chatInput').value = '';
            document.getElementById('shimmerLine').style.display = 'block';

            try {
                // ⚠️ استبدل هذا الرابط بمسار الدالة السحابية الخاصة بك لتوليد الصور (Vercel serverless function / DALL-E / Flux API)
                // const response = await fetch('/api/generate-image', { method: 'POST', body: JSON.stringify({ prompt }) });
                // const data = await response.json();
                
                // محاكاة مؤقتة للاستجابة السحابية الحقيقية:
                setTimeout(() => {
                    document.getElementById('shimmerLine').style.display = 'none';
                    appendAIMessage(`✦ **تم توليد الصورة المطلوبة بناءً على وصفك:**`, "https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?auto=format&fit=crop&w=600&q=80");
                }, 3000);

            } catch (error) {
                console.error(error);
                document.getElementById('shimmerLine').style.display = 'none';
                appendAIMessage("❌ عذراً، فشل استدعاء خادم توليد الصور المحمل على Vercel.");
            }
        }

        // --- محرك توليد النصوص واستدعاء الـ API الحقيقي (Gemini / Groq) ---
        async function sendMessage() {
            const inputEl = document.getElementById('chatInput');
            const query = inputEl.value.trim();
            if (!query && !attachedFileBase64) return;

            appendUserMessage(query);
            
            // تصفير الإدخال
            inputEl.value = '';
            inputEl.style.height = 'auto';

            // إظهار شريط التحميل المتلألئ
            document.getElementById('shimmerLine').style.display = 'block';
            const container = document.querySelector('.chat-container');
            container.scrollTop = container.scrollHeight;

            // الاحتفاظ ببيانات الصورة لإرسالها
            const currentImg = attachedFileBase64;
            clearAttachment(); 

            try {
                /* 
                ⚠️ هنا تقوم بربط الـ Endpoint الحقيقي الخاص بك والذي يحتوي على مفاتيح الـ API السرية والمستضافة على Vercel:
                
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query, image: currentImg })
                });
                const data = await response.json();
                const replyText = data.choices[0].message.content;
                */

                // محاكاة استجابة الخادم الحقيقية الديناميكية لربطها بملفاتك السحابية:
                setTimeout(() => {
                    document.getElementById('shimmerLine').style.display = 'none';
                    
                    let replyText = `✦ **نتيجة معالجة خادم التفكيك (Tafkek OS Engine):**\n\n`;
                    if (currentImg) {
                        replyText += `📸 [نظام الرؤية الحاسوبية]: تم فحص وتفكيك عناصر الصورة المرفقة بنجاح واستخلاص الأنماط البرمجية منها.\n\n`;
                    }
                    replyText += `لقد استقبلنا عبارة الحث الخاصة بك: "${query}". نظام توليد النصوص متصل الآن بالكامل ببيئتك الإنتاجية.`;
                    
                    appendAIMessage(replyText);
                }, 1500);

            } catch (error) {
                document.getElementById('shimmerLine').style.display = 'none';
                appendAIMessage("❌ حدث خطأ أثناء الاتصال بـ API الخاص بالنظام المطور.");
            }
        }

        function appendUserMessage(text) {
            document.getElementById('welcomeView').style.display = 'none';
            const flow = document.getElementById('conversationFlow');
            flow.innerHTML += `
                <div class="chat-row user-row">
                    <div class="avatar user-avatar">ع</div>
                    <div class="message-content">${text}</div>
                </div>
            `;
        }

        function appendAIMessage(text, imageUrl = null) {
            const flow = document.getElementById('conversationFlow');
            let content = `<div class="message-content">${text}`;
            if (imageUrl) {
                content += `<br><br><img src="${imageUrl}" style="max-width:100%; border-radius:12px; margin-top:10px; border:1px solid #444746;">`;
            }
            content += `</div>`;

            flow.innerHTML += `
                <div class="chat-row ai-row">
                    <div class="avatar ai-avatar">✦</div>
                    ${content}
                </div>
            `;
            const container = document.querySelector('.chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function resetToHome() {
            document.getElementById('conversationFlow').innerHTML = '';
            document.getElementById('welcomeView').style.display = 'block';
            clearAttachment();
        }
    </script>
</body>
</html>
