<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS | Cloud Edition</title>
    <script type="module">
        // استيراد Firebase (النسخة 9+)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

        // --- ⚠️ قم بوضع بيانات Firebase الخاصة بك هنا ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- دوال قاعدة البيانات ---
        window.saveToCloud = async (data) => {
            await addDoc(collection(db, "projects"), { title: data.title, content: data.content, date: new Date() });
            alert("تم الحفظ في السحابة!");
        };

        window.loadFromCloud = async () => {
            const querySnapshot = await getDocs(collection(db, "projects"));
            querySnapshot.forEach((doc) => { console.log(doc.data()); });
        };
    </script>
    <style>
        :root { --bg: #131314; --text: #e3e3e3; --accent: #8ab4f8; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        .admin-panel { display: none; position: fixed; top: 20px; right: 20px; background: #202124; padding: 20px; border: 1px solid #444; }
        .hidden-trigger { position: fixed; bottom: 0; left: 0; width: 20px; height: 20px; cursor: pointer; opacity: 0.1; }
    </style>
</head>
<body>

    <h1>Tafkek OS v7.0</h1>
    <div id="workspace">
        <input type="text" id="projectTitle" placeholder="اسم المشروع">
        <button onclick="saveProject()">حفظ في السحابة</button>
    </div>

    <div id="adminPanel" class="admin-panel">
        <h3>لوحة التحكم</h3>
        <button onclick="closeAdmin()">إغلاق</button>
    </div>

    <div class="hidden-trigger" onclick="checkAuth()"></div>

    <script>
        function checkAuth() {
            const pass = prompt("أدخل رمز الدخول:");
            if(pass === "1234") { document.getElementById('adminPanel').style.display = 'block'; }
        }

        function saveProject() {
            const title = document.getElementById('projectTitle').value;
            window.saveToCloud({ title: title, content: "بيانات المشروع" });
        }

        function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }
    </script>
</body>
</html>
