<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafkek OS - البيئة الإدراكية الشاملة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #070a13;
            --panel-bg: #0f1626;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-hover: #0ea5e9;
            --error-red: #f43f5e;
            --success-green: #10b981;
            --code-bg: #030712;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Cairo', Tahoma, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .logo-area {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin: 20px 0 10px 0;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .tool-btn {
            background: none;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 12px 15px;
            text-align: right;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: all 0.25s ease;
            font-size: 13.5px;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .tool-btn:hover, .tool-btn.active {
            background-color: #1e293b;
            color: var(--accent-blue);
            border-color: rgba(56, 189, 248, 0.2);
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 35px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .tool-header { margin-bottom: 30px; }
        .tool-header h1 { margin: 0 0 8px 0; font-size: 26px; font-weight: 700; color: var(--text-main); }
        .tool-header p { margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.6; }

        .interface-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .input-field {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            color: var(--text-main);
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            resize: vertical;
        }

        .input-field:focus { outline: none; border-color: var(--accent-blue); }

        .controls-row { display: flex; gap: 15px; align-items: center; margin-top: 15px; }

        .action-btn {
            background-color: var(--accent-blue);
            color: #030712;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.2s ease;
        }

        .action-btn:hover { background-color: var(--accent-hover); }
        .action-btn:disabled { background-color: var(--border-color); color: var(--text-muted); cursor: not-allowed; }

        .output-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            min-height: 150px;
            line-height: 1.8;
            overflow-x: auto;
        }

        .fade-in-content { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .output-panel h1, .output-panel h2, .output-panel h3 { color: var(--text-main); font-weight: 600; margin-top: 25px; margin-bottom: 12px; }
        .output-panel h2 { color: var(--accent-blue); }
        .output-panel p { margin-bottom: 16px; font-size: 15.5px; color: #e2e8f0; }
        
        .output-panel table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 25px 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .output-panel th { background-color: #1e293b; color: var(--accent-blue); padding: 14px; text-align: right; }
        .output-panel td { padding: 14px; border-bottom: 1px solid var(--border-color); background-color: #0b1324; color: #e2e8f0; }
        .output-panel tr:nth-child(even) td { background-color: #0f192e; }

        .output-panel code { background-color: #1e293b; padding: 3px 6px; border-radius: 4px; font-family: monospace; color: #f43f5e; }
        .output-panel pre { background-color: var(--code-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); overflow-x: auto; margin: 20px 0; }
        .output-panel pre code { color: #34d399; font-family: monospace; }

        .output-panel blockquote { margin: 20px 0; padding: 15px 20px; background-color: rgba(56, 189, 248, 0.06); border-right: 4px solid var(--accent-blue); color: #cbd5e1; }

        .status-bar { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 15px; }
        .status-indicator { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--text-muted); }
        .dot.active { background-color: var(--success-green); }
        .dot.error { background-color: var(--error-red); }
        
        #output-image { max-width: 100%; border-radius: 12px; margin-top: 20px; display: none; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area">Tafkek OS</div>
        
        <div class="section-title">الأدوات الأساسية الحية</div>
        <button class="tool-btn active" onclick="switchTool('grounding', this)">🌐 بحث جوجل والتوثيق الفوري</button>
        <button class="tool-btn" onclick="switchTool('deconstruct', this)">🧠 التفكيك المعرفي واللغوي</button>
        
        <div class="section-title">المحركات الفريدة والحصرية</div>
        <button class="tool-btn" onclick="switchTool('ecom-deconstruct', this)">📊 تفكيك العمليات واللوجستيات الرقمية</button>
        <button class="tool-btn" onclick="switchTool('loop-destroyer', this)">⚡ تتبع وحرق الأخطاء البرمجية اللانهائية</button>
        <button class="tool-btn" onclick="switchTool('clean-image', this)">🎨 استوديو التصاميم النظيفة (بدون نصوص)</button>
        <button class="tool-btn" onclick="switchTool('support-agent', this)">🛠️ المساعد الذكي لقنوات وتذاكر الدعم</button>
    </div>

    <div class="workspace">
        <div class="tool-header">
            <h1 id="tool-title">التوثيق والربط ببحث جوجل الفوري</h1>
            <p id="tool-desc">تلقي إجابات حية من الإنترنت مدعومة بروابط مصادر ومراجع حية وموثوقة.</p>
        </div>

        <div class="interface-card">
            <textarea id="user-input" class="input-field" rows="5" placeholder="أدخل السجلات، الأكواد، أو الأوامر هنا..."></textarea>
            <div class="controls-row">
                <button id="submit-btn" class="action-btn" onclick="executeProcess()">تشغيل النظام المعرفي</button>
            </div>
        </div>

        <div id="output-box" class="output-panel">في انتظار البيانات...</div>
        <img id="output-image" alt="المخرجات البصرية" />
        
        <div class="status-bar">
            <div class="status-indicator"><div id="status-dot" class="dot"></div><span id="status-text">النواة: جاهزة</span></div>
            <div>Tafkek Cognitive OS v4.0.0</div>
        </div>
    </div>

    <script>
        const toolsConfig = {
            'grounding': { title: 'بحث جوجل والتوثيق الفوري', desc: 'إجابات حية مدعومة برابط مصادر حقيقية من الإنترنت.', apiEndpoint: '/api/deconstruct.js', isImage: false },
            'deconstruct': { title: 'التفكيك المعرفي واللغوي', desc: 'تحليل البنى النصية واستخراج الأفكار عبر جروق.', apiEndpoint: '/api/deconstruct-groq.js', isImage: false },
            'ecom-deconstruct': { title: 'تفكيك العمليات واللوجستيات الرقمية', desc: 'محاكاة حركة المخزون، الشحنات، والمبيعات، واستباق المخاطر اللوجستية.', apiEndpoint: '/api/ecom-deconstruct.js', isImage: false },
            'loop-destroyer': { title: 'تتبع وحرق الأخطاء البرمجية اللانهائية', desc: 'محاكاة ذهنية سلوكية دقيقة للكشف عن الحلقات المفتوحة وثغرات تجمد الأنظمة قبل التشغيل.', apiEndpoint: '/api/loop-destroyer.js', isImage: false },
            'clean-image': { title: 'استوديو التصاميم النظيفة (بدون نصوص)', desc: 'توليد أصول بصرية مذهلة ومفرغة بالكامل من الحروف لتسمح بالتعديل والكتابة العربية اليدوية.', apiEndpoint: '/api/generate-image.js', isImage: true },
            'support-agent': { title: 'المساعد الذكي لقنوات وتذاكر الدعم', desc: 'تحليل الحالة النفسية للعملاء، تفكيك التذاكر، وصياغة الردود المثالية الجاهزة.', apiEndpoint: '/api/support-agent.js', isImage: false }
        };

        let currentToolKey = 'grounding';

        function switchTool(toolKey, element) {
            currentToolKey = toolKey;
            const config = toolsConfig[toolKey];
            document.getElementById('tool-title').innerText = config.title;
            document.getElementById('tool-desc').innerText = config.desc;
            document.getElementById('output-image').style.display = 'none';
            document.getElementById('output-box').style.display = 'block';
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        async function executeProcess() {
            const inputVal = document.getElementById('user-input').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const outputBox = document.getElementById('output-box');
            const outputImg = document.getElementById('output-image');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');

            if (!inputVal) { alert('الرجاء إدخال البيانات المطلوبة أولاً.'); return; }

            submitBtn.disabled = true;
            outputBox.innerText = 'جاري المعالجة الإدراكية العميقة عبر النواة الحصرية...';
            outputImg.style.display = 'none';
            statusDot.className = 'dot active';
            statusText.innerText = 'معالجة نشطة...';

            const activeTool = toolsConfig[currentToolKey];

            try {
                const response = await fetch(activeTool.apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: inputVal })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || `خطأ خادم: ${response.status}`);

                if (activeTool.isImage && data.imageUrl) {
                    outputBox.style.display = 'none';
                    outputImg.src = data.imageUrl;
                    outputImg.style.display = 'block';
                    statusText.innerText = `تمت المعالجة: [${data.source}]`;
                } else {
                    outputBox.style.display = 'block';
                    outputBox.innerHTML = `<div class="fade-in-content">${window.marked.parse(data.result)}</div>`;
                    statusText.innerText = `تمت المعالجة: [${data.source}]`;
                }
            } catch (error) {
                outputBox.style.display = 'block';
                outputBox.innerHTML = `خطأ في المعالجة المعرفية:<br><strong>${error.message}</strong>`;
                statusDot.className = 'dot error';
                statusText.innerText = 'فشل التشغيل';
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
